summary: |
  A custom manager reads action versions from the build project (C-6), and
  a post-upgrade task, allowlisted in the committed configuration, runs
  the workflow generation and commits its output (C-7), so the committed
  workflows stay the build's generation (0055-F2 C-1). Risk 4: post-upgrade
  commands and two update kinds that must both regenerate.

