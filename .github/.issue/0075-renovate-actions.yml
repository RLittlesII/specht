  - "B-009 — workflow changes only by regeneration"
  - "B-013 — action update carries declaration and regenerated workflows"
  - "B-014 — NUKE update carries the regenerated workflows"
  - "B-018 — the generation completes in Renovate's own clone"
  - "§ 9 carries a row naming a test for each id above."

decisions:
