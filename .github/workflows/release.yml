name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  actions: none
  checks: none
  contents: read
  deployments: none
  id-token: none
  issues: none
  discussions: none
  packages: read
  pages: none
  pull-requests: none
  repository-projects: none
  security-events: none
  statuses: none

jobs:
  build:
    env:
      NuGetPackageSourceCredentials_specht: 'Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }};ValidAuthenticationTypes=Basic'
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: 'true'
          fetch-depth: '0'
      - name: Fetch all history for all tags and branches
        run: |
          git fetch --prune
      - name: 🔨 Use .NET 10 and 11 SDKs
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: 'global.json'
          dotnet-version: '10.0.401'
      - name: Specht
        id: specht
        run: |
          ./build.cmd --target Specht
      - name: 🎁 Restore
        id: restore
        run: |
          ./build.cmd --target Restore --skip Specht
      - name: Verify Tag
        id: verifyTag
        run: |
          ./build.cmd --target VerifyTag --skip Restore
      - name: Format
        id: format
        run: |
          ./build.cmd --target Format --skip Restore
      - name: ⚙️ Compile
        id: compile
        run: |
          ./build.cmd --target Compile --skip Restore Format
      - name: Code Analysis
        id: codeAnalysis
        run: |
          ./build.cmd --target CodeAnalysis --skip Compile
      - name: 💨 Unit Test
        id: unitTest
        run: |
          ./build.cmd --target UnitTest --skip CodeAnalysis
      - name: 💨 Integration Test
        id: integrationTest
        run: |
          ./build.cmd --target IntegrationTest --skip UnitTest
      - name: 💨 Acceptance Test
        id: acceptanceTest
        run: |
          ./build.cmd --target AcceptanceTest --skip IntegrationTest
      - name: 💨 Test
        id: test
        run: |
          ./build.cmd --target Test --skip Compile UnitTest IntegrationTest AcceptanceTest
      - name: ⚙️ Build
        id: build
        run: |
          ./build.cmd --target Build --skip Test
      - name: 🚀 Publish Comparator
        id: publishComparator
        continue-on-error: true
        run: |
          ./build.cmd --target PublishComparator --skip Build
      - name: 🏺 Upload the comparator
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: 'true'
          if-no-files-found: 'error'
          name: 'comparator'
          path: '.artifacts/comparator'
          retention-days: '1'
      - name: 📦 Pack
        id: pack
        run: |
          ./build.cmd --target Pack --skip Build
      - name: 🏺 Upload the package
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: 'true'
          if-no-files-found: 'error'
          name: 'nupkg'
          path: '.artifacts/nupkg/*.nupkg'
          retention-days: '1'
      - name: Release
        id: release
        run: |
          ./build.cmd --target Release --skip VerifyTag Pack PublishComparator
  release:
    needs:
      - build
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      actions: read
      checks: none
      contents: write
      deployments: none
      id-token: none
      issues: none
      discussions: none
      packages: write
      pages: none
      pull-requests: none
      repository-projects: none
      security-events: none
      statuses: none
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: 'true'
          fetch-depth: '0'
          persist-credentials: 'false'
      - name: 🚀 Download the package
        uses: actions/download-artifact@v4
        with:
          name: 'nupkg'
          path: '.artifacts/nupkg'
      - name: 🔨 Use .NET 10 and 11 SDKs
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: 'global.json'
          dotnet-version: '10.0.401'
      - name: Push release packages
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        run: |
          ./build.cmd --target PushReleasePackages
      - name: Create GitHub Release
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        run: |
          ./build.cmd --target CreateGitHubRelease
      - name: 🚀 Download the comparator
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: 'comparator'
          path: '.artifacts/comparator'
      - name: Request the release comparison
        id: comparisonRequest
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        continue-on-error: true
        run: |
          dotnet .artifacts/comparator/specht.comparison.dll request .artifacts/benchmarks/comparison/request
      - name: 🏺 Upload the comparison request
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: 'true'
          if-no-files-found: 'error'
          name: 'comparison-request-${{ github.run_id }}-${{ github.run_attempt }}'
          path: '.artifacts/benchmarks/comparison/request'
          retention-days: '1'
      - name: Attach the comparison report
        id: comparisonAttach
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        continue-on-error: true
        run: |
          dotnet .artifacts/comparator/specht.comparison.dll attach .artifacts/benchmarks/comparison/request
      - name: Summarise a comparator that did not run
        id: comparisonAttachSummary
        if: ${{ steps.comparisonAttach.outcome != 'success' }}
        continue-on-error: true
        run: |
          printf '## Release baseline comparison\n\nIncomplete: the comparator did not run. Re-run all jobs to retry.\n' >> "$GITHUB_STEP_SUMMARY"
  comparison:
    needs:
      - build
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      actions: read
      checks: none
      contents: read
      deployments: none
      id-token: none
      issues: none
      discussions: none
      packages: none
      pages: none
      pull-requests: none
      repository-projects: none
      security-events: none
      statuses: none
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          clean: 'true'
          fetch-depth: '0'
          persist-credentials: 'false'
      - name: 🔨 Use .NET 10 and 11 SDKs
        continue-on-error: true
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: 'global.json'
          dotnet-version: '10.0.401'
      - name: 🚀 Download the comparator
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: 'comparator'
          path: '.artifacts/comparator'
      - name: Compare against the previous release
        id: comparisonCompare
        env:
          GITHUB_TOKEN: '${{ github.token }}'
        continue-on-error: true
        run: |
          dotnet .artifacts/comparator/specht.comparison.dll compare .artifacts/benchmarks/comparison/result
      - name: 🏺 Upload the comparison result
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: 'true'
          if-no-files-found: 'error'
          name: 'comparison-result-${{ github.run_id }}-${{ github.run_attempt }}'
          path: '.artifacts/benchmarks/comparison/result'
          retention-days: '1'
      - name: Summarise a comparator that did not run
        id: comparisonCompareSummary
        if: ${{ always() && steps.comparisonCompare.outcome != 'success' }}
        continue-on-error: true
        run: |
          printf '## Release baseline comparison\n\nIncomplete: the comparator did not run. Re-run all jobs to retry.\n' >> "$GITHUB_STEP_SUMMARY"
