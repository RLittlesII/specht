name: main

on:
  push:
    branches:
      - 'main'
permissions:
  actions: none
  checks: none
  contents: read
  deployments: none
  id-token: none
  issues: none
  discussions: none
  packages: none
  pages: none
  pull-requests: none
  repository-projects: none
  security-events: none
  statuses: none

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: 'false'
          fetch-depth: '0'
          ref: '${{ github.event.pull_request.head.sha }}'
      - name: Fetch all history for all tags and branches
        run: |
          git fetch --prune
      - name: Decide whether the change needs a build
        id: changes
        env:
          EVENT_NAME: '${{ github.event_name }}'
          BASE_SHA: '${{ github.event.pull_request.base.sha }}'
          HEAD_SHA: '${{ github.event.pull_request.head.sha }}'
        shell: bash
        run: |
          build=true
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$RUNNER_OS" = "Windows" ]; then
          build=false
          echo "::notice title=Windows gates skipped::The Windows gates run on a push to main only."
          elif [ "$EVENT_NAME" = "pull_request" ] && files="$(git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA")" && [ -n "$files" ]; then
          if ! grep -Evq '\.md$' <<< "$files" && ! grep -Eq '(^|/)\.spec/' <<< "$files"; then
          build=false
          echo "::notice title=Build skipped::Every changed file is Markdown outside any .spec/ folder."
          fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
      - name: 🔨 Use .NET 10 SDK
        if: ${{ steps.changes.outputs.build == 'true' }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Specht
        id: specht
        env:
          EVENT_NAME: '${{ github.event_name }}'
          BASE_SHA: '${{ github.event.pull_request.base.sha }}'
          HEAD_SHA: '${{ github.event.pull_request.head.sha }}'
          MATRIX_OS: '${{ matrix.os }}'
        if: ${{ steps.changes.outputs.build == 'true' }}
        run: |
          ./build.cmd --target Specht
      - name: 🎁 Restore
        id: restore
        if: ${{ steps.changes.outputs.build == 'true' }}
        run: |
          ./build.cmd --target Restore --skip Specht
      - name: Format
        id: format
        if: ${{ steps.changes.outputs.build == 'true' }}
        run: |
          ./build.cmd --target Format --skip Restore
      - name: ⚙️ Compile
        id: compile
        if: ${{ steps.changes.outputs.build == 'true' }}
        run: |
          ./build.cmd --target Compile --skip Restore Format
      - name: 💨 Unit Test
        id: unitTest
        if: ${{ steps.changes.outputs.build == 'true' }}
        run: |
          ./build.cmd --target UnitTest --skip Compile
      - name: 💨 Integration Test
        id: integrationTest
        if: ${{ steps.changes.outputs.build == 'true' }}
        run: |
          ./build.cmd --target IntegrationTest --skip UnitTest
      - name: 💨 Acceptance Test
        id: acceptanceTest
        if: ${{ steps.changes.outputs.build == 'true' }}
        run: |
          ./build.cmd --target AcceptanceTest --skip IntegrationTest
      - name: Upload coverage to Codecov
        id: codecov
        if: ${{ (!cancelled() && matrix.os == 'ubuntu-latest') && steps.changes.outputs.build == 'true' }}
        continue-on-error: true
        uses: codecov/codecov-action@v5
        with:
          token: '${{ secrets.CODECOV_TOKEN }}'
          directory: '.artifacts/coverage'
          override_commit: '${{ github.event.pull_request.head.sha || github.sha }}'
          fail_ci_if_error: 'true'
      - name: Warn on a failed coverage upload
        if: ${{ (!cancelled() && steps.codecov.outcome == 'failure') && steps.changes.outputs.build == 'true' }}
        run: |
          echo "::warning title=Codecov upload failed::The coverage upload to Codecov failed; this check is not failed on that account."
      - name: 💨 Test
        id: test
        if: ${{ steps.changes.outputs.build == 'true' }}
        run: |
          ./build.cmd --target Test --skip Compile UnitTest IntegrationTest AcceptanceTest
      - name: ⚙️ Build
        id: build
        if: ${{ steps.changes.outputs.build == 'true' }}
        run: |
          ./build.cmd --target Build --skip Test
      - name: Continuous Integration
        id: continuousIntegration
        if: ${{ steps.changes.outputs.build == 'true' }}
        run: |
          ./build.cmd --target ContinuousIntegration --skip Build
