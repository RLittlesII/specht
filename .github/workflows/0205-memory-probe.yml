name: 0205 memory feasibility probe
on:
  push:
    branches: ['0205/tool-memory-feasibility']
    paths: ['.artifacts/0205/probe/**', '.github/workflows/0205-memory-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - name: Run temporary synthetic probes
        shell: bash
        run: python .artifacts/0205/probe/run.py | tee probe-results.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 0205-${{ matrix.os }}
          path: probe-results.jsonl
