name: ci

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'
permissions:
  actions: none
  checks: none
  contents: read
  deployments: none
  id-token: none
  issues: none
  discussions: none
  packages: none
  pages: none
  pull-requests: none
  repository-projects: none
  security-events: none
  statuses: none

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: 'false'
          fetch-depth: '0'
          ref: '${{ github.event.pull_request.head.sha }}'
      - name: Fetch all history for all tags and branches
        run: |
          git fetch --prune
      - name: 🔨 Use .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: 🎁 Restore
        id: restore
        run: |
          ./build.cmd --target Restore
      - name: Format
        id: format
        run: |
          ./build.cmd --target Format --skip Restore
      - name: ⚙️ Compile
        id: compile
        run: |
          ./build.cmd --target Compile --skip Restore
      - name: 💨 Test
        id: test
        run: |
          ./build.cmd --target Test --skip Compile
      - name: Upload coverage to Codecov
        id: codecov
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: codecov/codecov-action@v5
        with:
          token: '${{ secrets.CODECOV_TOKEN }}'
          files: '.artifacts/coverage/**/*.cobertura.xml'
          disable_search: 'true'
          override_commit: '${{ github.event.pull_request.head.sha || github.sha }}'
          fail_ci_if_error: 'true'
      - name: Warn on a failed coverage upload
        if: ${{ !cancelled() && steps.codecov.outcome == 'failure' }}
        run: |
          echo "::warning title=Codecov upload failed::The coverage upload to Codecov failed; this check is not failed on that account."
      - name: Spec Check
        id: specCheck
        run: |
          ./build.cmd --target SpecCheck --skip Test
      - name: Continuous Integration
        id: continuousIntegration
        run: |
          ./build.cmd --target ContinuousIntegration --skip Format Compile Test SpecCheck
