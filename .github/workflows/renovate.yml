name: renovate

on:
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:
permissions:
  actions: none
  checks: none
  contents: read
  deployments: none
  id-token: none
  issues: none
  discussions: none
  packages: none
  pages: none
  pull-requests: none
  repository-projects: none
  security-events: none
  statuses: none

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: 'false'
      - name: Read the pinned .NET SDK
        shell: bash
        run: |
          echo "DOTNET_SDK_VERSION=$(jq -r .sdk.version global.json)" >> "$GITHUB_ENV"
      - name: Renovate
        env:
          RENOVATE_REPOSITORIES: '${{ github.repository }}'
        uses: renovatebot/github-action@v46.3.7
        with:
          token: '${{ secrets.RENOVATE_TOKEN }}'
          configurationFile: '.github/renovate-global.json'
          docker-cmd-file: '.github/renovate-entrypoint.sh'
          docker-user: 'root'
          additional-env-list: 'DOTNET_SDK_VERSION'
