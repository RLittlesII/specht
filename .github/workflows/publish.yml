name: publish

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  actions: none
  checks: none
  contents: read
  deployments: none
  id-token: none
  issues: none
  discussions: none
  packages: none
  pages: none
  pull-requests: none
  repository-projects: none
  security-events: none
  statuses: none

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: 'false'
          fetch-depth: '0'
      - name: Fetch all history for all tags and branches
        run: |
          git fetch --prune
      - name: 🔨 Use .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: 🎁 Restore
        id: restore
        run: |
          ./build.cmd --target Restore
      - name: Verify Tag
        id: verifyTag
        run: |
          ./build.cmd --target VerifyTag --skip Restore
      - name: Format
        id: format
        run: |
          ./build.cmd --target Format --skip Restore
      - name: ⚙️ Compile
        id: compile
        run: |
          ./build.cmd --target Compile --skip Restore
      - name: 💨 Test
        id: test
        run: |
          ./build.cmd --target Test --skip Compile
      - name: Spec Check
        id: specCheck
        run: |
          ./build.cmd --target SpecCheck --skip Test
      - name: 📦 Pack
        id: pack
        run: |
          ./build.cmd --target Pack --skip Compile
      - name: 🏺 Upload the package
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: 'true'
          if-no-files-found: 'error'
          name: 'nupkg'
          path: '.artifacts/nupkg/*.nupkg'
          retention-days: '1'
  publish:
    needs:
      - build
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      actions: none
      checks: none
      contents: read
      deployments: none
      id-token: none
      issues: none
      discussions: none
      packages: write
      pages: none
      pull-requests: none
      repository-projects: none
      security-events: none
      statuses: none
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Download the package
        uses: actions/download-artifact@v4
        with:
          name: 'nupkg'
          path: '.artifacts/nupkg'
      - name: 🔨 Use .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Push
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        shell: bash
        run: |
          dotnet nuget push ".artifacts/nupkg/specht.tool.${GITHUB_REF_NAME#v}.nupkg" --source "https://nuget.pkg.github.com/rlittlesii/index.json" --api-key "$GITHUB_TOKEN"
