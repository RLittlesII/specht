name: mirror

on:
  push:
    branches:
      - 'main'
    paths:
      - '**/.issue/**'
      - 'epics/**/epic.md'
      - '.github/mirror/**'
      - '.github/workflows/mirror.yml'
  workflow_dispatch:
    inputs:
      backfill:
        type: boolean
        description: 'Post every missing Delivers comment'
        required: false
        default: false
permissions:
  actions: none
  checks: none
  contents: read
  deployments: none
  id-token: none
  issues: write
  discussions: none
  packages: none
  pages: none
  pull-requests: write
  repository-projects: none
  security-events: none
  statuses: none
concurrency:
  group: 'mirror'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: 'false'
          fetch-depth: '0'
      - name: Mirror the work items
        env:
          GH_TOKEN: '${{ github.token }}'
        shell: bash
        run: |
          python3 .github/mirror/mirror_items.py --apply --repo "${{ github.repository }}" \
          --before "${{ github.event.before }}" --after "${{ github.event.after }}" \
          ${{ inputs.backfill && '--backfill' || '' }}
