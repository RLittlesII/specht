summary: |
  `.github/mirror/mirror_items.py`, standard-library Python driving `gh`
  (C-7, decision 0007): it reads the tree, the history of `main` and the
  marked issues, computes a plan, and with `--dry-run` prints it, with
  `--apply` writes it one write at a time (C-10), against the repository
  `--repo` names, with a backfill mode for B-027, and writes the step
  summary. Items are read through the item reader in
  `.agents/skills/specht-conventions/scripts/next.py`, extended to key
  items by path and to read every field the mirror needs; the raw file is
  read only for B-021. The plan is tested with `unittest` against a fake
  `gh` and a synthetic git log (C-11, decision 0005), and a build target
  runs the tests. OQ-8 is open: the implementer proposes the target, and
  the `0055-F1` amendment for a new target and the `0055-F2` amendment for
  CI's pull-request build running it, which are spec-author's to write
  before the build changes. OQ-4's default applies: a sub-issue link the
  cap refuses is counted skipped and named. Status
  ready-for-architecture: § 6 and § 7 are pending and OQ-8 is open. Risk
  4: the queue script's reader changes under it, and delivery is derived
  from git history across squash and rebase merges (A-2).

