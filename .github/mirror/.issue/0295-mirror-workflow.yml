summary: |
  `.build/SpechtBuild.Mirror.cs`, following `.build/SpechtBuild.Renovate.cs`,
  generates the committed `.github/workflows/mirror.yml` (C-6, `0055-F2`
  C-1): a push to `main` on the trigger paths of B-036 and a manual
  dispatch with a backfill input that starts 0294's backfill mode (B-027),
  one concurrency group that queues and never cancels, and the
  workflow's `GITHUB_TOKEN` with `issues: write`, `pull-requests: write`
  and `contents: read` only (C-5). The job checks out the full history of
  `main` (A-4). OQ-5's default applies: GitHub's hosted `ubuntu-latest`,
  as `renovate`. How § 9 covers workflow claims is § 8's, test-writer's;
  `0055-F2` § 8 leaves the CI workflow's mechanisms untested, and 0073
  recorded that precedent. Risk 2: one generated workflow on an existing
  pattern.

acceptance_criteria:
  - "B-036 — a push to `main` on `**/.issue/**`, `epics/**/epic.md`, `.github/mirror/**` or the workflow file runs it"
  - "B-037 — a manual start runs it"
  - "B-038 — a push off those paths does not run it"
  - "B-039 — no run on another branch or a pull request"
  - "B-040 — runs queue, none cancelled"
  - "C-5 — `GITHUB_TOKEN`, three permissions, no secret"
  - "C-6 — generated by the build and committed; the generation diff reviewed for step order"
  - "§ 9 carries a row naming a test for each id above."

