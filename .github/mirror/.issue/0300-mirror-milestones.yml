summary: |
  Pull request 565 put the release plan into `.issue/.goal` as milestones,
  and the owner asked of it: "so no `.github/milestones.yml`? No milestones
  cut?" The answer is decision 0011: the mirror keeps one marked GitHub
  milestone per versioned section of the goal file and gives each open
  item's issue the milestone of the earliest section whose closure holds
  it, with the goal file still the record. Value 3: a reader on GitHub
  sees which release an issue belongs to and how far each release is.
  Risk 3: a new kind of write to GitHub, and the closure is the queue's
  `reach`, shared rather than copied (C-7). Depends on nothing: the first
  live run, 0296, mirrors the milestones too whichever lands first.

acceptance_criteria:
  - "B-029 — matching milestones: nothing written"
  - "B-041 — the step summary counts milestones"
  - "B-055 — one open milestone per versioned section"
  - "B-056 — the `specht-milestone` marker; an unmarked namesake adopted"
  - "B-057 — the earliest section's milestone for an open item"
  - "B-058 — no milestone outside every closure"
  - "B-059 — a done item keeps its milestone"
  - "B-060 — a marked milestone with no section closed, never deleted"
  - "B-061 — an unmarked milestone with no section untouched"
  - "B-062 — a flat goal file moves no issue's milestone"
  - "B-063 — an epic keeps its milestone"
  - "§ 9 carries a row naming a test for each id above."

decisions:
  - |
    2026-10-25, the repository owner: mirror the goal file's milestones
    through the work-item mirror rather than keep a `.github/milestones.yml`
    or a `milestone:` key in Feature specifications (decision 0011).

