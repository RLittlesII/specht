decisions:
  - |
    2026-10-24, at the cut from the approved specification: sliced into
    the mirror script with the extended shared item reader and its unit
    tests (0294), the generated workflow that runs it (0295, after 0294),
    and the first live run with backfill and the documentation deltas
    § 10 records as owed (0296, after 0294 and 0295). Every claim the
    script's plan and writes satisfy is 0294's; the trigger and
    concurrency claims B-036 to B-040 are 0295's; 0296 carries no claim,
    since § 9's tests for every claim are 0294's and 0295's. OQ-4, OQ-5
    and OQ-8 stay open with their defaults.

