summary: |
  As a reader of this repository on GitHub, I want every work item and
  epic on `main` shown as a read-only issue, open or closed as the item
  is and linked to its parent and to the pull request that delivered it,
  so that the roadmap and what is done are visible without a clone, while
  the work items stay the tracker and nothing on GitHub is read back.
  Value 3: it removes § 1's failure state for readers on GitHub but ships
  nothing in `specht.tool` (C-9) and sits on no `.issue/.goal` path.
  Risk 4: about 275 public issues written with an `issues: write` token,
  delivery derived from git history, and the queue script's reader
  changed under it (C-7).

