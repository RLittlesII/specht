summary: |
  As the maintainer, I want the settings that make a check binding
  written down and applied by hand, so that the GitHub configuration is
  reviewable and nothing about it lives only on a settings page.

acceptance_criteria:
  - "B-001 — a pull request required before `main` (0090)"
  - "B-002 — required CI checks are exactly the per-system checks (0090)"
  - "B-003 — no coverage status required (0090)"
  - "B-004 — squash merging with commit messages (0090)"
  - "B-005 — rebase merging on, merge commits off (0090)"
  - "B-006 — auto-merge enabled (0090)"
  - "B-007 — every secret a workflow reads named, with its workflow (0091)"
  - "B-008 — Codecov installation named, no Renovate app (0091)"
  - "B-009 — GitHub issues kept enabled (0091)"
  - "B-010 — visibility public (0091)"
  - "B-011 — no approving review required (0090)"
  - "§ 9 carries a row naming a test for each id above."

decisions:
  - |
    2026-10-08, Claude at the owner's request: sliced into branch protection
    and merging (0090), which names the checks 0055-F2 and 0055-F3 produce,
    and secrets, installations and repository-wide settings (0091), which
    name what 0055-F3 and 0055-F4 read. Applying the checklist after the
    first push is the owner's act, not an item (decision 0001).

