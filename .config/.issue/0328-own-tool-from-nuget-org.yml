summary: |
  After the first nuget.org release, move `.config/dotnet-tools.json`'s
  `specht.tool` pin from `0.1.131`, published only to GitHub Packages, to
  that preview version, and remove the `specht` package source from
  `nuget.config` and the `NuGetPackageSourceCredentials_specht`
  credential from this repository's runs (0055-F6 decision 0007, its
  Transition).

  Waits on 0327, which moves the release path, and on the maintainer
  pushing the first `v*-preview` tag after it merges. No item tracks the
  tag, which is the maintainer's act (0055-F6 § 5 row 5), so this item is
  `blocked` until that version is on nuget.org; then it becomes `ready`.

