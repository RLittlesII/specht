summary: |
  Move "Log in to NuGet" and "Push release packages" out of the `release`
  job into a new `publish` job of the same generated `release.yml`, the
  only job granted `id-token: write` (0055-F6 decision 0008).

  Item 0327 gave the `release` job `id-token: write`, and item 0214 then
  put 0109-F5's advisory comparison steps in the same job, `attach`'s
  wait of up to 100 minutes among them. With the grant, the runner sets
  the OIDC request credential in every step's environment, so during the
  wait a measured revision on the same host and operating-system account
  could mint a nuget.org push key. 0109-F5 A-5 accepts a same-host
  exposure for the workflow token only; in its own job the publishing
  credential exists only while the login and the push run, before the
  receipt that starts collection.

  `publish` needs `build`, carries the tag-push condition, is granted
  contents read and `id-token: write` only, runs on GitHub-hosted
  `ubuntu-latest` rather than the self-hosted pool, and runs a checkout
  that persists no credential, the download of this run's `nupkg`
  artifact, the SDK, the login and the push. `release` needs `publish`, holds actions read and contents
  write with `id-token: none`, and keeps "Create GitHub Release" and the
  comparison steps. `comparison` is unchanged.

  The GitHub Release attaches no package, so `release` downloads none
  and keeps only its checkout and SDK steps before "Create GitHub
  Release" (0055-F6 decision 0009).

acceptance_criteria:
  - "B-008 — a dry run runs every `build` step, the upload included, and skips the `publish` and `release` jobs"
  - "C-5 — the `publish` job obtains the trusted-publishing key; the `release` job's contents-write token creates the Release"
  - "C-7 — `id-token: write` in `publish` only, contents write in `release` only, `release` needs `publish`, no package write in any job"
  - "C-9 — `build` and `release` run on `[self-hosted, macOS, ARM64]` from a clean checkout; `publish` runs on GitHub-hosted `ubuntu-latest` and pushes only the packages it downloads from this run's `nupkg` artifact"
  - "0109-F5 C-12 — the comparison job stays on the pool; `publish` is the one job of the release run on another runner provider"
  - "0109-F5 C-10 — no measured revision runs with a publishing credential; the `publish` job holds no contents write"
  - "A rerun of all jobs reruns the push with `--skip-duplicate` and keeps a Release already published at the run's commit (0109-F5 A-6)."
  - "`release.yml` is regenerated by `./build.sh Compile` from `.build/SpechtBuild.Release.cs`, never edited by hand."
  - "0055-F6 § 6 and § 7 and 0109-F5 § 7 describe the four jobs as built."
  - "§ 9 of 0055-F6 carries a row naming a test for B-008."
  - "B-004, B-007, C-4 — the GitHub Release attaches no package; the `release` job downloads no `nupkg` artifact and `CreateGitHubRelease` reads no package file; `publish` still downloads and pushes both (0055-F6 decision 0009)"
  - "0109-F5 A-6 — a Release that is published, not a draft, under this tag and at this run's commit is kept, with no asset check"
  - "0201-F6 B-020 — both packages are published at the repository release version, and neither is attached to the Release"
  - "§ 9 of 0055-F6 marks B-007 `Withdrawn`, and no scenario carries `@B-007`."

decisions:
  - |
    2026-11-01, the repository owner, in chat. Asked "Does A-5's accepted
    exposure also cover the nuget.org OIDC credential?", the owner first
    answered "Yes, accept it". Asked "Which answer stands for the NuGet
    credential?", the owner answered "Separate publish job", which
    supersedes the first answer. Recorded as 0055-F6 decision 0008 and in
    0109-F5 decision 0005's addendum. Rejected: accepting the exposure.
  - |
    2026-11-01, spec-author: the job is named `publish`, the name decision
    0001 gave the job that only pushed (0055-F6 decision 0008). Its first
    placement on the self-hosted pool, derived from 0109-F5 C-12, is
    reversed by the next entry.
  - |
    2026-11-01, the repository owner, in chat. Asked "Where should the
    `publish` job run?", with the reason that pool runners persist between
    jobs, measured revisions run on that pool, and `comparison` and
    `publish` both need only `build` and can run at the same time, the
    owner answered "GitHub-hosted runner". The publishing credential then
    never sits on a host where measured code runs or has run. Recorded as
    0055-F6 decision 0008, "Where the job runs"; C-9 amended, 0109-F5 A-5
    and C-12 and 0055-F2 C-12 noted. The label, `ubuntu-latest`, is
    derived by spec-author: this Feature's runner before item 0264.
  - |
    2026-11-01, the repository owner, in a review comment on `release.yml`
    in pull request #668. Asked why the `release` job downloads the
    package, and told the download serves only the Release's attachment of
    both packages, which nuget.org already holds, the owner answered "If
    the release doesn't need to download ... lets remove the download".
    Recorded as 0055-F6 decision 0009: the Release carries no package, the
    `release` job reads none, and a Release already published at the run's
    commit is kept without an asset check. B-007 withdrawn; C-4, 0109-F5
    A-6 and 0201-F6 B-020 amended. Rejected: keep attaching the packages.

