summary: |
  The NUKE-generated release workflow (0055-F2 C-1), triggered by a `v*`
  tag or by hand as a dry run (OQ-4), publishing the file `Pack` wrote in
  the same run (C-4) with the workflow's own token (C-5). Everything here
  is provable by the dry run, before the first tag.

acceptance_criteria:
  - "B-001 — `v*` tag: `Format`, `Compile`, `Test`, `SpecCheck`, `Pack` on the tagged commit"
  - "B-002 — a failing target: no package pushed, no Release"
  - "B-005 — branch or non-`v*` tag: nothing published, no Release"
  - "B-008 — dry run without a tag: every step of `build`, the upload included; `publish` skipped"
  - "B-009 — tag differs from the computed version: fails before any push"
  - "§ 9 carries a row for each id above and none names a test; § 8 records the generated file read against § 7 and the hand runs of `VerifyTag` (decision 0002)."
  - "After the merge: a dry run is started on `main` under `workflow_dispatch`, and a follow-up pull request records in § 8 all eleven steps of `build` green on `ubuntu-latest`, the upload finding exactly one file in `.artifacts/nupkg`, and `publish` shown as skipped; a dry run that fails reopens this item (OQ-10, decision 0002)."

