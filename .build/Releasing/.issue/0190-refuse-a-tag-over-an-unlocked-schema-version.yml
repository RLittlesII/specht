summary: |
  The tag check refuses a `v*` tag while a schema version the tool ships
  is not in the version lock, so no version is published unfrozen
  (0001-F7 decision 0009, A-4). It fails before anything is packed, as
  the version check of B-009 does.

  Waits on 0083, which builds the tag check, and on 0188, which writes
  the lock and owns the digest. The first tag (0084) waits for this item
  (0055-F6 C-2; OQ-19, resolved by the owner 2026-10-13).

