summary: |
  First publication delivered as v0.1.90 on 2026-10-13, tagged commit
  b213a0522ad9568ca8e713fd9915b58a7b47925f. The successful tag run pushed
  specht.tool.0.1.90.nupkg and created its GitHub Release with the package
  attached. The notes cover all 150 merged pull requests reachable from
  the tag. Every recorded metadata, upstream-source and schema-lock
  prerequisite was already done in the tagged tree, as were both
  setup-guide parts.

  Reconciled on 2026-10-14 after the successful manual dry run on main:
  every build step passed, its artifact contained one package and the
  publishing job was skipped. The Feature's section 8 holds the run,
  asset, notes-range and prerequisite evidence. Decision 0003's addendum
  resolves OQ-16 for closure on these records, retaining honest Missing
  automated-coverage rows. Publication does not deliver the separate
  installation, feed-restore or version-independence items.

acceptance_criteria:
  - "B-003 — every target passing: `specht.tool` pushed to GitHub Packages on `rlittlesii/specht`"
  - "B-004 — package pushed: a GitHub Release for the tag"
  - "B-006 — Release notes generated from the pull requests since the previous `v*` tag"
  - "B-007 — the published package attached to the Release"
  - "B-011 — a `v*` tag on a commit not reachable from `main`: the run fails before anything is packed or pushed"
  - "B-012 — no earlier `v*` tag: the Release notes cover every pull request merged up to the tag"
  - "0055-F6 OQ-11 is resolved (2026-10-11): `src/tool/tool.csproj` sets `RepositoryUrl`, and items `0171`, `0172` and `0174` are `done` before the first tag is pushed"
  - "0055-F6 C-8 — items `0092`, `0095` and `0178` are `done` before the first tag is pushed; the tagged-tree evidence resolves the historical hold in 0055-F6 OQ-17"
  - "0055-F6 C-2; OQ-19 — item `0190` and its prerequisites are delivered on `main` before the first tag is pushed"
  - "0055-F6 OQ-13 — the delivering pull request merges with this item `in-review`; a follow-up pull request records the dry run and the tag's run in § 8 and writes this item `done`"
  - "§ 9 carries a row for each id above and none names a test (§ 5 #9); § 8 records the generated file read against § 7 and the hand runs of `VerifyTag`, and the follow-up pull request adds the dry run and the tag's run (0055-F6 OQ-13). 0055-F6 OQ-16 is resolved by decision 0003's 2026-10-14 addendum: this item closes on the recorded evidence while those rows honestly remain `Missing`."

decisions:
  - |
    2026-10-14, repository owner directed reconciliation with 0.1.90 and
    closure of the items its evidence satisfies. The historical first
    publication is closed on the recorded tag run, Release and package,
    complete notes inventory, existing ancestry-refusal hand run and
    successful follow-up dry run. The scoped record-based exception is
    0055-F6 decision 0003's addendum; no new tag or publication is made.
    closed names the reconciliation date, not the earlier publication.
  - |
    2026-10-13, repository owner: "the first release waits for 0190."
    OQ-19 is resolved; 0190 joins depends_on. Its prerequisites carry
    the schema lock without adding unrelated versioning work to MVP.
  - |
    2026-10-11, spec-author, on the repository owner's ruling "publish
    now!" (0001-F7 decision 0007): `0010` and `0004` removed from
    `depends_on`, which C-2 no longer asks for. The ruling orders the
    work; it pushes no tag. `risk` is unchanged and was not re-scored.
  - |
    2026-10-11, spec-author, derived from OQ-11 as resolved that day: what
    the package says about itself "lands before item 0084's tag", so
    `0171` (its id), `0172` (its repository, commit and the rest) and
    `0174` (what it must not carry) join `depends_on`. A published version
    stays (§ 5 #4), so the first one is not pushed under the wrong id or
    with the specification tree inside it. Not an owner ruling.

  - |
    2026-10-11, spec-author, on the repository owner's four rulings of
    that day (0055-F6 decision 0003): `VerifyTag` checks ancestry
    (OQ-12, B-011); the target `Publish` becomes `Release`, an aggregate
    that pushes nothing; the rename reaches the source file, the
    enhancement, the workflow `release.yml` and the job `release`; `gh`
    creates the GitHub Release as a step of the `release` job, which
    gains `contents: write` (C-5, C-7). B-012 is derived from B-006 by
    spec-author and is not an owner ruling.
  - |
    2026-10-11, spec-author, the closing rule (0055-F6 OQ-13), a default
    derived in planning and approved by the owner as part of the plan: a
    tag's run uses the tagged commit's workflow, so the delivering pull
    request merges with this item `in-review`; the owner dry-runs
    `main`, cuts the tag with `dotnet nbgv tag` and pushes it; a
    follow-up pull request records the runs and writes `done` and
    `closed:`. The same dry run pays the one item `0083` left unrecorded.
    The fifth acceptance criterion was stale and is corrected: the file
    is `src/tool/tool.csproj`, it sets `RepositoryUrl`, and OQ-11 is
    resolved.
  - |
    2026-10-11, spec-author, after spec-reviewer round 5 (0055-F6 § 12):
    the criterion "§ 9 carries a row naming a test for each id above"
    cannot be met under § 5 #9 and is reworded as item `0083`'s was. No
    record yet lets this item close with its six rows `Missing`:
    decision 0002 names item `0083`'s five claims only, so that is
    0055-F6 OQ-16, open and not put to the owner. `status` is
    `in-review`, as OQ-13 has the delivering pull request merge.
  - |
    2026-10-11, spec-author, on the repository owner's ruling of that day
    (0055-F6 decision 0004): "Okay, this is a HUGE gap. We can't release
    without this. We need to solve this asap." `0092`, `0095` and `0178`
    join `depends_on` (C-8). The three are spec-author's reading of the
    ruling, proposed in OQ-17 and not ratified; `0178` is `blocked` on
    0001-F4 OQ-6, so the tag waits on that answer. `status` stays
    `in-review`: pull request #124 merged the workflow and no tag was
    pushed. Nothing mechanical stops a `v*` tag; the hold is this record.
    `risk` is unchanged and was not re-scored.

