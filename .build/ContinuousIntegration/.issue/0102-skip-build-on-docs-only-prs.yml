  changes only Markdown outside any `.spec/` folder; if so, run no target
  and pass the check, and otherwise build as today. A push to `main` always
  builds. Risk 3: the workflow is generated (C-1), the decision runs on two
  shells, and a wrong answer either skips a gate on a code change or leaves
  a required check pending on every pull request.

