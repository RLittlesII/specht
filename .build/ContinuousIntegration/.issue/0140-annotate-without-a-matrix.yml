summary: |
  No pull request has carried a specification annotation, or sent coverage
  to Codecov, since pull request 97 (`dc59b81`). That change split the one
  workflow in two: `ci`, a pull request on `ubuntu-latest` alone, and
  `main`, a push on both images. A workflow with one image is generated
  with no matrix, so `matrix.os` is the empty string there. Two conditions
  still read it: `AnnotateChangedFiles` returned unless `MATRIX_OS` was
  `ubuntu-latest`, and the Codecov upload step ran only when
  `matrix.os == 'ubuntu-latest'`. Both were false on every pull request,
  and nothing failed.

  Seen on pull request 99, run 38102606537: 316 `error SPEC###` lines in
  the log, 76 of them in files the pull request changed, and no
  `::error file=` command.

  Both conditions now read the runner's own operating system, as the
  `changes` step already does (`0055-F2` § 7): `RUNNER_OS` in the target,
  `runner.os` in the step. The runner sets it whether or not the workflow
  has a matrix, so the same condition holds in `ci` and in `main`.

  Risk 1: two conditions and one `env` entry in a generated workflow
  (C-1); the step order is unchanged.

