summary: |
  The repository pins schema 0.4.0, which reports four-digit rule IDs.
  Diagnostic() in .build/SpechtBuild.GitHubActions.cs only recognizes
  three digits after SPEC. AnnotateChangedFiles therefore drops current
  diagnostics before it can annotate the diff. Three-digit IDs remain
  valid for older schema pins.

acceptance_criteria:
  - "B-006 — errors and warnings using either supported rule-ID width annotate the changed file and line on the macOS pull request check."
  - "C-6 — a violation outside the PR diff produces no annotation. Existing checker output and exit handling are preserved."
  - "Record verification of both ID widths and of the changed-file filter."

decisions:
