summary: |
  As the maintainer, I want pull requests to build on macOS and pushes to
  `main` to build on macOS and Windows, from workflows
  NUKE generates, so that nothing reaches `main` that the build has not
  passed, and `main` is proven everywhere the tool runs.

  The workflow (0064) is, with the build scaffold (0057), the
  infrastructure every epic 0001 root item waits on (0021, 0051).

acceptance_criteria:
  - "B-001 — pull request to `main`: build the head on macOS (0064, 0102, 0264)"
  - "B-002 — push to `main`: build on the commit (0064)"
  - "B-003 — a push to main builds once on macOS and once on Windows (0064, 0264)"
  - "B-004 — correctness gates through the entry script, with benchmarks on pushes to main (0064, 0114, 0149)"
  - "B-005 — any target fails: that system's check fails (0064)"
  - "B-006 — a specification violation annotated on the diff (0066, 0447)"
  - "B-007 — each system's check keeps its name across runs (0064)"
  - "B-008 — no package pushed (0064)"
  - "B-010 — separate macOS and Windows checks on main (0064, 0264)"
  - "B-011 — checker restored from NuGet without a package-read credential"
  - "B-012 — Markdown-only pull request: no target runs (0102)"
  - "B-013 — a documentation-only pull request passes its macOS build check (0102)"
  - "B-014 — no changed files, or none determinable: build on macOS (0102, 0264)"
  - "B-015 — a pull request reports one macOS build check (decision 0007)"
  - "§ 9 carries a row naming a test for each id above."

decisions:
