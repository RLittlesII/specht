summary: |
  As the maintainer, I want every pull request to run the build on Linux
  and every push to `main` to run it on Linux and Windows, from a workflow
  NUKE generates, so that nothing reaches `main` that the build has not
  passed, and `main` is proven everywhere the tool runs.

  The workflow (0064) is, with the build scaffold (0057), the
  infrastructure every epic 0001 root item waits on (0021, 0051).

acceptance_criteria:
  - "B-001 — pull request to `main`: build on ubuntu, on its head (0064; the B-012 exception, 0102; ubuntu alone, 0118)"
  - "B-002 — push to `main`: build on the commit (0064)"
  - "B-003 — once each on ubuntu and windows (0064)"
  - "B-004 — `Format`, `Compile`, the three tier targets, `Specht` and `Benchmark` through the entry script, where neither B-012 nor B-015 applies (0064; tiers, 0114; B-015, 0118; `Benchmark` owed with the item that delivers `0109-F1` B-017)"
  - "B-005 — any target fails: that system's check fails (0064)"
  - "B-006 — a specification violation annotated on the diff (0066)"
  - "B-007 — each system's check keeps its name across runs (0064)"
  - "B-008 — no package pushed (0064)"
  - "B-010 — each system reports as a separate check (0064)"
  - "B-011 — tool restored from the feed with the workflow's token (0067)"
  - "B-012 — Markdown-only pull request: no target runs (0102)"
  - "B-013 — a skipped pull request's checks pass (0102)"
  - "B-014 — no changed files, or none determinable: the build runs on ubuntu (0102; ubuntu alone, 0118)"
  - "B-015 — pull request: no target runs on windows (0118)"
  - "B-016 — pull request: the windows check passes (0118)"
  - "§ 9 carries a row naming a test for each id above."

decisions:
  - |
    2026-10-08, Claude at the owner's request: sliced into the workflow
    itself (0064), which epic 0001 waits on, and three later additions that
    it does not: the stale-workflow check (0065), annotations, which need
    0001-F2's diagnostics (0066), and the feed restore, which needs a
    published package (0067). Rejected: annotations in 0064, which would
    hold CI behind the check command and close a cycle through 0021.
  - |
    2026-10-09, the repository owner: B-009 withdrawn; committing the
    regeneration with the build change is the author's responsibility under
    C-1 (decision 0001). The stale-workflow check (0065) is not built; 0065
    is retired at `92890af`.
  - |
    2026-10-09, the repository owner: the Windows gates run on a push to
    `main` only; on a pull request the windows leg runs no target and its
    check passes (B-015, B-016, decision 0003; item 0118).

