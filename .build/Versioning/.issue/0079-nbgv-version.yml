summary: |
  Commit `version.json` at `0.1` (OQ-1), add nbgv to the local tool
  manifest, and make it the only source of the version (C-3). Risk 3:
  public-release refs and git height are easy to get subtly wrong, and a
  shallow clone changes the number (C-2).

acceptance_criteria:
  - "B-001 — same commit, full history, two machines: same version"
  - "B-002 — later commit on `main`: higher version"
  - "B-003 — `main` or `v*` tag: no prerelease suffix"
  - "B-004 — any other ref: prerelease suffix naming the commit"
  - "B-007 — `dotnet nbgv tag` on `main` creates `v<version>`"
  - "B-008 — first `version.json`: `0.1.` on `main`"
  - "§ 9 carries a row naming a test for each id above."

