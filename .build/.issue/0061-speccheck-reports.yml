summary: |
  Once 0001-F2's check command exists and before 0001-F5's rule settings
  do, `SpecCheck` prints the check's violations and exits 0 (C-7). This
  item replaces 0057's placeholder: it points the target at the command,
  through `dotnet run --project src/specht.tool -- --root .` until a
  package exists (0001-F2 A-2), and exits 0 whatever the command reports.
  That agrees with 0001-F2 B-010 and B-011, which apply only from
  0001-F5's arrival (0001-F2 C-8), so it can be delivered alone. It
  depends on 0026 and not on 0014, because B-025's precondition is that
  0001-F5's settings do not yet exist. In the same change, B-023 is marked
  Superseded and its test removed (decision 0001).

