decisions:
  - |
    2026-10-08, Claude at the owner's request: sliced into the scaffold
    (0057) that every other item and epic 0001 build on, the tier filters
    (0058), `Format` (0059), the hook (0060), and `SpecCheck`'s two later
    states apart (0061, 0062), so the scaffold waits on nothing. Rejected:
    `SpecCheck` in one item waiting on 0026 and 0014, which would put the
    scaffold's placeholder (B-023) behind the check it stands in for, and a
    cycle through 0021, which waits on the scaffold.

