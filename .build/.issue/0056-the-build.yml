summary: |
  As a contributor, I want one NUKE build to define every gate as a named
  target, reached through `./build.sh` and `build.cmd`, with its tools
  restored from the local tool manifest and a pre-commit hook that calls
  the same gates on what is staged, so that "does this change pass" has
  one answer on every machine and in CI.

  The scaffold (0057) is the root of the whole backlog: every epic 0001
  root item (0021, 0051) waits on it and on CI (0055-F2), because
  infrastructure lands before any 0001 work. `SpecCheck` is in three
  states (C-7): a placeholder in the scaffold (B-023), report-only once
  0001-F2's command exists (0061), and a gate once 0001-F5's rule settings
  exist (0062, waiting on 0026 and 0014). Each later state supersedes the
  claim of the one before (decision 0001), and 0001-F2's 0031 follows
  0062, since 0001-F2 B-010 and B-011 apply only from 0001-F5's arrival
  (0001-F2 C-8).

