summary: |
  The step C-7 names: from 0001-F5's arrival, `Specht` exits with the
  command's code and the pre-commit hook calls it and refuses on an
  error-severity violation, and this repository's manifest lowers
  `SPEC060` to a warning (C-6) in the same change, so no window gates on a
  `Missing` row. Depends on 0026 and 0014, the two Features C-7 waits on.
  0031 then proves 0001-F2 B-010 and B-011 against this gate. In the same
  change, B-025 is marked Superseded and its test removed (decision 0001).

acceptance_criteria:
  - "B-013 — staged `.spec/` or `.feature` file and an error-severity violation: commit refused"
  - "B-024 — approved spec with a `Missing` row: `SPEC060` warning, exit 0"
  - "§ 9 carries a row naming a test for each id above."

decisions:
  - |
    2026-10-10, spec-author, recorded on delivery of item 0014 (`0001-F5`
    decision 0007 and its addendum); no call of the owner's. The `SPEC060`
    setting this item writes in this repository's manifest is this
    repository's own and reaches no consumer: `rules` is read as each
    manifest writes it and is never filled from the default manifest
    (`0001-F5` B-044, A-4), and `init` writes a manifest without the key
    (`0001-F4` B-004). A consumer that wants `SPEC060` lowered sets it in
    its own manifest. For whoever takes this item: this repository's
    manifest is also the default manifest the engine embeds and the one the
    acceptance scenarios of `0001-F5` and `0001-F6` start from, so the
    baseline proof (`0001-F5` B-016) reads it less its `rules` key, and
    `0001-F5` B-044 gains its first failing case, a consumer manifest
    naming no level for `SPEC060`.
  - |
    2026-10-10, spec-author, recorded on `spec-reviewer` round 2 of item
    0014 (`0001-F5` § 12, note (a)); no call of the owner's. The root
    `README.md` "Default manifest" block is today this repository's
    manifest less its five discovery keys, byte for byte, which is item
    0119's criterion, so it shows `"rules": {}`. `init` writes no `rules`
    key and `0001-F5` A-4 leaves `rules` out of the default. Once this item
    sets a rule level in this repository's manifest, that block would show
    this repository's own setting as the default. Owed in this item's
    change: the block leaves `rules` out, and item 0119's criterion then
    reads "less its discovery keys and its `rules` key". Item 0119 is done
    and its criterion is true of the README today, so neither it nor the
    README is changed before then.

out_of_scope:
