decisions:
  - |
    2026-11-01, the repository owner, answering a question card on
    spec-reviewer's round-7 finding on `0001-F12` (Matrix § 12):
    "Cut 0339 pin move (Recommended)". As put to the owner: one `0055-F1`
    item, delivering B-026 and B-027, that moves this repository's pin to
    0.3.0 and drops its `SPEC060` override, after 0321 and before 0334,
    delivered by the lane that delivers 0321 and the matrix rules. Each
    matrix rule's pull request then fixes the rows it reports on this
    tree, which keeps Matrix decision 0002 call 3 unreversed. Rejected:
    a Reversal of call 3 that leaves the four rules silent here until a
    later pin move. The moved pin depends on no tag: the self-check runs
    the working build of the checker (`0001-F2` decision 0014), and the published
    `specht.tool` in `.config/dotnet-tools.json` is the consumer
    installation contract only.
  - |
    2026-11-01, spec-author: delivered in 0321's pull request, not one of
    its own. This is a reading of the facts in the summary, not the
    owner's words. From 0321's cut, `0001-F4` B-004's test fails until
    the pin moves. A pull request of its own after 0321's would leave
    `main` failing between the two merges, or 0321 would move the pin
    itself, which its out_of_scope routes here. The owner's order still
    holds: this commit follows 0321's commits and precedes 0334.
  - |
    2026-11-01, spec-author: B-024 is Superseded in this change by
    B-026 and B-027. Decision 0001 does the same for B-023 and B-025,
    for its stated reason: the Given describes this repository's
    history, so a synthetic tree cannot make it hold again. § 10's entry
    of 2026-10-16 keeps B-024's scenario only "until that change lands".
    This is spec-author's reading and the owner may reverse it. No claim
    changes before this item is taken.
  - |
    2026-11-01, spec-author: parent 0056, the `0055-F1` Feature item,
    which is done. 0056 is not reopened, and B-026 and B-027 are not
    added to its `claims`. They were added on 2026-10-16, after 0056
    closed, and the item that delivers them carries them, as 0321
    carries `0001-F7` claims that 0041 does not list. Reopening 0056
    would erase what it delivered and when (0041's decision on 0042).
    Value omitted, inheriting 0056's, as its other children do.

