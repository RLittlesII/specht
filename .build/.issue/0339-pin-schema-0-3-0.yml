summary: |
  This repository's manifest moves its pin from 0.2.1 to 0.3.0 and, in
  the same change, removes `SPEC060` from its `rules` (`0001-F7` decision
  0015 call 8; C-6). From then on `Specht` reports a `Missing` row only
  on a Feature whose delivery status is done, at error (B-026, B-027).
  The manifest's other keys do not change.

  Waits on 0321, which cuts 0.3.0. It lands before 0334, the first
  matrix rule item (0224), so that each matrix rule runs on this tree
  in the pull request that builds it, and that pull request fixes the
  rows the rule reports here (Matrix decision 0002 call 3; Matrix
  decision 0003, Addendum). 0334 and 0336 wait on this item. 0337 and
  0338 follow through 0334. 0335 does not wait: SPEC022 is silent
  here, because this manifest sets no `matrix.scenarioTitles` (Matrix
  B-010).

  Delivered in 0321's pull request, as its own commit after 0321's
  commits. From 0321's cut, the test of `0001-F4` B-004
  (`ShippingCopyIntegrationTests`, the tool-owned manifest keys) holds
  the live manifest's `schemaVersion` equal to the newest embedded
  manifest's. That test therefore fails until the pin moves (`0001-F7`
  OQ-56's default; § 7 of `0001-F7` names the failure), and 0.2.1's cut
  moved the pin in its own change (commit `7d975b67`). The commit that
  moves the pin also removes the override (call 8).

  Risk 3: a done Feature with a `Missing` row stops passing. On
  2026-11-01 two Features with status done carry the missing marker in
  § 9, and every other done Feature carries none:
  `0055-F9` (`.github/mirror/.spec/`), on its rows for B-033, B-064
  and B-065; and `0201-F5` (`src/analyzers/Reconciliation/.spec/`), on
  the Test cell of its Withdrawn B-024 row. `SPEC060` reports a row
  with any missing cell, Withdrawn or not, so the four rows become
  `SPEC060` errors (`0001-F7` B-118). The hook and CI gate on them
  (C-7), so the pull request cannot merge with them. 0.3.0 also
  loosens the epic frontmatter, but only for a manifest that declares no epic grammar
  (`0001-F7` B-037, B-038). This manifest declares `identifiers.epic`,
  so the loosening is expected to change no verdict here, and the run
  confirms it.

  How what the move reveals is handled: the pull request runs
  `./build.sh Specht` with the pin moved and records each new finding
  in this item's decisions. A finding is fixed in the pull request only
  by the role that owns the cell or file. If any finding remains, the
  item stops before merging and takes the list to the owner. Restoring
  the override is not an option (C-6). § 7's sentence that this
  manifest sets `SPEC060` to warning is the implementer's to update in
  the same change.

