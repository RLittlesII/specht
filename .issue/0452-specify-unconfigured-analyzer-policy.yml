summary: |
  Report #651 point 1: AnalysisInputReader requires explicit mappings
  and currently reports an unavailable snapshot when codeAnalysis is absent.
  0201-F6 B-003 and B-017 govern enabled analysis with invalid input, but
  installation alone versus selection of analysis needs an explicit boundary.
  The standalone declaration-comment analyzer must remain independently
  scoped. Do not assume absence means clean coverage.
