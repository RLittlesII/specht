summary: |
  Lesson 0005: ids claimed twice were found by reading, because git merges two
  records that share a number under different file names without a conflict.
  Item 0127 put the rule in the delivery reference; review is all that
  enforces it. This item makes `specht` say so instead, as `SPEC###` rules
  (decisions, 2026-10-09).

  Five cases:
  (a) two files in one `decisions/`, `adr/` or `lessons/` folder sharing a
      number;
  (b) two `.issue/` items sharing an id;
  (c) a pull request adding an id that already exists on its base;
  (d) `.issue/.sequence` disagreeing with the ids present - it holds the last
      id claimed, and work items and epics share the number space;
  (e) a constraint (`C-n`) or open-question (`OQ-n`) id declared twice inside
      one specification.

  (a), (b), (d) and (e) can be seen in a single tree. (c) cannot be seen in
  the pull request's head, which is all CI checks today (`0055-F2` B-001;
  `.build/Build.GitHubActions.cs`). `specht` gains no base or diff input:
  CI runs `SpecCheck` a second time, over the merge tree, where (c) is (a),
  (b) or (e).

  Blocked: no specification states any of this yet. A new rule is a new
  major schema version (`0001-F7` C-11), so the specification deltas come
  first and this item is re-cut from their § 3 claims; until then it
  carries no claim and `spec:` stays null.

  Proposed shape. None of these ids is reserved - an id is not reserved
  until it merges (lesson 0005), and each is checked against `main` and
  every open pull request when its specification is written:
  - three Features under epic `0101`, proposed `0101-F6` to `0101-F8`:
    in-specification id uniqueness, case (e); record number uniqueness,
    case (a); work-item id allocation, cases (b) and (d);
  - a rule block, proposed `SPEC090` to `SPEC094`;
  - a `0055-F2` specification delta for the merge-tree run, case (c).

  Not asked of the owner; each is an open question for the Feature that
  meets it, not a decision:
  - the work-item rules are opt-in by a manifest key, because `.issue/*.yml`
    is this repository's tracker and not something the tool ships;
  - the rule block is `SPEC09x`, because `SPEC08x` is proposed for `0101-F1`
    to `0101-F4` (`0101-F1` OQ-1, open).

  Sequencing. The Features of epic `0101` are blocked on `0001-F7` and
  `0001-F5`: the specifications can be written now, and implementation
  waits. `SpecCheck` does not gate CI until `0001-F5`'s rule settings exist
  (`0055-F1` B-025; `0055-F2` C-4; `.build/Build.cs`), so until then neither
  run fails a pull request on these rules.

  Two items were numbered 0118 until 2026-10-10. The claim-tags item, added
  as 0118 by `9f01e20`, is now
  `src/specht/Manifest/.issue/0134-configurable-claim-tags.yml`;
  `.build/ContinuousIntegration/.issue/0118-windows-gates-on-main-only.yml`
  (`5fa5964`) keeps 0118. No id is claimed twice on trunk. A commit or
  review row from before that date that says 0118 can mean either.
  Whether the check keeps a recorded exception for a pair a repository
  knowingly keeps is open for the `0101-F8` specification (OQ-14), and is
  not decided here.

acceptance_criteria:
  - "(e) A constraint or open-question id declared twice inside one specification is reported - delivered by claims cut from § 3 of the in-specification id uniqueness Feature (proposed `0101-F6`)."
  - "(a) Two files sharing a number in one `decisions/`, `adr/` or `lessons/` folder are reported, both paths named - delivered by claims cut from § 3 of the record number uniqueness Feature (proposed `0101-F7`)."
  - "(b) Two `.issue/` items sharing an id are reported, both paths named - delivered by claims cut from § 3 of the work-item id allocation Feature (proposed `0101-F8`)."
  - "(d) `.issue/.sequence` disagreeing with the ids present is reported - delivered by claims cut from § 3 of the same Feature as (b)."
  - "This repository needs no recorded exception: the claim-tags item is 0134 and no id is claimed twice on trunk (decision of 2026-10-10). Where a pair is recorded as an exception, a claimant beyond it is still reported - as first written here on 2026-10-09, a third item numbered 0118 is still reported - delivered by claims cut from § 3 of the same Feature as (b). That clause stands until `0101-F8` OQ-14, whether the check carries a recorded exception at all, is answered, and then follows the answer."
  - "(c) On a pull request CI runs `SpecCheck` over the merge tree as well as the head, and `specht` takes no base or diff input - delivered by claims cut from the `0055-F2` § 3 delta."
  - "The new rules are errors by default, and epic `0101`'s \"all warnings by default\" is amended in the pull request that specifies the first of the three Features."
  - "Every path the rules print is repository-relative."
  - "This item is re-cut from those claims before any rule is written: `spec:`, `claims:` and these criteria then cite claim ids."
  - "specht-conventions' delivery reference names the rules where it now says review enforces the rule."

decisions:
  - |
    2026-10-09, the repository owner: the check lives in `specht`, as
    `SPEC###` rules. A new rule is a new major schema version (`0001-F7`
    C-11), so the specification deltas come first and this item is re-cut
    from their claims. Rejected: the default this item proposed, a
    build-target check in this repository run in CI beside `SpecCheck`.
  - |
    2026-10-09, the repository owner: both items numbered 0118 stay and
    neither is renumbered; the check carries that one pair as a recorded
    exception. Rejected: renumbering the one that merged second, as an
    exception to AGENTS.md § Stable IDs.
  - |
    2026-10-09, the repository owner: scope grows by two cases. (d)
    `.issue/.sequence` disagreeing with the ids present. (e) a constraint
    or open-question id declared twice inside one specification, which
    reverses this item's earlier out-of-scope row for those two id kinds.
    Claim-id uniqueness stays `SPEC030`.
  - |
    2026-10-09, the repository owner: for case (c) `specht` stays a
    deterministic, offline check over one tree. CI runs `SpecCheck` a
    second time, over the merge tree, on a pull request; that is a
    `0055-F2` specification delta. Rejected: a base or diff input to
    `specht`.
  - |
    2026-10-09, the repository owner: the new rules are errors by default,
    as `SPEC030`, `SPEC012` and `SPEC044` are. Epic `0101`'s "all warnings
    by default" is amended when the first of the new Features is
    specified. Rejected: warnings by default, as the epic words it today.
  - |
    2026-10-10, the repository owner: "renumber". Reverses the second
    decision above. The claim-tags item moves from 0118 to 0134, the next
    id from `.issue/.sequence`; the continuous-integration item keeps
    0118. Rejected: keeping both items numbered 0118 as the recorded
    exception. Not decided: whether the check keeps a recorded-exception
    mechanism now that no pair needs it - `0101-F8` OQ-14. Recorded by
    spec-author.

