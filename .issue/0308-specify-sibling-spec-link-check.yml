summary: |
  Specify an opt-in structural check for hyperlinks from one discovered
  specification to another. The preferred citation is the qualified key;
  links to the document's own scenarios and supporting records remain valid.
  Example: a hyperlink to another Feature README is reported; the bare key
  0001-F2 B-044 and a local decisions/0001-scope.md link are accepted.
  Reuse discovery and Markdown parsing. Define inline/reference-link forms,
  anchors, self-links and fenced examples without guessing from a README
  filename alone. Keep this placement check separate from 0228 key resolution.
  Time box: one session, at most two hours; return an agreement handoff.
acceptance_criteria:
  - "Specify discovered sibling-spec targets and allowed own-scenario, supporting-record and self-anchor links."
  - "Specify inline and reference-link detection, root-relative diagnostics and exclusion of fenced examples."
  - "Include positive/negative examples, renamed specification files and links containing fragments."
  - "Define opt-in configuration, default-off behavior and schema/rule vocabulary impact; unchanged consumers retain their verdicts."
  - "Hand off an agreement with claims and scenarios before implementation items."
decisions:
  - "2026-10-27, repository owner: request future Specht capability; do not enable new checks in agents. Value reflects the requested spec-process change; risk estimates bounded agreement discovery."
out_of_scope:
  - "Implementation, automatic link rewriting, key-target validation or check activation in agents."
  - "Navigation links in repository entry points, tracker paths or a general broken-link checker."
