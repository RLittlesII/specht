out_of_scope:
  - "Renumbering any existing id - AGENTS.md § Stable IDs; lesson 0005 records the one exception and does not widen it."
  - "Rewriting any existing id under a new strategy - a type not opted in is untouched, and an opted-in type mints only new ids."
  - "Changing id grammars, the frontmatter schemas, `.issue/.sequence` handling or the queue script on `main` - a follow-up item cut after the owner rules on the ADR."
  - "Building a duplicate-id check - item 0128."
  - "Building any generator, command or MCP tool on `main` - the Feature cut after the owner rules on the ADR."
  - "A consumer-supplied pluggable Strategy - kept open as a future option on the owner's word, not designed here."
  - "A fallback to the sequence - the design replaces the sequence."
  - "Editing an accepted ADR or decision record - a new record answers it."
