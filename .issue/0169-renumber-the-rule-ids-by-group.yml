summary: |
  ADR-0010 (accepted 2026-10-11,
  .spec/adr/0010-layered-engine-boundaries-with-io-at-the-edge-and-a-mediator.md),
  track R of "The order of work", from the record's § "Rule ids". It is
  the one track that is not a refactor: every rule id a consumer reads
  changes under a `0.3.0` pin, and a second golden report is added.

  Where the ids land is decided (ADR-0029, the owner's rulings of
  2026-11-02): the newest schema version in a published `specht.tool`
  package is `0.2.1`, and no package carries `0.3.0` (lesson 0016). So the
  four-digit ids are written into `0.3.0` in place and `0.3.0` is relocked
  (`0001-F7` C-17); `0.1.0`, `0.2.0` and `0.2.1` keep their three-digit
  ids (`0001-F7` C-1). This is the in-place order of criteria 1 and 2,
  applied to `0.3.0`, not `0.1.0`. Criterion 11's new `0.minor` does not
  apply.

  Rule ids become `SPEC` and four digits, the thousands digit naming the
  group; the groups and today's ids in each are ADR-0010's table. The map
  from each of `0.3.0`'s 23 ids - ADR-0010's 21 and `SPEC034` and
  `SPEC035` - to its new one is ADR-0029's, approved by the owner on
  2026-11-02.

  The owner decided a clean break with no new major schema version: "we
  haven't shipped anything" (ADR-0010 § "Rule ids"). As written, the
  specifications forbid that, so this item starts at the specification and
  no id changes until the ruling and its deltas are recorded.

  Since `0001-F7` decision 0007 (2026-10-11) neither order takes a major:
  before schema `1.0.0` a `0.minor` step may fail a tree that passed
  (`0001-F7` C-11). The same decision lets the first publish go ahead of
  `0001-F5` and `0001-F6`, so which order applies is read when this item
  starts, from whether a package has been published.

  Status and type. It is `done`, set by the pull request that delivers it:
  criteria 1 to 4 are written - ADR-0029, the deltas, the map and the
  claims - and the code followed in the same pull request (owner,
  2026-11-02). Criterion 8 was withdrawn by the owner on 2026-11-02 and
  moved to item 0342. `claims:` names the claims of
  built Features renamed to the new ids, and the three added, `0001-F1`
  B-018 and `0001-F7` B-151 and B-152. Renamed claims of unbuilt Features
  are not listed; their own items deliver them.

  It touches brief § 4, `0001-F1`, `0001-F7`, `0001-F3` (the rule pages),
  `0001-F5` (the manifest's `rules` keys) and every specification and
  scenario that names a rule id, so it sits at the repository root with
  `spec: null`.

  What is owed first, in order:

  1. A decision record of the owner's ruling, placed by blast radius -
     it changes brief § 4 and constraints of two Features, so it is
     repository-wide - saying which order applied: the unpublished
     `0.1.0` rewritten in place, or a new `0.minor` version beside the
     published `0.1.0`; neither is a major. Why an in-place rewrite is no
     precedent is already written: `0001-F7` C-1 forbids it for every
     published version (decision 0007).
  2. The deltas, by `spec-author`. The record lists brief § 4, `0001-F7`
     C-11, `0001-F1` C-10 and every rule page. Read at `eb7c161`, two more
     constraints forbid the change and the record does not list them:
     `0001-F1` C-5, "the rule vocabulary is fixed per schema version", and
     `0001-F1` C-9, under which no edit changes a violation's rule id
     until brief § 8 step 5. AGENTS.md's invariant "The rule vocabulary is
     fixed per schema version" and its `SPEC###` id scheme are in the same
     delta.
  3. The id map, old id to new id for all twenty-one, approved by the
     owner and recorded in that decision record.
  4. The claims and scenarios that name a rule id, amended by
     `spec-author` to the new ids, each keeping its `B-` id.

  Then, and only then, the code: the rule pages under
  `docs/rules/v0.3.0/`, `0.3.0`'s vocabulary in
  `src/specht/Versioning/SchemaVersions.cs`, the `rules` keys of the
  embedded `0.3.0` manifest and of this repository's own
  `.specht/manifest.json`, the id each rule reports per pinned version,
  the `0.3.0` relock and a second golden report. The files of `0.1.0`,
  `0.2.0` and `0.2.1` are not touched (ADR-0029). A folder for each group
  under `src/specht/Rules/` moved to item 0342 (owner, 2026-11-02).

  ADR-0010's open point 7 is revisited here: the vocabulary is written
  twice, in `SchemaVersions` and as the rules' ids, held equal by the
  composition test. After this item a rule reports a different public id
  per pinned version; ADR-0029 open point 1 states the problem for the
  implementer, who recorded the answer there on 2026-11-02: a rule's `Id`
  stays its three-digit key, and `SchemaVersion.RuleId` maps the key to
  the pinned version's id.

  The four `0001-F12` rules that decision 0003 has enter `0.3.0` take
  `SPEC4007` to `SPEC4010` (owner, 2026-11-02, resolving `0001-F12`
  OQ-5); items `0334` to `0337` add them, not this item. Item `0334`
  added `SPEC032` to `0.3.0` in `9a7174bb`, before this item merged, so
  this item maps it to `SPEC4009` and names `0001-F3` B-039, its
  `expected` payload, in `claims:`; items `0335` to `0337` add the other
  three.

  It waits on item 0164: after it a rule states its id once and the
  evaluator stamps it, so the renumbering is one map per version and no
  rule's `Id` member changes (ADR-0029 open point 1).

acceptance_criteria:
  - "1. Before any id changes: a repository-wide decision record states the owner's ruling of 2026-10-11 - a clean break with no new major version - and which order applied: no package published, so the vocabulary of `0.1.0` is rewritten in place; or a package published, so the new ids are a new `0.minor` version and the published `0.1.0` is not changed in place (`0001-F7` C-1, decision 0007)."
  - "2. Before any id changes, by `spec-author`: brief § 4, `0001-F7` C-11, `0001-F1` C-5, `0001-F1` C-9, `0001-F1` C-10 and the AGENTS.md invariant and id scheme are amended to permit this one renumbering, in the order that applied, and to say what holds after it; each amended constraint keeps its id. `0001-F7` C-11 as amended by decision 0007 already allows a `0.minor` step that fails a tree, so it needs a delta only for an in-place rewrite."
  - "3. Before any id changes: the map from each of the twenty-one ids to its new id is in that decision record and the owner has approved it. Every new id is `SPEC` and four digits, its thousands digit is its group's in ADR-0010 § 'Rule ids', no `SPEC0xxx` id is assigned, and no new id is given to two rules."
  - "4. Before the code, by `spec-author`: every claim, scenario and `@boundary` scenario that names a rule id names the new one, with its claim id unchanged; this item's `claims:` then lists the claims it delivers, or the item is re-cut. `test-writer` brings § 9 to them."
  - "5. Under a `0.3.0` pin `specht --explain` answers each new id and no old one, and the rule pages under `docs/rules/v0.3.0/` are one page for each new id; the pages of `0.1.0`, `0.2.0` and `0.2.1` are unchanged. Amended 2026-11-02 (ADR-0029): was every version, under `docs/rules/v1/`."
  - "6. `0.3.0`'s vocabulary, its manifest's `rules` keys - in the embedded `0.3.0` manifest and in this repository's `.specht/manifest.json` - and the id each rule reports under `0.3.0` hold the new ids and no old one. A `0.3.0` manifest that names an old id is rejected as any unknown id is (`0001-F5` B-013). Amended 2026-11-02 (ADR-0029): was every version, and `.spec/schema/`."
  - "7. A second golden report is added, the engine's output on the same synthetic baseline tree pinned to `0.3.0` (`0001-F1` B-018, C-10); `test/tests/Engine/Baseline/engine-e7dba24.json` stays, the `0.1.0` verdict. The pull request records the comparison: the new report differs from it in rule ids by ADR-0029's map, in the order the last sort key gives, and in the verdicts `0.3.0` changes over `0.1.0` on that tree (`0001-F7` decision 0015 among them), and in nothing else. Amended 2026-11-02 (ADR-0029): was the golden report replaced once, differing in ids and order alone."
  - "8. The rules sit in one folder for each group under `src/specht/Rules/`, with namespaces that follow the folders. Withdrawn 2026-11-02 (owner): the group folders would sit beside the Feature folders already under `src/specht/Rules/`; the layout moves to item 0342."
  - "9. Open point 7 is answered in the decision record: the vocabulary stays written twice and held equal by the composition test, or one of the two is derived from the other."
  - "10. This repository's own tree passes `./build.sh Specht` with the tool built from this item, the unit, integration and acceptance tiers pass, and the benchmark project `.performance/benchmarks` still compiles."

  - "11. The published `0.1.0`, `0.2.0` and `0.2.1` are byte-identical, with their three-digit rule ids, in the tool this item builds (`0001-F7` B-013, B-015, B-152), and their lock entries are unchanged; `0.3.0`'s lock entry is relocked under `0001-F7` C-17. Amended 2026-11-02 (owner; ADR-0029): was a new `0.minor` version if a package had been published first; no package carries `0.3.0`, so that order does not apply."

