out_of_scope:
  - "Assigning any new id in this item's text - the map is the owner's to approve (criterion 3)."
  - "A new rule, a retired rule or a changed message - each is its own item, and a new rule is a new schema version, a major from schema `1.0.0` on (`0001-F7` C-11)."
  - "An id in the `SPEC0xxx` group, the faults of the tool - ADR-0010 assigns the group and no id; fault isolation is `0001-F1` B-012 to B-016 and OQ-2."
  - "A migration for a consumer's manifest; and a second shipped schema version while no package has been published (criterion 11 is the other order)."
  - "The rules of epic `0101`, which take their ids in the new scheme when they are specified."
  - "Any structural stage of ADR-0010 - items 0155 to 0168."
