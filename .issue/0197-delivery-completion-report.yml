  A process chore requested by the repository owner: deliver-change ends by
  creating a report gathering every agent's contribution across the chain,
  with the effort, decisions and completion note for each process step.
  The method skill owns the reporting contract; the companion owns the
  repository's report location and publication conventions.

acceptance_criteria:
