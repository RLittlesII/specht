summary: |
  The owner asked how per-repository schema is managed when the tool is
  installed with `dotnet tool install specht.tool --global`. The answer was
  already specified: the manifest is read from the root the tool is given,
  every shipped schema version is embedded, the pinned version is selected,
  and a pin the tool does not ship exits 3. README.md § Usage did not say so,
  nor why the local tool manifest stays the documented install.

acceptance_criteria:
  - README.md § Usage states the schema is per repository under any install.
  - README.md § Usage states a pin the tool does not ship exits 3.
  - README.md § Usage states the local tool manifest is the documented
    install, and why.
  - No tool behaviour changes.

decisions:
  - "2026-10-09, repository owner: answer the global-install question in
    README.md § Usage; keep the local tool manifest as the documented
    install."

out_of_scope:
  - Changing any claim or constraint.
  - Documenting a global install as a supported path.
  - The real install section - 0088.
