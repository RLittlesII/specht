summary: |
  Rescoped 2026-10-31 after ADR-0026
  (.spec/adr/0026-the-source-generated-mediator-measured-no-benefit-and-direct-calls-stay.md),
  which records item 0216's evidence and the repository owner's ruling not
  to adopt a mediator. Until then this item ran the check as a query a
  mediator dispatches: `Specht.Cqrs` with `ICqrs`, `IQuery<T>`,
  `ICommand<T>`, two handler contracts and a handwritten dispatcher, and a
  static `Check` in cqrsz's shape nesting `Check.Query` and
  `Check.Handler`. ADR-0026 supersedes those clauses of ADR-0010 and
  assigns this item the engine's direct check entry point in their place.

  ADR-0027 lifted ADR-0014's benchmark gate on 2026-10-31; the pull request
  carries the no-regression guard. Still `blocked`: see the decision of
  2026-10-31 on ADR-0027.

  ADR-0010 (accepted 2026-10-11,
  .spec/adr/0010-layered-engine-boundaries-with-io-at-the-edge-and-a-mediator.md),
  stage 7 (E) of "The order of work", as ADR-0026 leaves it. Its scope,
  from the record's § "The layout", § "I/O is confined", § "The guard" and
  § "The whole-check benchmark", and ADR-0026 § "The revised migration
  design":

  - `Specht.Check`: `SpecCheck`, a sealed class `AddSpechtEngine()`
    registers by its concrete type. It takes `SpecModelReader` and
    `SpecEvaluator`, reads the model and evaluates it, and does nothing
    else. It returns `SpechtReport` and lets the four input-failure
    exceptions cross (owner decision 4). It lives in the engine, so the
    tool, the benchmarks and any later host call the same one (owner
    decision 3). A host takes it by constructor and calls it; no interface
    stands in front of it.
  - `Specht.Report`: `SpecReportDocumentMapper` in place of the static
    `SpecReportDocument.From` (`src/specht/Report/SpecReportDocument.cs:33`),
    `SpecReportSerializer`, and `SpecReportStore`, the fourth and last type
    that holds an `IFileSystem`.
  - `SpechtRunner` (`src/specht/SpechtRunner.cs:15`) is deleted, with `Run`
    and `WriteReport` (`:69`, `:76`, `:81`).
  - The guard: a test that asserts, from the engine assembly's metadata,
    the downward order of the namespaces and where I/O is allowed.
  - The whole-check benchmark's measured call is re-pointed at `SpecCheck`.

  The host changes as little as it can here. `src/tool/Program.cs`
  registers a delegate over `SpechtRunner.Run`; with the runner gone that
  one registration is re-pointed at `SpecCheck`, and `CheckCommand` is
  untouched. Removing the delegate, with `CheckCommand` taking `SpecCheck`
  directly, and the factory are item 0144, stage 8.

  It restructures code of `0001-F1`, `0001-F3` and `0001-F2`, and the
  benchmark of `0109-F3`, so it sits at the repository root with
  `spec: null`.

  The benchmark. `.performance/benchmarks/Check/CheckBenchmarks.cs` is
  pull request #118's (item 0150) and is not on this item's base at
  `eb7c161`; ADR-0010 assumes #118 has landed before stage 1. This item
  re-points it: `[GlobalSetup]` builds a provider from `AddSpechtEngine()`
  and resolves `SpecCheck`, and the measured method calls it with the
  root. A finding recorded before this item and one recorded after it are
  measured through different entry points; the `benchmarker` records the
  entry point beside each.

  The guard is a new test with no claim behind it. `0001-F1` B-005 and
  B-006 are the claims of the reference guard it is built on; ADR-0010
  decides the guard and writes no claim for it. Criterion 2 says what is
  owed first.

  Type names and lines are ADR-0010's and the source's at `eb7c161`;
  `SpecCheck` is this item's, since ADR-0010 names no entry point outside
  the mediator. Once item 0100 lands each carries the prefix that item
  gives it, and the casing of the namespaces is that item's (ADR-0010 open
  point 3).

acceptance_criteria:
  - "1. Specification first, by the owning role, in the same pull request and before the code (ADR-0010 'Specification deltas owed', stage 7). `spec-author`: `0001-F2` C-4, 'calls the runner'; `0109-F3` A-2 and § 6 row 2 as pull request #118 leaves them, which name `SpechtRunner.Run`. `implementer`: `0001-F2` § 7 on the injected runner; `0001-F3` § 7 on `SpecReportDocument.From` and `SpechtRunner.WriteReport`; `0109-F3` § 7 and § 8; `0109-F1` § 7 and § 8 where they name the runner. `test-writer`: `0109-F3` § 9 and every other § 9 row criterion 9 names."
  - "2. The guard's place in the chain, by `spec-author`, before the test is written: `0001-F1` says whether the namespace order and the confinement of I/O are a claim, with its scenario, or the test of a constraint, and the guard cites what is written. No claim is invented in this item."
  - "3. `Specht.Check` holds `SpecCheck`, a sealed class that `AddSpechtEngine()` registers by its concrete type. It takes `SpecModelReader` and `SpecEvaluator`; its one public method takes the root and the schema-source selection, reads the model and evaluates it, and does nothing else. It returns `SpechtReport` and catches none of the four input-failure exceptions."
  - "4. No mediator, dispatcher, request or handler contract is added, and no interface stands in front of `SpecCheck` (ADR-0026; ADR-0005 (d)). `Specht.Check` holds no static class."
  - "5. `SpecReportDocumentMapper`, `SpecReportSerializer` and `SpecReportStore` replace `SpecReportDocument.From` and `SpechtRunner.WriteReport`. The mapper and the serializer hold no `IFileSystem`; the store parses and decides nothing. The report document's bytes for a given report are unchanged."
  - "6. `SpechtRunner` is deleted and nothing in `src/` or `.performance/` names it. `src/tool/Program.cs` composes the check without it, `CheckCommand` is unchanged, and the tool's output, its exit codes and the file `--report` writes are unchanged."
  - "7. The guard is a test built on `test/tests/Shared/EngineAssembly.cs` with no new package. It fails when a namespace references one above it in ADR-0010 § 'The layout', when a type other than `SpecManifestStore`, `SpecDiscovery`, `SpechtTreeStore` and `SpecReportStore` references `IFileSystem`, or when a type other than `SpechtResources` reads an embedded resource. It passes on this item's tree with no exemption beyond `Specht.Composition`, which stands outside the order."
  - "8. The whole-check benchmark measures `SpecCheck` called with the root; building the provider and resolving `SpecCheck` are outside the measured call (`0109-F2` C-9). No production type changes shape for the benchmark (`0109-F2` C-11). `.performance/benchmarks` still compiles."
  - "9. Not a refactor until re-pointed. These tests are named by § 9 rows and are rewritten or deleted here: `SpechtRunnerRunUnitTests` (`0001-F5` B-018), `SpechtRunnerBaselineIntegrationTests` (`0001-F1` B-001, B-002, B-004, B-010), `SpechtRunnerIntegrationTests` (`0001-F1` B-002, B-008, B-011), `SpechtRunnerRulesIntegrationTests` (`0001-F1` B-004), `SpechtRunnerViolationsIntegrationTests` (`0001-F1` B-004, B-010; `0001-F7` B-023), `SpechtRunnerDeterminismIntegrationTests` (`0001-F1` B-006, B-007), `SpechtRunnerDeterminismUnitTests` (`0001-F1` B-006), `SpechtRunnerDiscoveryIntegrationTests` (`0001-F6` B-001, B-003, B-004, B-009), `SpechtRunnerVersionsIntegrationTests` (`0001-F7` B-001, B-002, B-014, B-055), `SpecReportDocumentUnitTests` (`0001-F6` B-009; `0001-F3` B-005, B-006, B-007; `0001-F7` B-002; `0001-F2` B-002), `SpecReportDocumentIntegrationTests` (`0001-F3` B-005, B-006, B-008, B-021) and `SpechtEngineServiceCollectionExtensionsUnitTests` (`0001-F1` B-001, B-004). `test-writer` re-points each row in the same pull request; no row names a test that no longer exists and no claim loses its proof."
  - "10. The golden report `test/tests/Engine/Baseline/engine-e7dba24.json` is unchanged, byte for byte; the test that compares it changes only in how it reaches the check, and not in what it compares. The unit, integration and acceptance tiers pass."
  - "No .feature change needed: refactor - the check becomes one engine entry point that reads the model and evaluates it, the report's mapping, serialising and writing become three types, and the runner is deleted; the report, the tool's output and its exit codes are unchanged."
  - "Constraints preserved: 0001-F1 C-1, 0001-F1 C-3, 0001-F1 C-4, 0001-F1 C-7, 0001-F1 C-9, 0001-F1 C-10, 0001-F2 C-2, 0001-F2 C-3, 0001-F3 C-1, 0001-F3 C-3, 0001-F3 C-4, 0001-F3 C-5, 0109-F2 C-11, 0109-F3 C-2, 0109-F3 C-3, 0109-F3 C-4"
  - "The guard of ADR-0027: CheckBenchmarks at 100 and 1,000 specifications on the base `main` commit and on the branch head, judged by 0211's rule, numbers in the PR description and in a decisions entry; a flag waits for the owner's ruling."

decisions:
  - |
    2026-10-11, spec-author: cut from ADR-0010 on the repository owner's
    acceptance of it the same day, as stage 7 (E). Item 0154 is the session
    that produced the record and holds the owner's decisions. Status
    `ready-for-implementation`, as items 0104 to 0107 were cut on ADR-0001:
    the design is the accepted record's. `0001-F2` C-4 is not among the
    constraints preserved: it is amended first, by criterion 1.
  - |
    2026-10-31, spec-author: rescoped on the repository owner's request of
    2026-10-31, "Rescope 0167 and 0144", after ADR-0026, accepted the same
    day on the owner's ruling "(a) Don't adopt". Removed, as ADR-0026
    § "Consequences" names them: the mediator title, the summary's
    `Specht.Cqrs` bullet, criterion 3 (`Specht.Cqrs`), criterion 4 (the
    cqrsz `Check` class), criterion 7's exemption for `Specht.Cqrs`, and
    criterion 8's `Check.Handler` and `Check.Query`; with them the
    out-of-scope rows on what a send costs and on a generated port.
    Criteria 3 and 4 are rewritten in place, so the numbers other criteria
    cite hold. Kept, and still gated: the report types, the runner's
    deletion, the guard, the benchmark's re-pointing, and criteria 1, 2, 5,
    6, 9 and 10. In place of `Check.Query` and `Check.Handler` stands the
    engine's direct check entry point ADR-0026 assigns to this redesign:
    `SpecCheck`, sealed, in `Specht.Check`, registered by
    `AddSpechtEngine()` and called directly (ADR-0010 owner decisions 3
    and 4, which ADR-0026 keeps). The name is this item's; ADR-0010 names
    none outside the mediator. No interface fronts it: it has one
    implementation and no substitution exists today (ADR-0005 (d),
    `coding-conventions` § Design). Judgement, for the owner's review: it
    takes the root and the schema-source selection, because the runner's
    `Run` has taken the selection since `--schema-source` and ADR-0010's
    `Check.Query` predates it; a root alone would drop the option. Also
    judgement: the `--report` row no longer names a `SaveReport` command
    and handler, a cqrsz shape resting on the superseded mediator; item
    0036's own shape is that item's to revise. Status
    stays `blocked` and every `depends_on` edge stays: 0216 is closed, but
    ADR-0014's gate stands for the rest of ADR-0010's rollout, pending the
    owner.
  - |
    2026-10-31, spec-author: on ADR-0027
    (.spec/adr/0027-structural-stages-proceed-on-a-no-regression-guard.md),
    accepted by the repository owner the same day, which lifts ADR-0014's
    benchmark gate for ADR-0010's remaining structural stages and puts a
    no-regression guard on each stage's pull request. The pause in the
    summary is replaced and a criterion for the guard is added. 0216 is
    done and stays in `depends_on` as the record of the evaluation.
    Status stays `blocked`. ADR-0027 lifts the benchmark gate only. The
    rescoping ADR-0026 requires is written (the decision above), with
    judgements left for the owner's review: `SpecCheck` taking the root and
    the schema-source selection, and the `--report` row. This item is
    released when the owner accepts that rescoping; the design is then the
    rescoped one and the dependencies 0164 and 0166 are open.

