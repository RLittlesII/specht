  - |
    2026-11-01, the repository owner, answering a question card; recorded
    by spec-author. No criterion is edited.
    Criterion 3, asked whether the engine's own load is built on the tree
    in this item or the item only moves the three types and leaves the
    load to 0166, the owner chose "Move only (Recommended)", option (A):
    this item moves `SpechtTree`, `SpechtTreeFile` and `SpechtTreeStore`
    into `Specht.Tree` and leaves the load to 0166, as ADR-0010 splits it.
    Risk stays 3, and this item needs no new ADR.
    Criterion 5, asked whether the moved types replace, feed or leave
    alone `InitWriter` and `test/tests/Shared/SpechtTree.cs`, the owner
    chose "Leave to design pass (Recommended)": this item's design pass
    proposes, and the owner rules on that proposal.
    Status stays `in-progress`; the design pass follows on this branch.
  - |
    2026-11-01, implementer: criterion 5, a proposal awaiting the
    repository owner's ruling; nothing here is decided. Read on `main` at
    commit `f08ee33c`.
    (a) `InitWriter` (`src/tool/Features/Init/InitWriter.cs`) is host
    code, outside ADR-0010's engine guard, and ADR-0010 open point 2
    keeps init's handler in the tool's `Init` slice. It writes absent
    files only, through `FileMode.CreateNew` (`:216`, `0001-F4` C-1),
    asynchronously, and returns a written-or-skipped listing;
    `SpechtTreeStore.Save` overwrites through `File.Create`, synchronously,
    with no listing.
    - Replace: the store writes init's files. It gains a create-new,
      skip-existing, listing mode no `0109-F1` claim states, and init's
      I/O moves into the engine against open point 2.
    - Feed: `InitWriter` keeps its I/O and carries its selection as
      `SpechtTreeFile` in place of its tuples and `ShippedFile`
      (`src/tool/Features/ShippedFile.cs`, shared with `UpgradeWriter`):
      type churn, no I/O consolidated.
    - Leave alone: no change.
    Recommended, judgement: leave alone; init's I/O is reconsidered when
    `upgrade` pulls init into the engine (open point 2).
    (b) `test/tests/Shared/SpechtTree.cs`, linked into `test/acceptance`,
    is a mutable fixture builder over a disposable temporary root: it
    copies the live `.specht/` files, writes through `File` and
    `Directory`, and offers eleven helper methods. 86 files name it (57
    in `test/tests`, 29 in `test/acceptance`); 42 construct it, 134 times;
    44 use only its path constants.
    - Replace: the 86 files build production trees and save them through
      the store. The helpers still need a home, so a test-side builder
      returns; the highest churn, and it collides with item 0168.
    - Feed: its API and callers stay; its writes go through
      `SpechtTreeStore` over the real file system, so writing a file under
      a root has one implementation. One file changes; its deletes and its
      read of the build output stay on `File` and `Directory`. It needs a
      public way to build a `SpechtTree` from files.
    - Leave alone: two implementations of writing a tree remain, the
      store's and the test tree's, which the criterion's "no second
      implementation for tests" reads against.
    Recommended, judgement: feed.
  - |
    2026-11-02, the repository owner, answering question cards on
    2026-11-01; recorded by spec-author. Criterion 6 is amended because
    it was stale; no other criterion is edited.
    Criterion 5(a), `InitWriter`, the owner chose "Leave alone
    (Recommended)": this item does not touch `InitWriter`. A judgement
    call, revisited when `upgrade` pulls init into the engine (ADR-0010
    open point 2).
    Criterion 5(b), `test/tests/Shared/SpechtTree.cs`, the owner chose
    "Feed (Recommended)": its API and every caller stay unchanged, and
    its writes go through `SpechtTreeStore` over the real file system,
    so writing a tree has one implementation. One file changes.
    `SpechtTree.Of`, which cannot move as written because ADR-0010
    § "What 'no static' covers" rules out a public static that computes,
    the owner chose "Generator instance (Recommended)", option (A):
    `SpechtTree` gains a public constructor taking its files; a sealed
    `SpechtTreeGenerator(SpechtResources, SpechtManifestParser)` with
    `Generate(int specifications)` is registered in `AddSpechtEngine()`,
    a fourth moved type; and the synthetic specification rendering ships
    inside `specht.tool`. Not chosen: (B) keep the static as a written
    exception; (C) leave generation in the benchmark project.
    Read against the criteria and out_of_scope:
    - Criterion 1 names three types; the generator is a fourth, and the
      benchmark project keeps no generation of its own. Not edited: the
      criterion does not say only three, and this ruling extends it.
    - Criterion 2 allows `0109-F1` C-7 and `0109-F2` C-11 to be
      "satisfied by an engine consumer". The 2026-11-01 ruling on
      criterion 3 (move only) closes that route, and generation in `src/`
      makes C-7's "generated by the benchmark code" false and reads
      against C-11's "a benchmark-only seam in `src/`". Both are amended
      in the specification delta, not satisfied.
    - Criterion 6 was stale: `SpecManifest` is gone from `main` at
      `f08ee33c`, and `SpechtTree.Of` no longer repeats the `0.1.0`
      default or the manifest's resource name, its callers passing
      `SpechtResources` and `SpechtManifestParser` results in. Amended
      to the facts as they stand; what it requires is unchanged, and the
      generator's constructor meets it.
    - The summary and earlier entries say "the three types"; they are
      history and stay as written.
    Status stays `in-progress`.
  - |
    2026-11-02, benchmarker: the guard of ADR-0027 for ADR-0010 stage 6.
    Base `2e849065` (`origin/main`), head `ed38e012` (the branch head).
    Separate detached source copies on one host, made with `git archive`,
    run alternately base-100, head-100, base-1000, head-1000 from 10:01 to
    10:06 with `./build.sh Benchmark --benchmark-filter
    '*CheckBenchmarks.Check(Specifications: N)'`, BenchmarkDotNet 0.15.8
    default job. On the base `[GlobalSetup]` builds the tree with the
    static `SpechtTree.Of`; on the head it resolves `SpechtTreeGenerator`
    and `SpechtTreeStore` from `AddSpechtEngine()`; both are outside the
    measured call. Host: Apple M1 Max, 10 cores, macOS Tahoe 26.4
    (25E246), .NET SDK 11.0.100-rc.2.26504.105, runtime .NET 10.0.12
    Arm64 RyuJIT; 1-minute load average between 20.10 and 50.67 on 10
    cores during the runs (5-minute 21.0 to 29.9), a shared host under
    heavy load.
    100 specifications: base Mean 80.71 ms, Error 10.73 ms (CI 69.98 to
    91.43 ms), Allocated 33.42 MB (35,047,677 B); head 48.73 ms, Error
    0.893 ms (CI 47.84 to 49.63 ms), 33.45 MB (35,073,196 B). Time
    -39.6%, allocation +0.07% (+25,519 B).
    1,000 specifications: base Mean 540.4 ms, Error 32.99 ms (CI 507.4 to
    573.4 ms), Allocated 329.87 MB (345,888,912 B); head 492.9 ms, Error
    9.74 ms (CI 483.2 to 502.7 ms), 329.87 MB (345,888,960 B). Time
    -8.8%, allocation +48 B (0.00%).
    Both base rows are dispersed while the load average rose to 50.67 and
    41.29: at 100, StdDev 30.95 ms, Median 65.62 ms, 96 measurements
    against head's 44; at 1,000, StdDev 90.31 ms, Median 492.3 ms, 87
    against head's 69. Their means are the host's, not the code's, and the
    time deltas are not a speed-up.
    Judged by 0109-F5 B-011 and B-012 under ComparisonPolicy.Initial: no
    flag at either size; neither mean rose and neither head interval lies
    above its base's, and neither allocation rose more than 10%. Only the
    absence of a flag is claimed: one run per side, under load, and no
    change in either direction is claimed. The net11.0 runtime was not
    measured.

