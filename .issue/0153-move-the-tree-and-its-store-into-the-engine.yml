summary: |
  ADR-0027 lifted ADR-0014's benchmark gate on 2026-10-31: this stage
  proceeds without benefit evidence, and its pull request carries the
  no-regression guard.

  The refactor story the repository owner asked for on pull request #114,
  2026-10-11, reviewing `test/tests/Benchmarks/SpechtTree.Integration.Tests.cs`:

  "We should not be writing integration tests for benchmarks. That's like
  writing a unit tests for an acceptance test. This FURTHER proves the
  original point I made in the session, that this should be PRODUCTION
  code and _not_ code in the benchmarks. Bechmarks don't get tests. They
  should benchmark production code!

  Ignore these tests for the benchmark, create a refactor story to fix
  this later."

  The original point, the owner on the same pull request, reviewing the
  static SpecTreeGenerator: "Rather than _another_ static. Could we build
  this with DDD principles in mind? In that. Maybe we should load all the
  data into a `SpechtTree` object that can then do all the things.
  Decouple the state persistence/retrieval mechanism from the thing that
  does the work. Maybe it could be defined in `specht` and consumed here?"

  Item 0147 built SpechtTree, SpechtTreeFile and SpechtTreeStore in the
  benchmark project, `.performance/benchmarks/`, and their tests under
  `test/tests/Benchmarks/`. This item moves the three types into
  production code, where they are tested as production code is, and
  leaves the benchmark project measuring them and holding no tested code
  of its own. It is later work and no part of #114.

  This item was filed on #114, unmerged, as a spike that weighed the
  move. The owner's ruling answers what the spike asked, so the item is
  reshaped under the same id rather than a second one claimed. Every fact
  the spike gathered is kept in the acceptance criteria as a thing the
  move resolves.

  The type: `refactor` is the owner's word, and it fits the test
  `.spec/templates/item.yml` sets - no behaviour of the tool changes and
  the `@B-015` and `@B-016` scenarios read true unamended. It does not
  fit AGENTS.md's "produces none": two constraints are amended before any
  code moves, so the item carries a specification delta, written first by
  spec-author. spec-author kept `refactor`; `task` is the other honest
  type, and the owner may overrule.

  It spans `0109-F1`, `0109-F2`, the engine and both test projects, so it
  sits at the repository root with `spec: null`.

  Depends on 0147 alone. 0107 is not a prerequisite and is not made to
  wait. Pull request #116 is open and delivers 0107: it replaces the
  static load the facts below cite and amends `0109-F2`'s specification,
  so the citations of `src/` are as of `main` at commit `9a33cbd` and are
  re-read once #116 lands, and the amendment to `0109-F2` C-11 is written
  after it merges (one writer per specification).

  Value 3 and risk 3 are spec-author's defaults, not the owner's. Value 3
  is what 0107 and 0144 carry, and no claim on the `.issue/.goal` path
  needs this. Risk 3 is for the move, its tests and the two constraint
  amendments; it is 4 if the engine's load is built on the tree in the
  same item (criterion 3).

acceptance_criteria:
  - "1. Moved: `SpechtTree`, `SpechtTreeFile` and `SpechtTreeStore` are production code under `src/`, and `.performance/benchmarks/` declares none of them and consumes them through its existing reference to the engine."
  - '2. Specification first, in the same pull request and before any code moves (AGENTS.md rule 1), by spec-author: `0109-F1` C-7 says every specification a fixture holds is "generated by the benchmark code", and `0109-F2` C-11 rules out "a benchmark-only seam in `src/`". Each is amended, or satisfied by an engine consumer (criterion 3), and § 10 of each specification records it. `0109-F1` § 6 rows 8 to 10 and § 7 `### The tree generator` follow, by implementer.'
  - "3. The engine consumer. The owner's ruling puts the types in production; whether the engine's own load is built on them in this item is the owner's to say and is recorded here before the design starts. Facts: `SpechtModel.Load` (`src/specht/Model/SpechtModel.cs:58`) is static, builds its own `FileSystem`, reads each specification with `File.ReadAllText` (`:71`) and holds an absolute `Root` (`:27`). `FeatureFileReader` reads each `.feature` file with `File.ReadAllLines` (`src/specht/Rules/FeatureFileReader.cs:17`) during evaluation. ADR-0005 (a) accepts the stages `SpechtSchemasLoader`, `ISpecDiscovery`, `SpechtModelLoader` and the rule set, with both loaders concrete (ADR-0005 (d)); item 0107, delivered by pull request #116, builds `SpechtModelLoader` over `IFileSystem`. A load built on the tree changes a stage of an accepted ADR, so it is preceded by a new ADR in `.spec/adr/` that follows or supersedes ADR-0005 in part and never edits it."
  - "4. A store that loads. `SpechtTreeStore` has `Save` and no load. Discovery walks directories and, from ADR-0001 stage E, a git listing: if a load is added, the design says whether it reads every file under the root or only what discovery finds."
  - "5. One home for a tree. Two other things hold root-relative files today: `InitWriter` (`src/tool/Features/Init/InitWriter.cs:20`) persists a dictionary of path to bytes through `IFileSystem`, and `test/tests/Shared/SpechtTree.cs`, linked into `test/acceptance`, writes a tree through `File` and `Directory`. The design says which of them the moved types replace, feed or leave alone, with no second implementation for tests (ADR-0005 (d))."
  - "6. The repeated engine rules go. `SpechtTree.Of` (`.performance/benchmarks/SpechtTree.cs`) repeats the frontmatter role names `feature`, `task` and `epic`, and each of its callers reads the embedded manifest through `SpechtResources` and the pinned version through `SpechtManifestParser` before calling it. Inside the engine each is read from the manifest through `SpechtManifestParser` and written once. Amended 2026-11-02 (decision of that date): it also named the `0.1.0` default and the resource name `specht.default-manifest.json`, which `main` at `f08ee33c` no longer repeats there, and `SpecManifest`, a type `main` no longer has."
  - "7. The tests move with the types. `test/tests/Benchmarks/SpechtTree.Unit.Tests.cs`, `SpechtTreeStore.Unit.Tests.cs`, `SpechtTree.Integration.Tests.cs` and `TreeSizes.cs` become tests of production code in the folder of the slice that receives the types, or are deleted where a moved test already proves the same thing; `test/tests/Benchmarks/` is gone. No test names a type of the benchmark assembly."
  - "8. The reference leaves. `test/tests/tests.csproj` references `benchmarks.csproj` only for those tests; the reference is removed, and the 21 packages it brought into the test project (`0109-F1` § 7) leave with it."
  - '9. The proof of `0109-F1` B-015 and B-016. § 9 names the tests of criterion 7 for both. Once those test production types and benchmark code carries no test, spec-author states in the specification delta of criterion 2 which claim each test proves and in which Feature - B-015 and B-016 kept and citing the engine''s tests, or withdrawn with their ids retired and restated where the types live - and test-writer brings § 9 to it. `0109-F1` § 8''s "Only the tree generator is tested" follows.'
  - "10. `0109-F3` C-3 holds: the measured check reads a tree on disk, written by the store before the measurement."
  - "No .feature change needed: refactor - the tree and its store move from the benchmark project into production code; a tree of a given size holds the same files at the same relative paths with the same contents, the check reports no violation on it, and the tool's report is unchanged."
  - "Constraints preserved: 0001-F1 C-9, 0109-F1 C-8, 0109-F1 C-9, 0109-F1 C-10, 0109-F3 C-3"
  - "The guard of ADR-0027: CheckBenchmarks at 100 and 1,000 specifications on the base `main` commit and on the branch head, judged by 0211's rule, numbers in the PR description and in a decisions entry; a flag waits for the owner's ruling."

