summary: |
  Specify opt-in detection of bulky amendment comments in specification
  Markdown. The owner wants concise current content, without decorative
  banners or long narratives announcing amendments and listing benefits.
  Example: a multiline <!-- Amended ... --> narrative is a candidate finding;
  required one-line author stamps and generated markers remain valid.
  Decide the detectable size/shape boundary, manifest configuration, file
  scope, fenced-example handling and root-relative diagnostics. Default off.
  Do not require comments to carry dates, authors, user authorization or long
  lists of affected keys. Necessary approval evidence stays in its owned
  record; compact section 10 rows cite the affected keys.
  Time box: one session, at most two hours; return an agreement handoff.
acceptance_criteria:
  - "Define a deterministic size/shape boundary, scope and configurable opt-in behavior."
  - "Permit required author stamps and generated markers; define generated-body and fenced-example handling."
  - "Specify diagnostics for bulky amendment narratives without requiring extracted provenance fields or a replacement narrative."
  - "Include report/accept examples and identify the Feature agreement and schema-version impact before implementation."
decisions:
  - "2026-10-24: Original intake requested large-comment analysis with extracted date, author, authorization and affected keys."
  - "2026-10-27, repository owner: revise the request to discourage bulky amendment comments; mandatory provenance extraction is superseded. Keep required stamps and generated markers."
out_of_scope:
  - "Rule, engine or host implementation; rewriting existing comments."
  - "Automatic prose rewriting, a prose word-count gate or new check activation in agents."
