summary: |
  The MCP key dictionary needs to relate the records around a specification:
  items, Features, epics, ADRs, lessons and decisions. The owner wants to know
  whether an agent answers questions better from a database containing complete
  documents or from an index that leads it to authoritative files. The same
  design may offer a machine-local offline mode and an optional online mode;
  if online allocation is adopted, one project sequence is shared across machines.

  Run a controlled agent evaluation on one versioned corpus and the same question
  set through three access paths: (1) filesystem search and reads, (2) MCP key
  and relationship lookup followed by source-file reads, and (3) MCP retrieval
  of complete database-stored documents. Include questions that cross record
  types and require a source citation, as well as missing or stale links. Build
  the smallest disposable adapters needed for comparable trials; do not infer
  answer quality from lookup speed alone.

  In parallel, survey plausible embedded document stores and hosted offerings
  against the observed query and update needs. Compare durability, concurrent
  access, deployment, offline operation, synchronization, migration, cost and
  operational burden. Treat local and online authority, document ownership,
  cache freshness, project identity, mode switches and unavailable online
  service as explicit design questions. Existing `0132-F1` decision 0001 makes
  Markdown authoritative; a different recommendation must name the agreement
  and invariant changes it requires rather than silently replacing that choice.
acceptance_criteria:
  - "A reproducible corpus, question set, answer key and scoring rubric cover items, Features, epics, ADRs, lessons and decisions, including cross-record links, citations and stale or missing links."
  - "The three access paths answer the same questions with the same agent setup; the report records correctness, completeness, citation quality, stale answers, tool calls, elapsed time and token use with raw observations and versions."
  - "A candidate matrix compares at least one embedded local document store and one hosted offering against offline operation, shared online project sequence, durability, concurrency, synchronization, migration, security, cost and CLI/MCP parity."
  - "The report recommends an access and storage direction from the evidence, states its limits, and identifies any changes needed in epic 0132, Feature 0132-F1, decision 0001, and repository invariants."
  - "A separate allocation analysis identifies how online reservations remain unique across machines and what happens on disconnection or mode change; it does not treat independent local counters as one shared sequence."
decisions:
  - |
    2026-11-01, implementer: the evidence and its proposal are recorded in
    ADR-0028
    (`.spec/adr/0028-files-stay-the-reading-path-and-online-allocation-waits.md`,
    proposed), which carries the trial itself - the corpus at `51c00ffd`,
    the twelve questions and answer key, the rubric, the agent setup, the
    disposable adapter, the results, the storage survey and the allocation
    analysis, each participant's prompt and raw answer verbatim, and the
    versions (Python 3.15.2, SQLite 3.54.1 with FTS5) - so that no branch is
    needed to read or re-run it. On this
    corpus no access path improved on filesystem search, which used the
    fewest tokens and tool calls, and the id-keyed store lost one of the two
    items numbered `0220` (item `0128` is the existing item for that defect).
    Recommendation, a judgement: Markdown stays the reading path and decision
    0001 stands; no persistent index on answer-quality grounds; an index, if
    `0132-F1` OQ-3 justifies one, keyed by path with id collisions reported;
    no online allocation now. The survey's matrix covers durability, schema
    migration and security; it had no CLI/MCP parity column, so ADR-0028
    gives its own labelled reasoning for parity.
    The owner's ruling is `0132-F1` OQ-4 and epic `0324`'s online-mode
    question; no claim, decision or invariant is amended.
out_of_scope:
  - "Production MCP or database implementation; this spike may use disposable trial adapters."
  - "Changing document authority, permitted writes, offline guarantees or public CLI/MCP contracts before the owner reviews the evidence and amends the owning agreements."
  - "Document creation or editing through MCP; this investigation concerns retrieval and allocation authority."
