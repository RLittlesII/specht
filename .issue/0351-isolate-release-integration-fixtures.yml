summary: |
  Release run 41750106065 failed in the synthetic prerelease guard and VSTest
  package fixture. Main CI passed on the same commit. The synthetic main
  branch inherited the tag workflow's ref, changing its computed version.
  Both analyzer package fixtures also built into shared intermediates.
  The original pack diagnostic was only written to the runner's probe.
