summary: |
  The push build on `main` has failed on `windows-latest` in the `Unit Test`
  step on every push since `1286b6b` (item 0183, pull request #135); the
  last green push was `83d6f80`. Run 38212538483 is one such failure.
  `ubuntu-latest` passes. One test fails,
  `InitWriterUnitTests.TheEmbeddedShippingCopy_WhenWrittenIntoABareRoot_ShouldWriteTheEightFilesAndNothingOutsideTheTwoFolders`
  (`test/tests/Init/InitWriter.Unit.Tests.cs`):

      Expected object to match (file.Contains("repo\.specht/schema\", Ordinal)
      OrElse file.Contains("repo\.specht/templates\", Ordinal)), but found
      "C:\repo\.specht\schema\epic.frontmatter.schema.json"

  A test defect, not a product defect: the writer wrote the right files to
  the right folders on Windows. The test built its two expected prefixes as
  `Path.Combine(Root, SpecTree.SchemaFolder) + Path.DirectorySeparatorChar`.
  Item 0183 changed `SpecTree.SchemaFolder` and `SpecTree.TemplatesFolder`
  (`test/tests/Shared/SpecTree.cs`) from one segment to `.specht/schema` and
  `.specht/templates`. `Path.Combine` keeps the `/` inside an argument, so on
  Windows the prefix is `repo\.specht/schema\`, `MockFileSystem.AllFiles`
  returns normalized paths, and an ordinal comparison never matches. Every
  other `Path.Combine(Root, SpecTree.SchemaFolder)` in the tests hands its
  result to a file-system API, which normalizes; only this test compared it
  as a string.

  It reached `main` because the pull-request workflow runs `ubuntu-latest`
  alone and the Windows gates run on a push to `main` only (`0055-F2`
  decision 0003).

  The fix: each prefix is `fileSystem.Path.GetFullPath(...)` of the combined
  path plus the separator, and the assertion is `StartsWith`, not `Contains`.

  No specification governs the defect: no claim, scenario or `.feature`
  changes, so the item delivers no claim and sits at the repository root.

  Value 3: `main` is red on Windows on every push, which hides a real
  Windows regression behind a known failure. Risk 1: three lines in one
  test. Both scores are implementer's.

  Delivered files: `test/tests/Init/InitWriter.Unit.Tests.cs`;
  `.spec/lessons/0006-a-path-compared-as-a-string-is-normalized-first.md`;
  `.claude/skills/specht-conventions/references/testing.md` (the rule and one
  `Never add` line); `.issue/.sequence`. Nothing under `src/` or `.build/`.

