summary: |
  The Specht target invokes the published 0.1.131 checker before compilation.
  It rejects tests/owners in this repository's working 0.2.0 manifest with
  exit 3; three installed-tool acceptance cases fail on the same mismatch.
  A newer published checker cannot be a prerequisite for developing it.

  The owner requested this fix in an isolated session after 0227 merged.
  Build 0055-F1 C-3, Check 0001-F2 B-014/A-2 and decision 0009 explicitly
  require the committed package pin here, so changing that guarantee needs
  the owner's choice before implementation. Package installation can remain
  part of self-check through a locally packed checkout, or be proven in
  separate package tests while self-check runs the checkout's CLI.

  Main at 06753445 and every open pull request were checked: no open PR
  claimed an id above 0236. This item reserves 0237 on its draft PR. An
  isolated detached checkout was created for read-only orientation because
  the prior checkout had been removed and the parent's main checkout must
  not be edited. This item is taken before its delivery branch and edits.
acceptance_criteria:
