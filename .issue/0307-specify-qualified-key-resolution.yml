summary: |
  Extend epic 0228 candidate C and R4/R5 rather than start another resolver.
  A caller should resolve specification, claim, constraint, open-question,
  ADR, decision and lesson keys without a web of document hyperlinks.
  Examples: 0001-F2, 0001-F2 B-044, 0001-F2 C-3 and a Feature-qualified
  ADR or decision number. Report missing or ambiguous targets explicitly;
  return the authoritative root-relative location for a resolved target.
  Use the existing identity/index work where applicable. Index storage and
  MCP research remain 0132-F1 and 0252; no database is a prerequisite inferred
  by this request. The same resolver serves the read-only lookup and future
  opt-in citation validation.
  Time box: one session, at most two hours; return an agreement handoff.
