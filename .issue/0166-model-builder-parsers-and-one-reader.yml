summary: |
  ADR-0027 lifted ADR-0014's benchmark gate on 2026-10-31: this stage
  proceeds without benefit evidence, and its pull request carries the
  no-regression guard.

  ADR-0010 (accepted 2026-10-11,
  .spec/adr/0010-layered-engine-boundaries-with-io-at-the-edge-and-a-mediator.md),
  stage 6 (D2) of "The order of work", which the record runs with item
  0153. The split between the two: 0153 moves `SpechtTree`,
  `SpechtTreeFile` and `SpechtTreeStore` into `Specht.Tree` and keeps its
  own criteria; this item builds the engine's load on them. Its scope,
  from § "I/O is confined", § "The model is an immutable snapshot" and
  § "How each cycle is cut", 3:

  - `SpecModelBuilder` turns text into one immutable `SpechtModel` and
    touches no file system. The parsers it uses are instances: the
    statics `SpechtDocument.Parse` (`src/specht/Model/SpechtDocument.cs:37`)
    and `FrontmatterReader.Parse` (`src/specht/Model/FrontmatterReader.cs:28`)
    go, and so does the reader's own I/O (`:26`).
  - `SpecModelReader` is the one type that sequences the stores: it takes
    a root, asks `SpechtManifestStore`, `SpechtDiscovery` and `SpechtTreeStore`
    for what each holds, and hands the text to the builder. No other type
    holds a store.
  - `SpechtSchemas` becomes data, built by a pure `SpecSchemaCompiler` from
    the pinned version's schema text. `SpechtSchemas.Load`, both overloads
    (`src/specht/Model/SpechtSchemas.cs:72`, `:100`), and
    `SpechtSchemas.Options` (`:31`) go; so do `SpechtSchemasLoader` and
    `SpechtModelLoader`.
  - The model carries paths relative to the root and no other kind; the
    root is the reader's and the stores' and is not in the model. What
    item 0155 left of the absolute-to-relative mapping inside the loader
    goes with the loader.
  - `SpechtRootNotFoundException` moves to `Specht.Tree`, and the reader
    checks the root before it asks for the manifest, so a missing root is
    still reported before a missing manifest.

  This answers item 0153's criterion 3 and criterion 4: the engine's load
  is built on the tree, on the authority of ADR-0010, and the store gains
  the load the reader needs. ADR-0010 § "I/O is confined" gives the store
  "the files of a tree: their text in" and gives discovery the listing;
  the design says, in this item's `decisions`, that the store reads what
  discovery lists and nothing else, or why not.

  It restructures code of `0001-F1` (`Model/`, the runner's `Run`), of
  `0001-F5` and `0001-F6` as the reader calls them, and the benchmark
  project's use of the tree, so it sits at the repository root with
  `spec: null`. Risk 5: it replaces the whole read path of the check in
  one change, and the golden report is the proof.

  `ISpecDiscovery` is not added here; it arrives with items 0007 and 0008
  (ADR-0001, as ADR-0010 leaves it). The reader takes the concrete
  `SpechtDiscovery`. `SpechtRunner.Run` keeps its signature and calls the
  reader, until item 0167 deletes the runner.

  Type names and lines are ADR-0010's and the source's at `eb7c161`; once
  item 0100 lands each carries the prefix that item gives it.

acceptance_criteria:
  - "1. Specification first, by the owning role, in the same pull request and before the code (ADR-0010 'Specification deltas owed', stage 6). `spec-author`: `0109-F2` B-003 and C-3, the frontmatter read as a unit, and `0109-F2` A-1, which names `SpechtSchemasLoader` and `SpechtModelLoader`. `implementer`: `0109-F1` § 7 and § 8, which place the tree types in the benchmark project, where item 0153 has not already brought them true. A claim that is amended keeps its id; one that no longer holds is marked `Withdrawn`."
  - "2. `SpecModelBuilder` takes text and returns one `SpechtModel`; neither it nor any parser holds an `IFileSystem`. `SpechtDocument.Parse` and `FrontmatterReader.Parse` are not static, and no data type parses or loads itself."
  - "3. `SpecModelReader` takes a root, sequences `SpechtManifestStore`, `SpechtDiscovery` and `SpechtTreeStore`, and hands text to the builder. It is the only type that holds a store. Within `Specht.Model`, `Specht.Tree`, `Specht.Manifest` and `Specht.Discovery`, only those three stores reference `IFileSystem`."
  - "4. `SpechtSchemas` is data built by `SpecSchemaCompiler`, which reads nothing. `SpechtSchemas.Load`, `SpechtSchemas.Options`, `SpechtSchemasLoader` and `SpechtModelLoader` are gone, and the frontmatter rules take the evaluation options from a value they are given."
  - "5. Every path in the model is relative to the root, the model holds no root, and no type maps an absolute path back. Every violation still names its file as it did (`0001-F1` C-4)."
  - "6. `SpechtRootNotFoundException` is in `Specht.Tree`. A missing root is reported before a missing manifest, and an invalid manifest as before: the exit codes and messages of `0001-F2` are unchanged."
  - "7. The order the model lists Features, items and epics in is the order the loader produced, so every rule emits in the order it did."
  - "8. Not a refactor until re-pointed. These tests are named by § 9 rows and are rewritten or deleted here: `SpechtModelLoaderUnitTests`, `SpechtSchemasLoaderUnitTests` and `FrontmatterReaderUnitTests` (`0001-F1` B-004), `SpechtSchemasUnitTests` (`0001-F1` B-004; `0001-F5` B-008, B-013; `0001-F7` B-001, B-014), `SpechtDocumentUnitTests` (`0001-F1` B-004, B-008), and the `SpechtRunner*IntegrationTests` classes where they construct a loader. `test-writer` re-points each row in the same pull request; no row names a test that no longer exists and no claim loses its proof."
  - "9. The benchmark project's use of `SpechtTree` and `SpechtTreeStore` is re-pointed in this pull request or in item 0153's (ADR-0010 § 'The whole-check benchmark'), `0109-F3` C-3 holds, and `.performance/benchmarks` still compiles."
  - "10. The golden report `test/tests/Engine/Baseline/engine-e7dba24.json` is unchanged, byte for byte, and the test that compares it is green unedited. The unit, integration and acceptance tiers pass."
  - "No .feature change needed: refactor - the model is built from text by a builder that one reader feeds from the stores, in place of loaders and self-loading data types; the model's content, every violation and the report are unchanged."
  - "Constraints preserved: 0001-F1 C-3, 0001-F1 C-4, 0001-F1 C-6, 0001-F1 C-7, 0001-F1 C-9, 0001-F1 C-10, 0001-F2 C-2, 0001-F5 C-5, 0001-F5 C-6, 0001-F6 C-5, 0001-F7 C-4, 0109-F3 C-3"
  - "The guard of ADR-0027: CheckBenchmarks at 100 and 1,000 specifications on the base `main` commit and on the branch head, judged by 0211's rule, numbers in the PR description and in a decisions entry; a flag waits for the owner's ruling."

