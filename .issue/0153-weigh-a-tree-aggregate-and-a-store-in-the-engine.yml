  - "SpechtTree and SpechtTreeStore in the benchmark project - 0147."
  - "Editing ADR-0005 - an accepted ADR is answered by a new one."
  - "Holding 0107 or 0144 for the answer - the owner's call, not made."
  - "A second implementation of any stage for tests - ADR-0005 (d)."
