summary: |
  2026-10-11, the repository owner, reviewing the static SpecTreeGenerator
  on pull request #114: "Rather than _another_ static. Could we build this
  with DDD principles in mind? In that. Maybe we should load all the data
  into a `SpechtTree` object that can then do all the things. Decouple the
  state persistence/retrieval mechanism from the thing that does the work.
  Maybe it could be defined in `specht` and consumed here?"

  Item 0147 delivers the first half in the benchmark project, and the
  static is deleted: SpechtTree is state, built for a size by
  `SpechtTree.Of` and held as `Files`; SpechtTreeFile is one file, a
  root-relative path and its bytes; SpechtTreeStore is constructed over
  an IFileSystem and its `Save` writes a tree under a root. Nothing in
  `src/` changed. This spike carries the second half, because it changes
  engine design.

  The question: should the engine's aggregate be a SpechtTree - the
  tree's files as state - with a store that loads and saves it through
  IFileSystem, SpecModel built from a loaded tree, and the benchmark and
  the test fixtures consuming the same type from `specht`?

  It investigates and recommends. It builds nothing.

  Relation to other items, none of them a hard prerequisite beyond 0147:
  - 0107 (ADR-0001 stage D, ADR-0005 (a)) turns the static load into
    SpecModelLoader over IFileSystem. This spike can be answered before or
    after it. Answered before, it may change what 0107 builds; answered
    after, an adopted recommendation reworks SpecModelLoader. 0107 is not
    made to wait: the owner has not chosen that. Pull request #116 is
    open and delivers 0107; the file and line citations in the facts
    below are as of `main` at commit `9a33cbd`, so re-read them once
    #116 lands.
  - 0144 (ADR-0007) makes the file system a caller input of the host
    factory. A store over IFileSystem is registered by whatever 0107 and
    0144 leave; neither waits on this.

  Value 3 is spec-author's default, not the owner's: the same as 0107 and
  0144, because the answer is worth most before 0107 writes the model
  loader, and no claim on the `.issue/.goal` path needs it. Risk 3: it
  builds nothing, but it reopens a stage of an accepted ADR and reads
  across the engine, the tool, two test projects and the benchmarks.

acceptance_criteria:
  - "An ADR in `.spec/adr/` answers the question and recommends one of: adopt, adopt in part, reject. It follows or supersedes ADR-0005 in part and never edits it. It weighs each fact below."
  - "1. The load today: `SpecModel.Load` (`src/specht/Model/SpecModel.cs:58`) is static, builds its own `FileSystem` (`:60`), reads each specification with `File.ReadAllText` (`:71`) and holds an absolute `Root` (`:27`)."
  - "2. The disk read during evaluation: `FeatureFileReader` reads each `.feature` file with `File.ReadAllLines` (`src/specht/Rules/FeatureFileReader.cs:17`), reached from a rule through `model.Root` (`src/specht/Rules/FeatureFileRule.cs:41`). Whether a loaded tree removes that read."
  - "3. ADR-0005 (a): the accepted stages are `SpecSchemasLoader`, `ISpecDiscovery`, `SpecModelLoader` and the rule set under `SpecCheckRunner`, with both loaders concrete (ADR-0005 (d)). Where a tree and its store sit among them, and which stage they replace, feed or leave alone."
  - "4. Item 0107's scope, and whether the recommendation changes it or follows it."
  - "5. `0109-F2` C-11: a type in `src/` needs an engine consumer, not only a benchmark."
  - "6. `InitWriter` (`src/tool/Features/Init/InitWriter.cs:20`) already persists root-relative files, held as a dictionary of path to bytes, through `IFileSystem`. One store or two."
  - "7. `0109-F3` C-3: the measured check reads a tree on disk. `0109-F1` C-7: every fixture specification is generated by the benchmark code."
  - "8. `test/tests/Shared/SpecTree.cs`, linked into `test/acceptance`, is a third holder of a tree, and writes through `File` and `Directory` directly."
  - "9. Discovery walks directories and, from ADR-0001 stage E, a git listing. What a store loads: every file under the root, or only what discovery finds."
  - "10. `0001-F1` C-9: no verdict changes; the golden report holds field for field."
  - "11. What the types cost outside the engine: to build a tree without touching disk, `SpechtTree.Of` (`.performance/benchmarks/SpechtTree.cs`) repeats two engine rules, because `SpecManifest`'s parse of manifest text is private and its `Load` takes a file system and a root - the frontmatter role names `feature`, `task` and `epic`, and the rule that a manifest with no `schemaVersion` key means `0.1.0`, written as a literal. It also repeats the embedded manifest's resource name (`0109-F1` § 7). Whether a public in-memory manifest read, with an engine consumer (fact 5), removes all three."
  - "If it adopts, the ADR names the specification amendments owed, by Feature and section, and the follow-up items to cut. None is cut here."

decisions:
  - |
    2026-10-11, the repository owner, on pull request #114, quoted in the
    summary. Asked how far to take it, the owner chose: (1) in #114 the
    static is replaced by a SpechtTree and a SpechtTreeStore in the
    benchmark project (item 0147); (2) moving them into `specht`, so that
    a store loads a SpechtTree from disk and SpecModel is built from it,
    is filed as specification work beside item 0107 and ADR-0005. Not
    chosen: defining the types in src/specht in #114, or rewiring the
    engine now.
  - |
    2026-10-11, spec-author: filed as a spike at the repository root. Its
    product is an ADR, repository-wide in blast radius, and it spans
    `0001-F1`, `0001-F4`, `0109-F1` to `0109-F3` and both test projects,
    so it belongs to no one Feature (`.spec/templates/item.yml`).

out_of_scope:
