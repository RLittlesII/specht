summary: |
  0026's command tests (test/specht.tests/CheckCommand.Integration.Tests.cs)
  each run the command through a private static Check(run, args) helper: it
  fills a ServiceCollection with the runner delegate, wraps it in
  TypeRegistrar, builds a CommandAppTester over an 80-column TestConsole,
  sets CheckCommand as the default command and runs it. The acceptance steps
  (test/specht.acceptance/Check/CheckSteps.cs) repeat the same wiring. The
  owner rejected that approach on PR #4 (review comment r4225019006: "I'm
  not a fan of this approach") and asked for it to be tracked here rather
  than redone inside 0026.

  The question: how does a test compose and run a specht command? It has to
  hold for every command after check (init 0001-F4, upgrade 0001-F7,
  --explain 0001-F3), and for both the integration and acceptance tiers.
  Candidates to weigh, none chosen:
  - Tests reuse the production composition root (Program.cs's registrations)
    and replace only the seam they need, so a test cannot drift from what
    ships.
  - A shared fixture type (an xunit class or collection fixture, or a Rocket
    Surgery AutoFixture) that owns the registrar, the console and the tester.
  - A test host from Rocket Surgery's testing packages, if one fits
    Spectre.Console.Cli.
  - Constructing the command directly, with its settings and a TestConsole,
    and leaving Spectre's parser to the acceptance tier.
  0027, 0028, 0029 and 0040 add command tests next; the sooner this is
  decided, the fewer tests copy the helper.

acceptance_criteria:
  - "ADR-0007 (.spec/adr/0007-each-part-registers-itself-and-one-factory-composes-the-host.md) is accepted by the owner."
  - "specht-conventions references/testing.md states the rule - a test that runs a command gets its registrar and configuration from the factory - with its Never-add item: a ServiceCollection, TypeRegistrar or CommandAppTester assembled in a test outside the factory."
  - "The migration is a separate item that depends on 0099: the factory and the per-slice registrations; the Check and Init command tests moved onto it; the private Check helper, the duplicated private statics NewestVersion and Read in test/specht.tests/ShippingCopy.*.Tests.cs and test/specht.acceptance/Init/InitSteps.cs, and the hand-built CommandAppTester in test/specht.tests/InitCommand.Integration.Tests.cs removed; the unused Spectre.Console.Cli.Testing reference dropped from specht.acceptance."

decisions:
  - |
    2026-10-09, test-writer, spike findings: ADR-0006
    (.spec/adr/0006-a-test-runs-a-command-through-the-production-composition.md)
    is proposed, with the owner as decider. It proposes that a command test
    builds its CommandAppTester from one hand-written AutoFixtureBase<T>
    fixture over the host's own composition, which moves out of Program.cs
    into one public type, and replaces only the seam the test names. The
    acceptance tier keeps launching the built tool. Rejected, with their
    costs in the record: the hand-wired helper per class, a shared xunit
    fixture (a collection grew 1 -> 18 -> 35 registrations over two runs),
    the generated [AutoFixture] over the tester (it emits
    Substitute.For<ITypeRegistrar>() and needs NSubstitute), a Rocket
    Surgery test host (none exists for Spectre.Console.Cli), constructing the
    command directly (against 0001-F2 C-7), and invoking Program.cs's entry
    point. Correction to the summary: CheckSteps has launched the built tool
    since 0027 and composes no registrar. The second and third acceptance
    criteria wait on the owner's acceptance of ADR-0006.
  - |
    2026-10-09, implementer, on the owner's direction in session: the
    owner rejected ADR-0006 - the services and configuration do not move
    into a central public list, and the fixture that Replaces registrations
    after the fact rests on that list, so the proposal falls whole. ADR-0006
    is marked rejected. ADR-0007
    (.spec/adr/0007-each-part-registers-itself-and-one-factory-composes-the-host.md)
    is proposed, with the owner as decider: one static factory builds the
    app and Program.cs only calls it; the engine registers itself through
    AddSpechtEngine() (0107) and each command slice through its own
    registration; a test builds the same graph through the same factory,
    with the file system and the console as factory parameters and no
    after-the-fact Replace. Modelled on Transporter's and Rx.Tracker's
    MauiProgram.CreateMauiApp(). Two questions on this direction are open in
    the record: whether the check's runner is a factory parameter, and
    whether one test-tree wrap of the factory's product is the only
    CommandAppTester construction. The acceptance criteria are rewritten to
    this direction.

out_of_scope:
  - "Changing what the check command does - 0001-F2 owns that."
  - "The test tiers themselves; a 'ui' tier is a separate owner decision."
