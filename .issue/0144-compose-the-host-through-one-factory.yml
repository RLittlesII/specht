  - "Any mediator or dispatcher, third-party or handwritten - ADR-0026."
  - "Where `init`'s logic lives - ADR-0010 open point 2; `InitCommand` keeps its direct calls here."
  - "`--report` written through `SpecReportStore` - item 0036."
