  - "`AddSpechtEngine()` and the engine's registrations - 0107 (ADR-0001 stage D)."
  - "`Specht.Cqrs`, `Check.Query` and `Check.Handler` themselves, and deleting `SpechtRunner` - item 0167."
  - "`--report` as a `SaveReport` command - item 0036."
  - "The acceptance steps that launch the built tool - they compose nothing (ADR-0007). The five step classes that resolve the engine through `EngineServices` are in scope, above."
