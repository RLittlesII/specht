summary: |
  ADR-0007 (accepted 2026-10-10,
  .spec/adr/0007-each-part-registers-itself-and-one-factory-composes-the-host.md)
  decided how the host and a command test are composed; this item builds it.
  Depends on 0099, the spike that produced the decision.

  One static factory builds the app as one fluent chain. Each command slice
  carries its own registration beside its command, under
  src/tool/Features/Check/ and src/tool/Features/Init/: its services on
  IServiceCollection and its AddCommand on IConfigurator. The factory lists
  the parts and never their internals, and src/tool/Program.cs only calls
  it. The file system and the console are the factory's only caller inputs;
  the runner is never one. Since 0107 landed (2026-10-11) no check-slice
  registration exists: src/tool/Program.cs calls AddSpechtEngine() and
  registers the Func<string, SpechtReport> delegate from the resolved
  SpechtRunner, until the factory takes both.

  The command integration tests move onto the factory through one test-tree
  wrap, the only new CommandAppTester in the tree, which sets the default
  command. The check's fold tests, which hand the command a canned report
  today (`_ => report`), move onto synthetic trees with the real engine.
  It spans both command slices and both test projects, so it sits at the
  repository root.

  Item 0107 added two places that assemble a ServiceCollection in a test,
  each over AddSpechtEngine(): test/tests/Shared/EngineServices.cs, which
  is linked into test/acceptance and through which DiscoverySteps,
  EngineSteps, ManifestSteps, ReportSteps and VersioningSteps resolve the
  runner and the model loader; and
  test/tests/Composition/SpechtEngineServiceCollectionExtensions.Unit.Tests.cs,
  the registration tests. Both are in this item's scope. Under ADR-0007's
  testing rule EngineServices resolves through the factory once it lands;
  whether the registration tests' collection is the one named exception or
  moves behind the factory is the architecture pass's to decide.

  Item 0165's PR 170 review extracts the init slice's service and command
  registrations into InitRegistration.AddInit, shared by Program.cs and
  the init command integration tests. Those tests now use the real shipping
  copy; the former custom one-file copies are gone. This item retains the
  complete host factory and the one command-tester wrapper, reusing that
  slice registration rather than rebuilding it. Item 0207 tracks the
  owner's later EngineServices simplification and coordinates its remaining
  test-fixture responsibilities with this item and 0168.

  Reshaped 2026-10-11 on ADR-0010 (accepted 2026-10-11,
  .spec/adr/0010-layered-engine-boundaries-with-io-at-the-edge-and-a-mediator.md),
  which runs this item as stage 8 of its order of work, after stage 7,
  item 0167. ADR-0007's rules stand as written above. What ADR-0010 adds:

  - `CheckCommand` sends `Check.Query` through `ICqrs` and folds the report
    it receives. Where this summary says the factory "takes both" - the
    call to AddSpechtEngine() and the Func<string, SpechtReport> delegate -
    it takes the first only: the delegate is removed, not moved. Item 0167
    deletes `SpechtRunner` and leaves that one registration in
    src/tool/Program.cs re-pointed; this item removes it and the
    constructor parameter it feeds
    (`src/tool/Features/Check/CheckCommand.cs:19`).
  - The four input-failure exceptions still cross to the catch ladder in
    `CheckCommand` (`src/tool/Features/Check/CheckCommand.cs:31-46`);
    ADR-0010's handlers return a plain result (owner decision 4).
  - `InitWriter.ShippingCopy` (`src/tool/Features/Init/InitWriter.cs:25`),
    a static that holds the embedded shipping copy for
    `src/tool/Program.cs:15`, becomes an instance the init slice registers
    (owner decision 5). That bears on the point above: a test that needs a
    shipping copy of its own has an instance to be given.
  - `test/tests/Shared/EngineServices.cs` is in the test-support project
    from item 0168, which is also the "home both projects compile" a
    criterion below asks for.

  Two points ADR-0010 leaves open and hands to this item, for the
  architecture pass. Open point 5: the commands write to the static
  `Console.Error` (`src/tool/Features/Check/CheckCommand.cs:93`,
  `src/tool/Features/Init/InitCommand.cs:32`), a static holding I/O that
  the console the factory takes does not cover; the default is that it is
  handled here. Open point 2: where `init`'s handler lives; the default is
  the tool's `Init` slice, dispatched through the same `ICqrs`, and the
  pass says whether `InitCommand` sends a message in this item or stays as
  it is until `upgrade`.

acceptance_criteria:
  - "One static factory composes the host; each of `src/tool/Features/Check/`
    and `src/tool/Features/Init/` holds its slice's registration - services
    on `IServiceCollection`, `AddCommand` on `IConfigurator`."
  - "`src/tool/Program.cs` only calls the factory and runs the app."
  - "`test/tests/Check/CheckCommand.Integration.Tests.cs` and
    `test/tests/Init/InitCommand.Integration.Tests.cs` get their registrar
    and configuration from the factory through the one test-tree wrap; no
    other `new CommandAppTester`, `ServiceCollection` or `TypeRegistrar` is
    left under `test/`, but for what the next criterion names."
  - "Decided in the architecture pass, recorded here, and delivered:
    `test/tests/Shared/EngineServices.cs` resolves through the factory once
    it lands, and the collection
    `test/tests/Composition/SpechtEngineServiceCollectionExtensions.Unit.Tests.cs`
    assembles is either the one named exception to the criterion above or
    moves behind the factory."
  - "Every check test runs the real engine over a synthetic tree; none hands
    the command a canned report, and no runner is passed into the factory."
  - "Removed: the private `Check` helper in
    `test/tests/Check/CheckCommand.Integration.Tests.cs`, and the two
    hand-built `CommandAppTester`s in
    `test/tests/Init/InitCommand.Integration.Tests.cs`."
  - "Removed: the duplicated private static `NewestVersion` in
    `test/tests/Init/ShippingCopy.Unit.Tests.cs`,
    `test/tests/Init/ShippingCopy.Integration.Tests.cs` and
    `test/acceptance/Init/InitSteps.cs`, and the duplicated private static
    `Read` in the last two - one copy each, in a home both projects compile."
  - "Removed: the unused `Spectre.Console.Cli.Testing` reference in
    `test/acceptance/acceptance.csproj`."
  - "ADR-0010, stage 8: `CheckCommand` takes `ICqrs`, sends `Check.Query`
    with the root and folds the report; no `Func<string, SpechtReport>` is
    registered or injected anywhere in `src/tool`, and the command names no
    handler, reader or evaluator (`0001-F2` C-4, as item 0167's delta
    leaves it)."
  - "ADR-0010, stage 8: `InitWriter.ShippingCopy` is not static; the init
    slice registers the shipping copy as an instance, read once at
    composition."
  - "ADR-0010 open point 5, decided in the architecture pass, recorded here
    and delivered: how a command writes to stderr without the static
    `Console.Error`, with stdout and stderr carrying what they carry today
    (`0001-F2` C-3)."
  - "ADR-0010 open point 2, decided in the architecture pass and recorded
    here: whether `InitCommand` sends a message through `ICqrs` in this
    item."
  - "The unit, integration and acceptance tiers pass, and the tool's stdout,
    stderr and exit codes are unchanged."
  - "The golden report `test/tests/Engine/Baseline/engine-e7dba24.json` is
    unchanged, and the benchmark project `.performance/benchmarks` still
    compiles."
  - "No .feature change needed: refactor - the composition moves from
    `Program.cs` and the test classes into one factory and the slices'
    registrations; no command's behaviour changes."
  - "Constraints preserved: 0001-F2 C-2, 0001-F2 C-3, 0001-F2 C-7, ADR-0003"

decisions:
  - |
    2026-10-13, owner review on PR 170, review 5511895957: init command
    tests should use a composition method. Item 0165 extracts only init's
    existing service and command registration; the complete factory and
    command-tester wrapper stay here. The two init command tests no longer
    supply custom shipping copies. Item 0207 records the requested later
    EngineServices refactor and does not duplicate this item's factory.
  - |
    2026-10-10, implementer, on the owner's direction in session: cut on
    the owner's acceptance of ADR-0007, which names this work as its own
    item depending on 0099. The owner's two answers bind it: tests run the
    real engine over a synthetic tree, with the file system and the console
    the only caller inputs and the runner never a factory parameter; and
    one test-tree wrap of the factory's product is the only new
    CommandAppTester in the tree and sets the default command.
  - |
    2026-10-11, spec-author, on spec-reviewer's condition 4 for item 0107
    (0001-F1 § 12): the item is corrected to what 0107 delivered, and its
    scope grows by 0107's two test compositions. No check-slice
    registration exists; Program.cs registers the runner delegate from the
    resolved SpechtRunner (item 0107's decision of 2026-10-11, on the
    owner's approval), where ADR-0007 says the check slice stops
    registering the runner once 0107 lands. Five acceptance step classes
    resolve the engine through EngineServices, so the acceptance tier no
    longer composes nothing. EngineServices resolving through the factory
    follows from ADR-0007's testing rule and is this item's to deliver.
    What becomes of the registration tests' collection is not decided
    here: the criterion names the two outcomes open, and the architecture
    pass picks one.
  - |
    2026-10-11, spec-author: reshaped on ADR-0010, accepted by the
    repository owner the same day (item 0154), which names this item as
    stage 8. ADR-0007's rules are kept as written. Added on ADR-0010's
    authority: the command sends `Check.Query` through `ICqrs`; the
    `Func<string, SpechtReport>` seam is removed; `ShippingCopy` becomes an
    instance; open points 5 and 2 are carried for the architecture pass.
    `depends_on` gains 0167, stage 7. It gains 0168 as well, which
    ADR-0010's table does not ask for: this item needs one copy of a
    helper in "a home both projects compile", and `specht-conventions`
    § Testing makes such a helper wait for the test-support project. The
    owner may drop that edge. Status stays `ready-for-architecture`: the
    registration tests' collection and the two open points are still to
    be decided. `0001-F2` C-2 and C-3 are added to the constraints
    preserved, for the catch ladder and stderr.

