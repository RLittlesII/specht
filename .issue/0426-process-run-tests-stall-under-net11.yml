summary: |
  The Integration Test step under net11.0 stalls in
  `test/tests/Mcp/SystemProcessRun.Integration.Tests.cs`, the process
  boundary beneath `0132-F3` B-017 (`src/mcp/.spec/README.md`), and never
  ends. Seen on pull request #792, runs 42526206109 (runner vitruvius-3) and
  42530364175 (runner vitruvius-2).

  In both runs
  `AProgramThatIsRunning_WhenTheRunIsCancelled_ShouldThrowCancelledAndLeaveNoProgramAlive`
  timed out at 30 seconds. In 42530364175
  `AProgramThatReadsStandardInput_WhenItRuns_ShouldFindItClosedAndEnd` timed
  out 30 seconds later. The net11.0 `specht.tests` run then reported nothing
  more, and the step ran for 48 minutes until it was cancelled. net10.0
  passed 641 tests in both runs.

  Earlier CI runs on the same SDK, 11.0.100-rc.3.26522.148 (resolved by
  `global.json`'s latestFeature roll-forward), passed, so the failure is
  intermittent. It does not reproduce locally on rc.2.

  A reading, not a confirmed cause: two 30-second timeouts followed by a
  permanent stall fit a `Process.Start` that blocks and never returns. Every
  later start in the test host would then block too, including
  `AProgramThatWrites_WhenItEnds_ShouldGiveBackItsCodeAndBothStreamsUnchanged`,
  which has no `Timeout`. The cancel test is the only one that adds a
  blocking FIFO open on a thread-pool thread and an extra `mkfifo` process
  right before the run starts.

  No claim, scenario or `.feature` changes: the item preserves `0132-F3`
  B-017 and delivers no claim, so it sits at the repository root with
  `spec: null`.

  Value 4: the pull-request build cannot finish while the step stalls, and a
  48-minute stall holds a runner. Risk 2: test-only changes in one file,
  against a cause not yet confirmed.

acceptance_criteria:
  - "The cancel test depends on neither a blocking FIFO open nor an extra `mkfifo` process."
  - "Every test in `SystemProcessRunIntegrationTests` is bounded, so a stuck start fails that test instead of stalling the step."
  - "CI passes the net11.0 Integration Test step, and the step ends on its own."
  - "If the stall persists after the test change, it is recorded as a runtime finding in this item's decisions and is not masked."
  - "No production behaviour changes unless a test shows a defect; `0132-F3` B-017 still holds."

decisions:
  - |
    2026-11-08, spec-author: a root-level bug with `spec: null` and no claim.
    The tests hold the process boundary beneath `0132-F3` B-017 and the item
    preserves it; the stall is observed in tests, not in the host. Value and
    risk are spec-author's scores, not an owner ruling.
  - |
    2026-11-08, owner: option A selected. specht-mcp stops calling
    `Kill(entireProcessTree: true)` on macOS and Linux and instead kills the
    program's descendants, children before parent, without a stop step.
  - |
    2026-11-08, spec-author: runtime finding. The test change alone
    (`5099c78a`) did not stop the stall; it reproduced in 1 of 11 full
    `net11.0` Integration-tier runs locally. After the production change
    (`bb378585`), 26 full `net11.0` tier runs and more than 40 runs of
    `SystemProcessRunIntegrationTests` passed with 0 stalls, measured
    locally; CI is still to be confirmed. The cause and the design are in
    `0132-F3` § 7, "Ending a cancelled run", and the incident in
    `src/mcp/.spec/lessons/0001-a-tree-kill-that-stops-first-stalls-the-host.md`.

out_of_scope:
  - "Changing `global.json`'s SDK pin or roll-forward policy."
  - "Any change under `src/mcp/` beyond ending a cancelled run on macOS and Linux, the defect the cancel test showed (decisions, 2026-11-08)."
  - "Masking the stall by skipping a test or removing net11.0 from the Integration Test step."
