summary: |
  The third part of the guide the repository owner asked for on
  2026-10-11: "setting up your own schema using github". It describes
  behaviour now built - a manifest recording an
  upstream schema source (0001-F7 decision 0004), init fetching it
  (0001-F4 B-014) and the check validating with it (0001-F7 B-024) - so it
  follows the items that build it. 0001-F7 OQ-35 and OQ-36 were resolved
  by decision 0008: a raw HTTPS address and public sources only, with no
  credential read by the first release.

  No specification governs `docs/`, so this item delivers no claim. Value
  4 and risk 2, as 0179.

  Expected files: `docs/setup.md`. Nothing under `src/`, `test/` or
  `.build/`.

acceptance_criteria:
  - "`docs/setup.md` gains a section that takes a consumer from frontmatter schemas in a GitHub repository of their own to a repository whose check validates with them: where the files sit, the address, the hash, pointing a new repository at them, and what `init` writes."
  - "It states the ratified answer to 0001-F7 OQ-36: public sources only in the first release, with no credential read from the environment or keychain."
  - "It says what stays the tool's: the rule vocabulary and the manifest schema are the pinned embedded version's (0001-F7 B-028)."
  - "It states only what the tool does on the day it merges, and every command it shows runs as written against a tool built from that commit."
  - "Terse, as 0179. Every link resolves, and no path in it is absolute."
  - "`./build.sh Format` and `./build.sh Specht` pass."

