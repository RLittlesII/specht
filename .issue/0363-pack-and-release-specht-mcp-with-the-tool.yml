summary: |
  Release 0.5.0 shipped without the MCP package. The Pack target writes only
  specht.tool and Specht.CodeAnalysis, the release package list names only
  those two, and the push and the generated release workflow therefore never
  publish specht.mcp, which ADR-0031 and 0132-F3 C-11 version and tag with the
  tool on the one v<version> tag. The specification delta is 0055-F1 B-009,
  0055-F6 B-003 (decision 0010) and the new 0132-F3 B-035.
acceptance_criteria:
  - "0132-F3 B-035 — specht.mcp packed and pushed with the tool and the analyzer package; 0055-F1 B-009 and 0055-F6 B-003 amended to match; § 9 carries a row naming a test for B-035."
  - "Pack writes specht.tool, Specht.CodeAnalysis and specht.mcp packages under .artifacts/nupkg/, each at the version the build computes for the commit."
  - "The release package list and PushReleasePackages name all three packages, and a missing file for any one of them fails the push before any package is pushed."
  - "The generated workflows are regenerated and committed, with the step order diffed."
  - "AGENTS.md, specht-conventions, its coding reference and the docs no longer say the MCP is not yet in Pack or the release."
decisions:
  - "2026-11-05, spec-author: the delta is decision 0010 of 0055-F6, citing ADR-0031 and 0132-F3 C-11 as the ruling already made; 0055-F6 B-007 is withdrawn and stays so. 0201-F6 B-020 says the analyzer package is published alongside specht.tool and is left as it is."
out_of_scope:
  - "Creating or pushing the v<version> tag, and publishing any package: the maintainer's, by the release procedure in docs/releasing.md."
  - "The nuget.org package id reservation and the trusted-publisher entry for specht.mcp: the owner's, outside this repository."
  - "Everything in 0132-F3 § 5; no change to what the MCP serves, and no change to 0055-F6 C-1, C-4, C-5, C-9 or C-10, which this item preserves."
