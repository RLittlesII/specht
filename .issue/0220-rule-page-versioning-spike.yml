out_of_scope:
  - "Changing how `main` stores, generates, embeds or locks rule pages - a follow-up item cut after the owner rules on the ADR."
  - "Deciding the site's hosting or framework - `0002-F2` OQ-1 and OQ-2; the spike's findings may feed them."
  - "Building, scaffolding or publishing the documentation site - `0002-F2` B-003 holds it until the owner lifts the deferral."
  - "Building `--explain` - `0001-F3` B-019."
  - "Changing a rule's text or the page shape - `0001-F3` § 5 rows 5 and 12, B-032."
  - "Which shipped versions a tool keeps embedding - `0001-F7` C-1 and decision 0007."
  - "Editing an accepted ADR or decision record - a new record answers it."
