summary: |
  As the maintainer of repositories using the tool, I want its fixed cost
  measured through a local tool manifest so launch, host and check costs
  have recorded findings. This is the delivery container for 0109-F4.

  The owner requested decomposition and design on 2026-10-13, not benchmark
  implementation. The approved agreement supplies the scope. Only the
  timing child needs the already delivered harness target and generator;
  the memory investigation can establish feasibility with synthetic tools.
  No dependency on the production-tree refactor is introduced.

