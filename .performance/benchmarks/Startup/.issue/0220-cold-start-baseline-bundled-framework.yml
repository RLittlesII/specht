  - "`./build.sh Benchmark --benchmark-filter '*ColdStart*' --benchmark-job Short` completes its setup and reports all three rows."
  - "`./build.sh`, `./build.sh Format` and `./build.sh Specht` pass."
  - "No .feature change needed: bug fix - the baseline is generated, packed and installed in the session as before, and only its target framework changed. Constraints preserved: 0109-F4 C-4, 0109-F4 C-5, 0109-F4 C-8"

decisions:
  - |
    2026-10-14, the repository owner: reported the failing `Benchmark` step
    on `main`.
  - |
    2026-10-14, implementer: a bug under 0203 delivering B-007 again, since
    the claim's setup failed. Rejected: naming `net11.0` literally, which
    breaks at the next SDK pin; and adding a remote source to the session,
    which C-4 rules out.
  - |
    2026-10-14, implementer: a process lesson in this Feature's `lessons/`,
    with the rule in `specht-conventions` § Testing, because every project a
    test or benchmark generates at run time carries the same trap.
  - |
    2026-10-14, implementer: the generated projects in
    `test/acceptance/Build/BuildSteps.cs` keep `net10.0`. They restore from
    the inherited sources and the user's package folder, not an isolated
    feed, so the SDK downloads the pack it lacks.

