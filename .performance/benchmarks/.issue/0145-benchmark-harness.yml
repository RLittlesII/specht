  - "B-001 — compiled with the solution (0146)"
  - "B-002 — the default build runs no benchmark (0146)"
  - "B-003 — no filter: every benchmark runs (0148)"
  - "B-004 — a filter: only the matching full names (0148)"
  - "B-005 — a named job is the job (0148)"
  - "B-006 — no job named: the library's default (0148)"
  - "B-007 — allocated memory per operation, every benchmark (0146)"
  - "B-008 — results under `.artifacts/benchmarks/` (0148)"
  - "B-009 — a human-readable summary per class (0148)"
  - "B-010 — a machine-readable result per class (0148)"
  - "B-011 — any measurement: the target succeeds (0148)"
  - "B-012 — a benchmark that throws: the target fails (0148)"
  - "B-013 — cold start selected: packed first (0148)"
  - "B-014 — working tree unchanged outside `.artifacts/` (0148)"
  - "B-015 — a generated tree of each size passes the check (0147)"
  - "B-016 — the same size generates the same tree (0147)"
  - "B-017 — CI runs the target on each operating system the run covers (0149)"
  - "B-018 — CI runs the short job (0149)"
  - "B-019 — results published as an artifact named for the operating system (0149)"
  - "B-020 — the benchmark step after every gate step (0149)"
  - "B-021 — no cold start selected: nothing packed (0148)"
  - "§ 9 carries a row naming a test for each id above."

decisions:
  - |
    2026-10-11, spec-author: sliced into the project, its entry point and
    shared configuration (0146), the tree generator (0147), the `Benchmark`
    target (0148) and the CI step (0149), so that what `0109-F3` needs
    waits on neither the target nor CI. Rejected: the generator inside
    0146, which would put a tested mechanism in the same item as the
    project declarations; and the CI step inside 0148, which would hold a
    local target behind a generated workflow.
  - |
    2026-10-11, the repository owner: the validation — the check measured
    end to end (`0109-F3`, item 0150) — is the first thing covered, because
    it is the first feature shipping, and work stops once it is covered.
    0146, 0147 and 0150 are delivered now; 0148 and 0149 are cut and left
    in the queue.
  - |
    2026-10-11, the repository owner: `0109-F3`'s check-scaling benchmark
    (0150) is the first measuring item and is delivered before the
    `Benchmark` target (0148). With no benchmark class the harness selects
    nothing and cannot be observed, and `benchmarker` refuses a
    placeholder. Rejected: the target first, run against no benchmark or a
    placeholder one.
  - |
    2026-10-11, the repository owner: the tree generator's claims (B-015,
    B-016) are tested. The build-target and CI claims are proven as
    `0055-F1` and `0055-F2` are under the owner's 2026-10-08 ruling that
    the build and CI carry no tests: `Missing` in § 9, with the mechanism
    recorded in § 8. `benchmark-harness.feature` is not linked into
    `test/acceptance`.
  - |
    2026-10-11, the repository owner: `0109-F1` carries value 3 and is not
    on the `.issue/.goal` path.

