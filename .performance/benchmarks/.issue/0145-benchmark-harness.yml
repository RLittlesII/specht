summary: |
  As the maintainer of four repositories, I want one benchmark project that
  a build target runs locally and CI runs on every build, with memory
  measured on every benchmark and the results kept as files, so that a cost
  a specification names has a number, and no number ever fails a build.

  The container for `0109-F1`. The project (0146) and the tree generator
  (0147) are what `0109-F3`'s check-scaling benchmark (0150) stands on, and
  are delivered now; the `Benchmark` target (0148) and the CI step (0149)
  are cut and wait in the queue (owner, 2026-10-11). The item carries no
  dependency of its own: 0146 names the build scaffold it joins, and 0149
  the workflow it adds a step to.

