summary: |
  The CI benchmark step: the `Benchmark` target under the short job on
  each operating system a run that builds covers, after the format,
  compile, test and self-check steps, with the results published as a
  build artifact named for the operating system. The step is generated by
  the build and its regeneration committed with the step order diffed
  (C-12); the artifact holds the exporters' result files only (C-13).

  It also closes the `Benchmark` half of `0055-F2` B-004, which 0063 has
  carried as owed since 2026-10-09.

  Depends on 0148: the step runs that target. Depends on 0064: the step
  is added to the workflow 0064 generates. Depends on 0118: on a pull
  request the windows leg runs no target (A-4), decided by the step 0118
  delivered. Cut and left in the queue (owner, 2026-10-11; 0145).

  Proven as `0055-F2` is: no test, `Missing` in § 9, the mechanism
  recorded in § 8 (owner, 2026-10-11; 0145).

  Risk 3: the generator orders steps by dependency depth, so B-020 holds
  only if the order is diffed, and the library's run log carries absolute
  paths the artifact must leave out.

