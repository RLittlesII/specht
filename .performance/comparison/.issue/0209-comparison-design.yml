summary: |
  Establish 0109-F5 § 6-7 and have test-writer author § 8 before implementation.
  Choose where the comparator is compiled and tested, its input/output contracts,
  workload identity, unit normalisation, confidence metadata and retained evidence.

  Prove an acyclic collection/publication path under C-10 and 0055-F6 C-7: both
  product revisions must execute without publishing credentials, attachment stays
  inside the existing release authority, and failures after publication remain
  advisory. Name the trigger, runner ownership, cancellation/timeout outcome and
  how the originally selected predecessor survives retries. A minimal disposable
  probe may establish generator or isolation capability; it is not production
  implementation. If the existing boundary cannot support the design, record the
  specific conflict and escalate it before any implementation child starts.

  This item delivers a reviewed design rather than a behaviour claim. The five
  implementation children depend on that contract.

