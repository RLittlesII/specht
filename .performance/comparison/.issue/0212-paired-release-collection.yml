summary: |
  Implement the collection boundary from the design using the release pair and
  metadata contracts from 0210 and the delivered harness target from 0148.
  Run the exact published product revisions on one runner in one session with
  matching conditions, preserving the measuring Features' setup boundaries.
  Historical revisions without a usable harness or equivalent workload yield
  explicit unavailable evidence; never substitute a newer product or older release.

  Orchestration tests use fake process outcomes and synthetic files; they do not
  test benchmark classes, assert a measured timing or depend on a real release.
  A local manual paired collection supplies measurement-boundary evidence. This
  item can close with a local collector before release automation is added.

  Contract: .performance/comparison/.spec/README.md § 7-8 and
  .performance/comparison/.spec/adr/0001-read-only-collection-with-a-release-job-rendezvous.md.
  Implement receipt-driven CollectionPlan execution, expected native inventories,
  bounded process-tree lifetime, allowlisted child environments and session
  metadata. Unknown native harnesses remain unavailable; do not transplant one.

acceptance_criteria:
  - "B-004 — paired session and environments"
  - "Preserve C-2, C-3, C-8 and C-10; measure without publishing credentials and retain only relative result paths."
  - "Synthetic orchestration unit/integration tests pin invocation identity, metadata, cleanup, failures and cancellation; § 9 identifies the B-004 proof and § 8 records the manual paired measurement boundary."
  - "Do not change the existing Benchmark target's broken-benchmark failure semantics."

decisions:
  - "2026-10-13: design contract reviewed under 0209; scope and prerequisites retained. Ready-for-implementation names design maturity, not permission to bypass depends_on or the one-writer Feature lane."

