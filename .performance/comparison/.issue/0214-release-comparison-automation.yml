summary: |
  Wire the reviewed design into the existing generated release workflow.
  Depends on 0212 for collection, 0213 for rendering/retention, 0083 for the release
  workflow and 0084 for successful package/Release publication. The 0084 delivery
  state remains authoritative; this decomposition does not declare it done.

  Only an eligible successfully published release triggers the comparison.
  Review flags and failures from every comparison-owned stage remain advisory,
  while earlier correctness and publication failures keep their original verdict.
  The release-run summary exposes the result and valid report link, or an
  actionable incomplete outcome when reporting/attachment fails. No older release
  is substituted when the selected predecessor cannot be measured.

  Regenerate workflows through NUKE and inspect step order and credentials. Verify
  orchestration with synthetic release catalogs, process outcomes and publisher
  responses; do not create a trial release to test this item. Test build-owned
  logic as applicable, and record generated declaration verification separately
  rather than calling it comparator coverage.

