decisions:
  - "2026-10-13: design contract reviewed under 0209; scope and prerequisites retained. Ready-for-implementation names design maturity, not permission to bypass depends_on or the one-writer Feature lane."
  - "2026-10-31: receives ReportingOutcome from 0211. No 0211 claim or caller produces one; the first is a reporting-stage failure under B-018, so this item builds it beside the stage outcome mapping that consumes 0211's ComparisonDocument."
  - "2026-11-01: owner resolved OQ-3 - identity mappings are generated from the workload identity the benchmarks of each measured revision declare; a revision without declarations has an unknown inventory and an Incomplete comparison, with no hand-written fallback and no mapping borrowed from another revision. Chosen over a hand-audited file per revision and a hand-audited registry keyed by product commit. The owner was told this widens this item; B-025 is added to it. Decision 0005."
  - "2026-11-01: owner placed the comparison job on the self-hosted pool [self-hosted, macOS, ARM64] that runs build and release, over GitHub-hosted Linux and macOS runners (C-12). The rendezvous completes only when the pool runs two or more jobs at once; with one runner every release ends Incomplete after the bounded release-side wait, advisory, never a failed build (A-4). OQ-4 asks whether a single runner taken first by the comparison job may delay publication. Decision 0005."

