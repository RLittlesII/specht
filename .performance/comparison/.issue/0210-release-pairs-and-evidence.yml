summary: |
  Implement the release-catalog and measurement-evidence boundary from the
  reviewed design. Depends on 0209 for the comparison contracts and workload
  identity rules. Release pagination, stable/prerelease eligibility, publication
  ordering and deterministic ties, resolved commits and saved rerun pairs belong
  here; the caller supplies the catalog and evidence so tests need no network.

  Read synthetic exporter payloads into validated workload cases and conditions,
  without treating a display name as identity. The output is independently useful
  to local callers and the verdict item, and reports unavailable or incompatible
  cases explicitly. Completion does not claim collection, rendering or GitHub
  attachment.

