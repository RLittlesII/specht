summary: |
  Implement the release-catalog and measurement-evidence boundary from the
  reviewed design. Depends on 0209 for the comparison contracts and workload
  identity rules. Release pagination, stable/prerelease eligibility, publication
  ordering and deterministic ties, resolved commits and saved rerun pairs belong
  here; the caller supplies the catalog and evidence so tests need no network.

  Read synthetic exporter payloads into validated workload cases and conditions,
  without treating a display name as identity. The output is independently useful
  to local callers and the verdict item, and reports unavailable or incompatible
  cases explicitly. Completion does not claim collection, rendering or GitHub
  attachment.

  Contract: .performance/comparison/.spec/README.md § 7-8 and
  .performance/comparison/.spec/adr/0001-read-only-collection-with-a-release-job-rendezvous.md.
  Establish comparison.csproj, its solution entry and the nonempty
  test/comparison.tests project first. Own ReleasePair/SessionManifest wire
  contracts, recognised exporter decoding, identity mappings, metric validation
  diagnostics and insert-only pair persistence. Provider I/O uses HttpClient's
  handler seam; no publishing credential is created by this capability.

acceptance_criteria:
  - "B-002 — predecessor identity and reruns"
  - "B-005 — matching measurement cases"
  - "B-006 — mismatch or unknown equivalence"
  - "B-007 — added cases"
  - "B-008 — removed cases"
  - "Unit and synthetic acceptance tests pin ordering, eligibility, conversion boundaries and case pairing; disk/transport integration tests use synthetic input and no live provider."
  - "§ 9 names the tests for the five assigned claims; preserve C-2, C-5, C-6 and C-7."

decisions:
  - "2026-10-13: design contract reviewed under 0209; scope and prerequisites retained. Ready-for-implementation names design maturity, not permission to bypass depends_on or the one-writer Feature lane."

