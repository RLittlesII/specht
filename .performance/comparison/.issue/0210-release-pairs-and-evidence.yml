  - "Unit and synthetic acceptance tests pin ordering, eligibility, conversion boundaries and case pairing; disk/transport integration tests use synthetic input and no live provider."
  - "§ 9 names the tests for the five assigned claims; preserve C-2, C-5, C-6 and C-7."

