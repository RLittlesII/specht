summary: |
  Render and persist the comparison document produced by 0211 using the design's
  report/evidence contract. Produce human-readable and machine-readable forms from
  one result, with coherent policy, release-pair and raw evidence references.
  Define the report bundle consumed by release attachment; a durable publication
  adapter and offline publication fixture exercise the retention contract without
  contacting GitHub. This supplies the publication capability; 0214 only wires its
  authorised invocation into the release run.

  Publication failures stay observable, and no report points to nonexistent raw
  evidence or claims an attachment succeeded when it did not. Local rendering and
  publication-adapter proofs let this slice close before workflow wiring.

  Contract: .performance/comparison/.spec/README.md § 7-8 and
  .performance/comparison/.spec/adr/0001-read-only-collection-with-a-release-job-rendezvous.md.
  Own EvidenceManifest, self-contained per-attempt ZIP validation and the
  insert-only release-asset adapter invoked only with caller-provided authority.
  Sanitize path metadata while retaining numerical evidence; verify every digest
  and referenced file before claiming durable publication.

acceptance_criteria:
  - "B-015 — equivalent report forms"
  - "B-016 — policy and evidence identity"
  - "B-022 — release retention"
  - "Unit and offline integration/acceptance tests compare both report forms, evidence references, relative paths and durable publication after transient artifact expiry; § 9 names each assigned claim's proof."
  - "The adapter does not grant credentials; preserve C-8 and C-10."

decisions:
  - "2026-10-13: design contract reviewed under 0209; scope and prerequisites retained. Ready-for-implementation names design maturity, not permission to bypass depends_on or the one-writer Feature lane."
  - "2026-10-31: report.json is the canonical ComparisonJson encoding of { formatVersion: 1, pair, comparison }, where comparison is the document with each observation's sourceFile rewritten from its workspace path to its bundle path raw/<side>/<file name>; nothing is recomputed, and no separate report reader is added. report.md shows the same bundle paths with their locators."
  - "2026-10-31: a supplied raw export that no observation cites is retained in the bundle with empty cases, not rejected."
  - "2026-10-31: publication requires the asset name's release id, run id and attempt to equal the bundle's pair.json release and session.json run and attempt, not only the release id."
  - "2026-10-31: report.md rounds numbers for display only - half away from zero to at most two decimal places, trailing zeros dropped, invariant culture; a null number reads Not defined. report.json keeps the unrounded values."
  - "2026-11-01: owner, \"Widen the check\": an absolute path embedded in a longer string value of any JSON entry of the report bundle - a session invocation, workload parameter, reason or raw export value, such as Root=/home/runner/..., file:///... or C:\\... - rejects the bundle when it is built and when it is validated, never rewritten. A raw export value that is wholly a rooted path is still removed and recorded as absolute-paths-removed. Units, ratios, relative paths and locators that resolve in their cited export are kept. Basis: brief § 9 and C-8; rule in C-11 and decision 0004."

out_of_scope:
  - "Everything in § 5 of the specification."
  - "Release workflow wiring — 0214; no release is published by this item."
