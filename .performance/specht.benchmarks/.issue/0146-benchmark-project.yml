summary: |
  The benchmark project at `.performance/specht.benchmarks`, listed in the
  solution, not packable and not a test project (C-2); the benchmark
  library's version written once, centrally (C-3); one entry point that
  selects benchmarks by full name from the command line (C-5); and the
  shared configuration that reports allocated memory on every benchmark
  (C-4) and keeps a recorded finding on a Release build under the default
  out-of-process toolchain (C-6).

  Depends on 0057: the solution, the central package file and the
  `Compile` target the project joins are the scaffold's. The root of this
  Feature: 0147 and 0148 wait on it, and so does `0109-F3`'s 0150. It
  holds no benchmark class, so B-007 is first observable when 0150's
  lands (owner, 2026-10-11; 0145).

  Risk 2: declarations in three shared files and one new project; the
  hazard is a project the tier filters select or `Compile` skips (C-2).

