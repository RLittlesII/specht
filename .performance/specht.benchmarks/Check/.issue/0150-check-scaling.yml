summary: |
  As the maintainer of four repositories, I want the engine's whole check
  measured over generated trees of 1, 10, 100 and 1000 specifications, so
  that how its time and allocation grow with the tree is a recorded
  finding before any consumer's tree is that large.

  `0109-F3`, uncut: one benchmark, one item. The finding is a growth
  shape, never a threshold (C-1); the measured call is the engine's whole
  run from a root on disk and nothing of the host (C-2, C-3); each size's
  tree is generated once and reused (C-4).

  Depends on 0146: the benchmark class lives in that project and runs
  through its entry point and shared configuration. Depends on 0147: the
  trees it measures are the generator's. It does not wait on the
  `Benchmark` target (0148), which waits on this (owner, 2026-10-11).

  Risk 2: one benchmark class over a parameter; the hazard is setup or
  tree generation leaking into the measurement (C-4).

acceptance_criteria:
  - "B-001 — one whole check measured at each of the four sizes"
  - "B-002 — the measured call's report counts every generated specification"
  - "B-003 — the measured tree is co-located"
  - "B-004 — each result names its number of specifications"
  - "§ 9 carries a row naming a test for each id above."

