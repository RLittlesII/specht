summary: |
  As the maintainer adopting the tool, I want `specht init` to write the
  schema set and templates from copies embedded in the tool, never
  overwriting what exists, so that every consumer starts from the same
  bytes as this repository and the copy is a fact of the tool version.

  The embedded copy (0051) is the first thing schema versioning builds on:
  0042 -> 0051, and init pinning the newest version is 0049 -> 0052. OQ-1
  was resolved by the owner on 2026-10-08: no version argument, absent
  files at an older pin's version (B-012), refusal with exit 3 for an
  unshipped pin (B-013); 0054 carries those beside B-002 and now also waits
  on 0042 for the older versions.

  B-014 to B-017 came with 0001-F7 decision 0004 and the rule that
  every command answers a rejected manifest with 3: init fetching a
  recorded upstream source (0095) and init refusing a rejected
  manifest (0096).

acceptance_criteria:
  - "B-001 — bare root: the eight files of the newest version; exit 0 (0052)"
  - "B-002 — an existing file left byte-for-byte (0054)"
  - "B-003 — written file equals the embedded copy (0052)"
  - "B-004 — embedded newest equals this repository's live copy (0051)"
  - "B-005 — written schema `$id` names this repository and the version (0051)"
  - "B-006 — stdout lists each file as written or skipped (0052)"
  - "B-007 — root not a directory: stderr, nothing written, exit 2 (0053)"
  - "B-008 — nothing outside schema/ and templates/ (0052)"
  - "B-009 — no `--root`: working directory (0052)"
  - "B-010 — partial tree: absent files written (0053)"
  - "B-011 — partial tree: exit 0 (0053)"
  - "B-012 — older shipped pin: absent files at the pinned version (0054)"
  - "B-013 — unshipped pin: nothing written, exit 3 (0054)"
  - "B-014 — upstream source: absent schema files fetched and written (0095)"
  - "B-015 — upstream content mismatches the hash: exit 3 (0095)"
  - "B-016 — upstream source unreachable: exit 3 (0095)"
  - "B-017 — a manifest the check rejects: nothing written, exit 3 (0096)"
  - "§ 9 carries a row naming a test for each id above."

decisions:
  - |
    2026-10-08, Claude at the owner's request: sliced into the embedded
    shipping copy (0051), which schema versioning also builds on, then the
    write into a bare root (0052), then partial trees and the bad-root
    failure (0053), and B-002 alone (0054) because OQ-1 blocks it and nothing
    else. Rejected: B-002 inside 0052, which would hold the bare-root write
    behind a question about multi-version trees that do not exist until a
    second version ships.
  - |
    2026-10-08, Claude at the owner's request: B-014 to B-016 in one
