summary: |
  Init beside what already exists: an existing file is left byte-for-byte;
  beside a manifest pinning an older shipped version, the absent files are
  written at that version, keeping one version in `.spec/`; beside a pin the
  tool does not ship, init writes nothing and exits 3, as the check does.
  Depends on 0042 because writing an older version needs the embedded
  version set.

acceptance_criteria:
  - "B-002 — an existing file left byte-for-byte"
  - "B-012 — older shipped pin: absent files at the pinned version; exit 0"
  - "B-013 — unshipped pin: versions on stderr, nothing written, exit 3"
  - "§ 9 carries a row naming a test for each id above."

decisions:
  - |
    2026-10-08, the repository owner: OQ-1 resolved — (a) no version
    argument, (b) write absent files at the pinned version, (c) refuse with
    exit 3. Rejected: a `--version` option; writing at the newest beside an
    older or unshipped pin. The spec gained B-012 and B-013 for (b) and (c);
    both land here beside B-002. Status moved from blocked to
    ready-for-architecture.

out_of_scope:
