decisions:
  - |
    2026-10-08, Claude at the owner's request: sliced into the pinned,
    embedded version set (0042) that everything reads, then the source switch
    and the freeze test beside it, then `upgrade` as its core move (0045)
    with its failures (0046) apart, and each claim an open question blocks
    in its own item (0047, 0048) so the rest can proceed. Rejected: upgrade
    as one item, which would sit blocked on three questions for claims that
    need none.
  - |
    2026-10-08, Claude: the report's version and source fields are defined
    by Report's 0034 and filled with their true values here (0042, 0043),
    not the reverse — 0034 waiting on this Feature while 0043 waits on 0034
    would be a cycle.
  - |
    2026-10-08, Claude at the owner's request: B-024 to B-036 cut into
    three items by command and by source - the check under a recorded
    upstream source (0092), upgrade's fetch (0093), and upgrade with the
    on-disk source (0094). Rejected: folding them into 0043 or 0045,
    whose claims need no network path and would wait on one.
  - |
    2026-10-09, spec-author, on the plan the owner approved (decision
    0005, OQ-13): one conversion item (0118) for the integer pin 0042
    delivered, cut before any other item here starts; 0045 re-cut as
    "bring the files to the pin"; the list command (0119), the pin command
    (0120) and its input failures (0121) each in an item; the Coulds
    apart in 0122 and 0123, at the spec-reviewer's request, so no Must
    item waits on them. B-008 dropped: withdrawn. Rejected: reopening
    0042, which would erase what it delivered and when.

