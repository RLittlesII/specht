summary: |
  As the maintainer of a lagging repository, I want the manifest to pin a
  schema version the tool still checks, and `specht upgrade` to move the
  schema set and templates one version forward and say what changed, so
  that lagging is deliberate and catching up is one command.

  Risk 4: every shipped version stays embedded and byte-identical forever
  (C-1), so a mistake is permanent once published. OQ-3, OQ-5 and OQ-6 were
  resolved by the owner on 2026-10-08 (0047, 0048 unblocked), and OQ-4
  too (decision 0003): version 1 accepts an epic's `title` and
  `description`, claimed by B-022 and delivered in 0042. OQ-1, the
  source option's names, is architecture's to propose in § 7.
  The embedded version set builds on init's shipping copy (0042 -> 0051),
  and init pinning the newest version waits on init's write (0049 -> 0052).

