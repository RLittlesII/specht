summary: |
  The pin command writes nothing and exits 2 for a root that is not a
  directory or has no manifest, and 3 for a manifest the check rejects
  for a reason other than its `schemaVersion` — the codes the check and
  `upgrade` give (0027 and 0013, both delivered; 0046). Waits on 0120
  for the command, and through it on OQ-11. Which failure wins when one
  of these meets an unshipped version (B-046) is OQ-23, the owner's.

acceptance_criteria:
  - "B-047 — root not a directory: nothing written, exit 2"
  - "B-048 — no manifest: nothing written, exit 2"
  - "B-049 — manifest rejected for another reason than its version: nothing written, exit 3"
  - "§ 9 carries a row naming a test for each id above."

decisions:
