summary: |
  Item 0042 delivered `schemaVersion` as an integer; decision 0005 makes
  it `major.minor.patch`. Convert the pin, the embedded version set and
  the report to semver: no key reads as `0.1.0`, a value that is not
  three numbers is rejected with exit 3, and a pin is checked with exactly
  the version it names. The first item of this Feature to start: every
  other open one reads the version this produces.

  It also carries what the specification change left behind:
  - rebinding the acceptance steps decision 0005 reworded, in
    `versioning.feature` and in the "version 1" steps of `init.feature`,
    `report.feature` and `engine.feature`;
  - spec-author's rewording of the `init.feature` scenarios that pin the
    integers 1, 2 and 7 (0001-F4 B-012, B-013), which B-039 makes
    malformed. It is due in this item's pull request; whether 0001-F4
    also claims `init` beside a malformed `schemaVersion` is 0001-F4 OQ-3;
  - the report document's `schemaVersion` type (0001-F3 B-005,
    `docs/schema/report.schema.json`), an integer today;
  - refreshing 0001-F7 § 6 to § 8, which describe the integer pin, and
    confirming the § 9 rows the specification change reset.

  The embedded folder and the `$id` segment keep the name they have
  today. Renaming them is 0126, which waits on OQ-22; this item closes
  without that answer.

  Risk 3: it changes a delivered engine path and a published document
  shape across three Features, before anything is published. Whether a
  prerelease or build suffix is a version is OQ-15; B-039 reads three
  numbers and nothing else until it is answered.

