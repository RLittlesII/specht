summary: |
  The mode used outside a git work tree or with no git on PATH: a walk that
  prunes on the manifest's exclusions, so no child of an excluded directory is
  ever enumerated. Replaces today's full walk followed by a filter. Depends on
  0005 for the exclusion list it prunes on.

acceptance_criteria:
  - "B-006 — no child of an excluded directory enumerated (C-1: no enumerate-then-filter)"
  - "§ 9 carries a row naming a test for each id above."

decisions:
  - |
    2026-10-11, spec-author: `depends_on` gains 0166 on ADR-0010, accepted
    by the repository owner the same day (item 0154), whose § "Items
    reshaped" makes items 0007 and 0008 depend on stage 6. After 0166 one
    type, `SpecModelReader`, calls discovery, and discovery returns a
    listing and reads no file's text; this item's mode is built behind
    that caller. `ISpecDiscovery` still arrives with items 0007 and 0008
    and not before (ADR-0001, as ADR-0010 § "What this supersedes" leaves
    it). The claims, the criteria and the scope are unchanged.
  - |
    2026-11-08, spec-author: this item closes with § 9's B-006 row
    `Partial`. The walk is built and its tests pass; the claim's second
    condition, `git` absent from `PATH`, needs a mode choice that does not
    exist until item 0008 adds git mode. The remainder - selecting the
    walk outside a work tree or with no `git` on `PATH`, and the second
    `@B-006` scenario - moves to item 0008, whose `claims` gains B-006.

