summary: |
  Inside a work tree with git on PATH, ask the git executable (decision 0002)
  for tracked and untracked-not-ignored files matching the manifest's globs,
  with the manifest's exclusions passed as exclude pathspecs. Risk 4: a child
  process, pathspec translation of both exclusion forms, and an open failure
  case (OQ-2). Depends on 0005 for every pathspec it passes.

acceptance_criteria:
  - "B-005 — tracked plus untracked-not-ignored; ignored directory never opened"
  - "B-006 — mode selection: outside a git work tree, or with no `git` on `PATH`, the walk runs; the scenario \"Discovery runs without git on the path\" bound"
  - "B-010 — exclusions as exclude pathspecs; tracked and untracked file under `bin` both absent"
  - "§ 9 carries a row naming a test for each id above."

decisions:
  - |
    2026-10-11, spec-author: `depends_on` gains 0166 on ADR-0010, accepted
    by the repository owner the same day (item 0154), whose § "Items
    reshaped" makes items 0007 and 0008 depend on stage 6. After 0166 one
    type, `SpecModelReader`, calls discovery, and discovery returns a
    listing and reads no file's text; this item's mode is built behind
    that caller. `ISpecDiscovery` still arrives with items 0007 and 0008
    and not before (ADR-0001, as ADR-0010 § "What this supersedes" leaves
    it). The claims, the criteria and the scope are unchanged.
  - |
    2026-11-08, spec-author: `claims` gains B-006, for its remainder.
    Item 0007 built the walk and closes with § 9's B-006 row `Partial`:
    choosing the walk when the root is outside a work tree or `git` is
    absent from `PATH` needs this item's git mode, and § 8 already binds
    the scenario "Discovery runs without git on the path" here. This item
    selects the mode and binds that scenario; the walk itself is 0007's.
  - |
    2026-11-09, spec-author: decision 0010 is extended to OQ-2 on
    spec-reviewer's § 12 finding for this item. The item proceeds with
    OQ-2 open; a git exiting other than 0 inside a work tree gives the
    walk, as built, and no claim or test pins it. `out_of_scope` says so.
    The claims, the criteria and the scope are unchanged.

