summary: |
  The input contract both discovery modes share: each layout (name and glob),
  the exclusion list, and the item, epic and companion shapes come from the
  manifest, and the default manifest reproduces today's literals. Every other
  Discovery item reads what this one declares, so it goes first. Its keys
  load and validate through 0011 (0001-F5), and 0019 validates the exclusion
  list it declares.

acceptance_criteria:
  - "B-001 — layouts from the manifest; a third layout needs no code change"
  - "B-002 — exclusions from the manifest; bare name vs leading `/`"
  - "B-003 — item, epic and companion shapes from the manifest"
  - "B-009 — summary and report name a layout by its manifest name"
  - "B-001, amended by decision 0008 — the default layouts are named `epics` and `features`"
  - "B-003, amended by decision 0008 — the item, epic and companion shapes are each a list"
  - "B-012 — a file matching any entry of a list is discovered"
  - "`0001-F5` B-041 — an empty item, epic or companion list is rejected, exit 3"
  - "§ 9 carries a row naming a test for each id above."

decisions:
  - |
    2026-10-09, spec-author recording the repository owner's answer to OQ-4:
    the five flat top-level keys `layouts`, `exclusions`, `taskFiles`,
    `epicFiles` and `companionFiles`, their defaults and the glob dialect
    are ratified as § 7 proposed (decision 0004; C-6, C-7).
    Rejected: one nested `discovery` object; different names.
  - |
    2026-10-09, spec-author recording the repository owner's answer to OQ-5:
    this item lands before 0006, and until 0006 SPEC011 selects its layout
    by the name `legacy` (decision 0005).
    Rejected: landing 0005 and 0006 in one pull request.
  - |
    2026-10-09, spec-author recording the repository owner's answer to OQ-6:
    `SpecCheckReport.MigrationSummary` is removed with the assertions on its
    text (decision 0006).
    Rejected: generalising it over the manifest's layouts; keeping it.
  - |
    2026-10-09, spec-author recording the repository owner's answer to OQ-11:
    README.md's default-manifest block omits the five discovery keys, its
    table of configurable keys gains them with no layout named, and item
    0119's criterion is amended to that (decision 0007).
    Rejected: showing `legacy` in README.md; dropping `legacy` from the
    default manifest.
  - |
    2026-10-09, spec-author recording the repository owner's review of pull
    request #78 (decision 0008). Comment: "Can we coin these concepts
    `epics` and `features`?"; option chosen: "epics / features" - the
    layout `legacy` is renamed `epics` and `coLocated` is renamed
    `features`. Comment: "named `companionFiles` but it's not an array.";
    option chosen: "All three become arrays (Recommended)" - `taskFiles`,
    `epicFiles` and `companionFiles` each take a list of globs, a file
    matching any entry counts, and an empty list is rejected with exit 3.
    Decisions 0004 and 0005 are amended in part; decision 0007 stands.
    Rejected: keeping `legacy` and `coLocated`; keeping the three keys as
    single globs.

