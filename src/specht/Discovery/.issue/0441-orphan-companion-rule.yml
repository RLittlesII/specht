summary: |
  A file a `companionFiles` entry matches, in a directory the directory
  part of a layout glob matches and beside no specification of any
  layout, is reported `SPEC2003` at warning, at line `0`; `SPEC024` is
  its working name (decision 0013).

  The rule enters schema `0.4.0` (OQ-22, decision 0012), which item
  0436 cut and no tag carries: `0.2.0` to `0.3.1` are published without
  it and frozen (`0001-F7` C-1). The id is added to `0.4.0` in place,
  with its rule page and a relock, while no published package carries
  it (`0001-F7` C-17, decision 0014).

  The companion globs and the layouts are read from the manifest
  already (B-001, B-003; item 0005, done). On this repository's tree,
  pinned `0.4.0`, the check reports two `SPEC2003` warnings on
  2026-11-14: the `epics` layout's directory part is `epics/**`, and
  `epics/0201-spec-code-analysis/spikes/0236/reqnroll/alpha.feature`
  and `epics/0201-spec-code-analysis/spikes/0236/reqnroll-beta/beta.feature`
  sit there beside no `spec.md`. No `.feature` file sits in a `.spec/`
  directory without a `README.md`.

  Risk 2: discovery already finds the companions and the
  specifications; the rule compares the two sets, and adds one rule id
  to an unpublished version.

