summary: |
  As the maintainer of a repository with a large tree or its own layout, I
  want discovery to read its layouts, exclusions and file shapes from the
  manifest and to ask git inside a work tree, so that an ignored or excluded
  tree is never opened and a new layout needs no fork.

  The dependency on the manifest (0001-F5) is the edge 0005 -> 0011, and
  through it on the engine copy (0001-F1): 0011 -> 0021.

acceptance_criteria:
  - "B-001 — layouts from the manifest (0005)"
  - "B-002 — exclusions from the manifest (0005)"
  - "B-003 — item, epic and companion shapes from the manifest (0005)"
  - "B-004 — SPEC011 path identity per layout (0006)"
  - "B-005 — git mode never opens an ignored directory (0008)"
  - "B-006 — walk mode never enters an excluded directory (0007)"
  - "B-007 — both modes yield the same set (0009)"
  - "B-008 — ordinal root-relative order (0009)"
  - "B-009 — layout named by its manifest name (0005)"
  - "B-010 — exclusions as git exclude pathspecs (0008)"
  - "B-011 — linked directory not followed, either mode (0009)"
  - "§ 9 carries a row naming a test for each id above."

decisions:
  - |
    2026-10-08, Claude at the owner's request: sliced by discovery input and
    discovery mode — manifest inputs, path identity, walk, git, then parity —
    so the two modes are built against one input contract and proven equal
    last. Rejected: one item per claim, which would split B-005 from B-010
    and B-007 from B-008 although each pair is one piece of code and one
    proof.

