summary: |
  As the agent repairing or migrating a specification, I want one JSON
  report with a published schema in which every violation carries what the
  rule expected, and `--explain` for a rule's full text, so that I repair a
  document from the report alone (Must-6).

  Reaches the engine through 0034 -> 0021 and the command through 0035,
  0036 and 0040 -> 0026. The document's schema version and source fields
  (B-005) are defined here and filled by 0001-F7: 0042 and 0043 -> 0034.
  OQ-1 and OQ-2 were resolved by the owner on 2026-10-08: an unknown
  `--explain` id exits 4 (0001-F2 decision 0003), and no usable manifest
  fails as the check does (B-029), so 0040 is unblocked.

