summary: |
  `--report <path>` writes the document to that path, creating directories
  and replacing an existing file (decision 0002), as the one write a check
  makes (C-7), while stdout keeps the line stream. Also carries the claims
  that span both options - identical documents and an unchanged exit code.

  Shaped 2026-11-14 on ADR-0026 and item 0167 (decision of that date):
  `CheckCommand` takes `SpechtReportStore` beside the
  `SpechtReportDocumentMapper` and `SpechtReportSerializer` it takes for
  `--json`, and given `--report` writes
  `store.Save(serializer.Serialize(mapper.Map(report)), path)`. No command
  or handler type, and no dispatch.

  Superseded: the reshape of 2026-10-11 on ADR-0010, a `SaveReport.Command`
  handler dispatched through `ICqrs`. ADR-0026 supersedes ADR-0010's
  mediator clauses; the decision of 2026-10-11 stays as the record.

acceptance_criteria:
  - "B-003 — `--json` and `--report` documents identical"
  - "B-004 — exit code unchanged under either option"
  - "B-022 — document written to the path"
  - "B-023 — missing directories created"
  - "B-024 — existing file replaced"
  - "B-025 — stdout keeps the lines and summary"
  - "0001-F2 B-012's report exemption, with C-7 — the file `--report` names is the only write under the root (0001-F2 decision 0005)"
  - "§ 9 carries a row naming a test for each id above."
  - "ADR-0026 and item 0167, as shaped 2026-11-14: `CheckCommand` writes the document through `SpechtReportStore.Save`, the only type on the path that holds an `IFileSystem`; no other code in `src/tool` writes a report."
  - "As shaped 2026-11-14: the bytes B-003 compares come from the one `SpechtReportDocumentMapper` and the one `SpechtReportSerializer` `CheckCommand` takes, shared with `--json`."

decisions:
  - |
    2026-10-11, spec-author: reshaped on ADR-0010, accepted by the
    repository owner the same day (item 0154), whose § "Items reshaped"
    makes this item "`--report` and a `SaveReport.Command` handler over
    `SpecReportStore`" and makes it depend on stage 7. `depends_on` gains
    0167. It stays a task of `0001-F3` with its six claims; no claim is
    added or changed, and what the document holds and where it is written
    are as the specification says. Whether the handler returns a value is
    the architecture pass's: cqrsz's command returns one, and ADR-0010
    writes `ICommand<T>`.
  - |
    2026-11-08, repository owner, recorded by spec-author: asked whether to
    accept item 0167's rescoping as written or defer it, the owner selected
    the option labelled "Move both to 0.7.0", worded by the coordinator as
    not deciding now, with 0167 and this item leaving the 0.6.0 finish line
    and 0167 staying `blocked`. Not selected: "Accept as written", which
    would have made 0167 ready and this item follow it. Both ids move to
    0.7.0 in `.issue/.goal`. 0167's rescoping is neither accepted nor
    rejected, and its `--report` row stays open for the owner. Also, by
    spec-author: the `depends_on` comment no longer names the mediator,
    which ADR-0026 supersedes; `SpecReportStore` is still 0167's.
  - |
    2026-11-14, spec-author, a role judgement and not the repository
    owner's: reshaped on ADR-0026, which supersedes ADR-0010's mediator
    clauses and keeps direct calls in the hosts, and on item 0167's split
    of the runner's report write into three types, whose decision of
    2026-10-31, accepted by the owner on 2026-11-13, left this item's shape
    to this item. `CheckCommand` takes `SpechtReportStore` by constructor,
    beside the `SpechtReportDocumentMapper` and `SpechtReportSerializer` it
    takes for `--json` (0167, decision of 2026-11-13, item 3), and given
    `--report <path>` writes
    `store.Save(serializer.Serialize(mapper.Map(report)), path)` with that
    same mapper and serializer. No `SaveReport` command or handler type,
    and no dispatch. The command calls the engine and writes its output,
    as it does for `--json`, so `0001-F2` C-4 holds. Criteria 9 and 10 are
    rewritten in place to this shape and keep their numbers; the summary
    takes the `Specht` prefix item 0100 gave the types, and `Specht.Cqrs`,
    which ADR-0026 removed from 0167, leaves `out_of_scope`. The six claims
    are unchanged, and no claim, constraint or scenario of `0001-F3` or
    `0001-F2` changes. `0001-F3` OQ-8, what `--report` does when a run
    exits `2` or `3`, stays open and is not resolved here: in this shape
    the write follows a check that returned a report, so such a run writes
    nothing and leaves a file at the path as it was, which is OQ-8's
    reading (a), not its proposed default (b). Status `ready`: 0034, 0026
    and 0035 are done; 0167's pull request is open, and this item's branch
    stacks on it.

