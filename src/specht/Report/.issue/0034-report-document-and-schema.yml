summary: |
  The document's shape, written once as docs/schema/report.schema.json (A-1,
  C-1), and the engine producing it: the summary counts, the violations with
  an `expected` member, no timestamp, every path relative, and a test that a
  produced document validates. Each rule family's `expected` content is
  0037-0039. F2's summary (0028) prints the counts defined here. This item
  defines the schema version and source fields in B-005; 0001-F7 fills them
  with their selected values (0042, 0043), which wait on this, not the
  reverse. Until then they read version 1 from the on-disk files.

