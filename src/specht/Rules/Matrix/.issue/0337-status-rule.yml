summary: |
  SPEC033 reports, at its § 9 row, a status the tree does not bear out: a
  covered row whose scenario, named tests or at least one test does not
  resolve, a partial row with nothing resolved, a missing row whose tests
  all resolve, and a status that is none of the six markers. With no
  `tests` key it resolves no test name; it never reports a row SPEC023
  reports.

  Waits on 0321, which cuts schema 0.3.0 (decision 0003). This item adds
  SPEC033 to 0.3.0's vocabulary with its rule page (0001-F3 B-031) and
  relocks 0.3.0 by 0001-F7 decision 0014's procedure (0001-F7 C-17), in
  the pull request that builds the rule. It waits on 0334, because a
  covered row whose Test cell holds no inline code is reported by both
  SPEC032 and SPEC033 (B-006, B-013); on 0335, because a scenario
  resolves by title as well as tag under `matrix.scenarioTitles` (A-1);
  and on 0336, because B-012 is SPEC033's silence on a row SPEC023
  reports.

  Risk 4: six claims over six markers (C-5); it reads every other rule's
  answer from the one resolver (C-3) and must agree with SPEC032 and
  SPEC023 on the rows they share; the no-tests case judges a covered row
  by its scenario and a named test (B-016); and the relock is allowed
  only while no published package embeds 0.3.0 (OQ-4).

