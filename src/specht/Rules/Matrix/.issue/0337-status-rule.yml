summary: |
  SPEC4010 reports, at its § 9 row, a status the tree does not bear out: a
  covered row whose scenario, named tests or at least one test does not
  resolve, a partial row with nothing resolved, a missing row whose tests
  all resolve, and a status that is none of the six markers. With no
  `tests` key it resolves no test name; it never reports a row SPEC4008
  reports.

  Waits on 0436 (`0001-F5`), which cuts schema 0.4.0 (decision 0005).
  Schema 0.3.0 was published without SPEC4010 by specht.tool
  0.4.2-preview and is frozen (`0001-F7` C-1). This item adds SPEC4010
  to 0.4.0's vocabulary with its rule page (0001-F3 B-031) and relocks
  0.4.0 by 0001-F7 decision 0014's procedure (0001-F7 C-17), in the pull
  request that builds the rule. It waits on 0334, because a
  covered row whose Test cell holds no inline code is reported by both
  SPEC4009 and SPEC4010 (B-006, B-013); on 0335, because a scenario
  resolves by title as well as tag under `matrix.scenarioTitles` (A-1);
  and on 0336, because B-012 is SPEC4010's silence on a row SPEC4008
  reports.

  Risk 4: six claims over six markers (C-5); it reads every other rule's
  answer from the one resolver (C-3) and must agree with SPEC4009 and
  SPEC4008 on the rows they share; the no-tests case judges a covered row
  by its scenario and a named test (B-016); and the relock is allowed
  only while no published package embeds 0.4.0 (decision 0005).

