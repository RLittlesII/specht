summary: |
  As the reviewer reading a § 9 row, I want its scenario, test names,
  status and waiver held against the companion scenarios and the declared
  test files, so that a row the tree does not bear out is reported at its
  line.

  Risk 4: four rules join schema 0.3.0, relocked as each lands while no
  published package embeds it, and two are in the published 0.2.0 and
  0.2.1 (A-4; decision 0003; 0001-F7 C-17); one resolver serves these rules and the
  trace command (C-3; 0001-F13 C-1), so its shape is fixed for two
  Features; two rules may report one row, and B-006, B-012 and B-013 say
  exactly when; each rule runs on this repository's own tree in the pull
  request that builds it, which fixes every row it then reports there
  (decision 0002 call 3), because 0339 (`0055-F1`) pins this tree to
  0.3.0 first and its manifest already declares `tests` and `owners`;
  and a pin below 0.3.0 must give the report the tree gets without the
  four rules (B-021).

  The first child is 0225, the resolver; the second is 0227, SPEC034
  and SPEC035 (B-018 to B-020, after 0223 for the off level). The other
  rule items follow, cut later under this item: SPEC032 (B-002, B-006,
  B-007), SPEC022 (B-008 to B-010), SPEC023 (B-011, B-012), SPEC033
  (B-013 to B-017) and the 0.1.0 guard (B-021). Each rule item adds its
  own id to the 0.2.0 vocabulary with its rule page and a relock, so
  0001-F7 B-014 holds at every commit (the owner, 2026-10-15); 0001-F6's
  SPEC014 and SPEC024 and 0101-F9's SPEC015 enter with those Features'
  items. The trace command's items (0001-F13) follow too, and depend on
  0225.

  Re-cut 2026-11-01 (decision 0003): 0.2.0 shipped before the four
  remaining rules were built, so they join schema 0.3.0, which 0321
  (0001-F7) cuts first. 0334 is SPEC032 (B-002, B-006, B-007, binding
  the scenarios of B-001 and B-003 to B-005); 0335 SPEC022 (B-008 to
  B-010); 0336 SPEC023 (B-011); 0337 SPEC033 (B-012 to B-017), after
  the other three; and 0338 the guard below 0.3.0 (B-021), after all
  four. Each rule item waits on 0321 and adds its own id to 0.3.0's
  vocabulary with its rule page and a relock, so 0001-F7 B-014 holds at
  every commit. 0334 and 0336 also wait on 0339 (`0055-F1`), which pins
  this repository to 0.3.0 in 0321's pull request; 0337 and 0338 follow
  through 0334. 0335 does not wait on it, since this manifest sets no
  `matrix.scenarioTitles` and SPEC022 is silent here (B-010).

