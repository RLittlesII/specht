summary: |
  As the reviewer reading a § 9 row, I want its scenario, test names,
  status and waiver held against the companion scenarios and the declared
  test files, so that a row the tree does not bear out is reported at its
  line.

  Risk 4: six rules join schema 0.2.0, which is relocked when they land
  (A-4; 0001-F7 decision 0014); one resolver serves these rules and the
  trace command (C-3; 0001-F13 C-1), so its shape is fixed for two
  Features; two rules may report one row, and B-006, B-012 and B-013 say
  exactly when; this repository's own manifest declares `tests` and
  `owners` in the pull request that delivers the rules, which fixes every
  row they then report (decision 0002 call 3); and a 0.1.0 pin must give
  a byte-identical report (B-021).

  The first child is 0225, the resolver. The rule items follow, cut
  later under this item: SPEC032 (B-002, B-006, B-007), SPEC022 (B-008
  to B-010), SPEC023 (B-011, B-012), SPEC033 (B-013 to B-017), SPEC034
  and SPEC035 (B-018 to B-020, after 0223 for the off level), and the
  0.1.0 guard (B-021). Every rule item depends on 0226, which puts its
  id in the 0.2.0 vocabulary (0001-F7 B-115). The trace command's items
  (0001-F13) follow too, and depend on 0225.

