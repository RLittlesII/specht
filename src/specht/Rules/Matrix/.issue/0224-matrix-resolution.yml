decisions:
  - |
    2026-10-15, spec-author: value 3 follows the specification's
    priority: med, as item 0082 took value 3 from its specification's
    priority: med and item 0010 value 4 from priority: high (commit
    621f3e08). The trace command's value of 4 is that Feature's own score
    and is not borrowed; its items gate on 0225 and carry their rank to it
    through the closure. Risk 4 on the basis in the summary.
  - |
    2026-10-15, spec-author: the resolver is cut first, alone, because the
    trace command needs it and not the rules (0001-F13 C-1), and because
    it needs nothing outside the tree: every rule item waits on the 0.2.0
    vocabulary (0001-F7 B-115, item 0226), and the resolver does not. Rejected: the
    resolver inside the SPEC032 item, which would hold the trace command
    behind the vocabulary.

