decisions:
  - |
    2026-10-15, spec-author: value 3 follows the specification's
    priority: med, as item 0082 took value 3 from its specification's
    priority: med and item 0010 value 4 from priority: high (commit
    621f3e08). The trace command's value of 4 is that Feature's own score
    and is not borrowed; its items gate on 0225 and carry their rank to it
    through the closure. Risk 4 on the basis in the summary.
  - |
    2026-10-15, spec-author: the resolver is cut first, alone, because the
    trace command needs it and not the rules (0001-F13 C-1), and because
    it adds no rule id: every rule item adds its own id to the 0.2.0
    vocabulary, and the resolver does not. Rejected: the resolver inside
    the SPEC032 item, which would hold the trace command behind that
    rule.

  - |
    2026-10-15, spec-author, re-cut on the owner's ruling that each id
    enters the 0.2.0 vocabulary with its own rule: 0226, which added the
    nine ids ahead of their rules and left 0001-F7 B-014 false, was
    withdrawn before it merged and its number is not reused. 0227 is cut
    now because 0223 is split around it (0001-F5 B-061); the other rule
    items are not forced and stay uncut. Each rule item cites 0001-F7
    B-115 for the ids it adds, and the one that adds the last binds
    @B-115.

