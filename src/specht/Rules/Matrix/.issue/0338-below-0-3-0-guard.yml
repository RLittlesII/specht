summary: |
  Proves that under a pin of 0.1.0, 0.2.0 or 0.2.1 none of SPEC4007,
  SPEC4008, SPEC4009 and SPEC4010 runs, that under 0.3.0 or 0.3.1
  neither SPEC4008 nor SPEC4010 runs, that each report is byte-identical
  to the one the tool gives the tree without the rules that do not run,
  and that a raised waiver rule still runs under 0.2.0 (decisions 0003
  and 0005). It binds B-021's outline rows for 0.2.0 and 0.2.1, its
  outline over 0.3.0 and 0.3.1, and its boundary scenario; the 0.1.0 row
  is bound today.

  Waits on the four rule items and on 0436, which cuts 0.4.0: the guard
  proves something only once each rule exists and could run. SPEC4007
  and SPEC4009 are in 0.3.0 and 0.3.1, and SPEC4008 and SPEC4010 enter
  0.4.0 alone, so this item adds tests and no rule.

  Risk 2: the vocabulary per version is built and fixed for the published
  versions (0001-F7 C-1, B-015); the risk is a rule item that leaks its id
  into a 0.2.x vocabulary, which this item would find.

acceptance_criteria:
  - "B-021 — below 0.3.0 the four rules do not run, and at 0.3.0 and 0.3.1 SPEC4008 and SPEC4010 do not; each report byte-identical"
  - "§ 9 carries a row naming a test for each id above."

