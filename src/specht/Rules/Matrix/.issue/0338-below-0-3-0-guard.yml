summary: |
  Proves that under a pin of 0.1.0, 0.2.0 or 0.2.1 none of SPEC022,
  SPEC023, SPEC032 and SPEC033 runs, and that the report is
  byte-identical to the one the tool gives the tree without them, and
  that a raised waiver rule still runs under 0.2.0 (decision 0003). It
  binds B-021's outline rows for 0.2.0 and 0.2.1 and its boundary
  scenario; the 0.1.0 row is bound today.

  Waits on the four rule items: the guard proves something only once
  each rule exists and could run. Each rule item adds its id to 0.3.0
  alone, so this item adds tests and no rule.

  Risk 2: the vocabulary per version is built and fixed for the published
  versions (0001-F7 C-1, B-015); the risk is a rule item that leaks its id
  into a 0.2.x vocabulary, which this item would find.

