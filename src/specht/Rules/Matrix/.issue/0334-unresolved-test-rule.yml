summary: |
  SPEC032 reports, at its § 9 row, a test name in a Test cell that no
  declared test file holds, and a Test cell that names no test in inline
  code; with no `tests` key it reports nothing. It reads each row through
  0225's resolver (C-3) and adds no second reading of a cell or a test
  file.

  It binds the scenarios of B-001 and B-003 to B-005, which observe the
  resolver through this rule (0225's decision of 2026-10-15), and the
  @B-001 scenario under 0.2.0, which observes it through the waiver rule,
  so those four § 9 rows can leave Partial. Binding the @B-001 scenario
  under 0.2.0 needs nothing of 0321 or 0339; whoever takes this item may
  bind it first, and it gets no item of its own.

  Waits on 0321, which cuts schema 0.3.0 (decision 0003). This item adds
  SPEC032 to 0.3.0's vocabulary with its rule page (0001-F3 B-031) and
  relocks 0.3.0 by 0001-F7 decision 0014's procedure (0001-F7 C-17), in
  the pull request that builds the rule, so 0001-F7 B-014 holds at every
  commit. Waits on 0225 for the resolver, done. Waits on 0339
  (`0055-F1`), which pins this repository to 0.3.0, so SPEC032 runs on
  this tree in this pull request, which fixes every row it reports here
  (decision 0002 call 3; decision 0003, Addendum).

  Risk 3: the first of the four rules to join 0.3.0 after its cut, so
  0.3.0's vocabulary grows while 0.1.0, 0.2.0 and 0.2.1 stay as published
  (0001-F7 C-1); the waived, withdrawn and superseded rows are exempt
  (B-002, B-006); and a relock is allowed only while no published package
  embeds 0.3.0 (OQ-4).

