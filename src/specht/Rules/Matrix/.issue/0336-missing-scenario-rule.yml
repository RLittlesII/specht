summary: |
  SPEC4008 reports, at its § 9 row, a live claim whose tag no companion
  scenario carries, unless the row's Status is the missing or the waived
  marker. It reads the claim-tag resolution 0227 added to 0225's
  resolver (C-3).

  Waits on 0436 (`0001-F5`), which cuts schema 0.4.0 (decision 0005).
  Schema 0.3.0 was published without SPEC4008 by specht.tool
  0.4.2-preview and is frozen (`0001-F7` C-1). This item adds SPEC4008
  to 0.4.0's vocabulary with its rule page (0001-F3 B-031) and relocks
  0.4.0 by 0001-F7 decision 0014's procedure (0001-F7 C-17), in the pull
  request that builds the rule. 0225 and 0227 are done. 0436 also moves
  this repository's pin to 0.4.0, so SPEC4008 runs on this tree in this
  pull request, which fixes every row it reports here (decision 0002
  call 3; decision 0005).

  Risk 2: the claim-tag answer it reads exists; what is new is the live
  claim (A-3) and the missing and waived exemptions, with the waived row
  left to SPEC4005 (B-018); the relock is allowed only while no published
  package embeds 0.4.0 (decision 0005).

