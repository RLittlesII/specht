summary: |
  The `claim` members the reader selects on: `claim.source`,
  `claim.files` with each entry's `glob`, `feature`, `epic` and
  `record`, and the tag lists, read from the manifest (C-4) as
  top-level keys the checker owns (C-7; ADR-0023). They join `0.4.0`'s
  manifest schema with a relock, which `0001-F7` C-17 allows while no
  published package carries `0.4.0`; `0.3.1` and earlier stay as
  published (`0001-F7` C-1).

  Risk 3: a member is optional, so a manifest without `claim.source`
  gives the verdicts it gives under `0.4.0` today (B-002), while an
  invalid set exits `3` before any rule runs (B-029), and a pin below
  `0.4.0` refuses the members as keys it does not define (B-028).

  Waits on 0436, which cuts `0.4.0`, the version it adds the members
  to (decision 0001), and on 0388, done. The epic grammar the identity
  follows (B-027) is `0001-F5`'s, built.

acceptance_criteria:
  - "B-002 — no `claim.source`, or `markdown`: no verdict changes, no `codeAnalysis` key read"
  - "B-027 — identity is epic and feature under an epic grammar, feature alone without; an `epic` without the grammar exits 3"
  - "B-028 — pinned below 0.4.0, 0.3.1 included: a `claim` member exits 3 as today; a passing tree passes"
  - "B-029 — `claim.files` absent, empty, or an entry without `glob` or `feature` under `gherkin`, or present beside another source: exit 3 naming the key"
  - "Every key read from the manifest, none under `codeAnalysis` (C-4, C-7)"
  - "The members join 0.4.0 with a relock while no published package carries it (`0001-F7` C-17, decision 0014); 0.1.0 to 0.3.1 unchanged (`0001-F7` C-1)"
  - "Under 0.4.0, a tree without `claim.source: gherkin` gets the verdicts it got before this item (B-002); `0001-F7` B-154 does not apply, since 0.3.1 and 0.4.0 are not patch neighbours (`0001-F7` OQ-78)"
  - "§ 9 carries a row naming a test for each id above."

