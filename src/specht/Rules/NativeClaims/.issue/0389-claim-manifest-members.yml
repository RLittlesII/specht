summary: |
  The `claim` members the reader selects on: `claim.source`,
  `claim.files` with each entry's `glob`, `feature`, `epic` and
  `record`, and the tag lists, read from the manifest (C-4) as
  top-level keys the checker owns (C-7; ADR-0023). They join `0.4.0`'s
  manifest schema with a relock, which `0001-F7` C-17 allows while no
  published package carries `0.4.0`; `0.3.1` and earlier stay as
  published (`0001-F7` C-1).

  Risk 3: a member is optional, so a manifest without `claim.source`
  gives the verdicts it gives under `0.4.0` today (B-002), while an
  invalid set exits `3` before any rule runs (B-029), and a pin below
  `0.4.0` leaves the members unread, as today (B-028).

  Waits on 0436, which cuts `0.4.0`, the version it adds the members
  to (decision 0001), and on 0388, done. The epic grammar the identity
  follows (B-027) is `0001-F5`'s, built.

acceptance_criteria:
  - "B-002 — no `claim.source`, or `markdown`, and no `claim.files`: no verdict changes, no `codeAnalysis` key read"
  - "B-027 — identity is epic and feature under an epic grammar, feature alone without; an entry without an `epic` under the grammar, or with one without it, exits 3"
  - "B-028 — pinned below 0.4.0, 0.3.1 included: a `claim` member goes unread as today, and the output is the same with it as without it (decision 0002)"
  - "B-029 — `claim.files` absent, empty, or an entry without `glob` or `feature` under `gherkin`, or present beside another source, an omitted one included: exit 3 naming the key"
  - "B-031 — pinned to 0.4.0 or later, a `claim.source` other than the text `markdown` or `gherkin`: exit 3 naming `claim.source` (decision 0003)"
  - "Every key read from the manifest, none under `codeAnalysis` (C-4, C-7)"
  - "The members join 0.4.0 with a relock while no published package carries it (`0001-F7` C-17, decision 0014); 0.1.0 to 0.3.1 unchanged (`0001-F7` C-1)"
  - "Under 0.4.0, a tree without `claim.source: gherkin` gets the verdicts it got before this item (B-002); `0001-F7` B-154 does not apply, since 0.3.1 and 0.4.0 are not patch neighbours (`0001-F7` OQ-78)"
  - "§ 9 carries a row naming a test for each id above."

decisions:
  - |
    2026-11-06, spec-author: cut on the repository owner's rulings of
    2026-11-06 (OQ-2 to OQ-9 accepted; OQ-5 "0.3.1 patch, amend C-11",
    `0001-F7` decision 0022), as proposed. Value omitted, inheriting
    0387's. Not a prerequisite: 0352 (`0001-F5`), whose Feature claim
    prefixes exclude standalone Gherkin (`0001-F5` § 5 row 24).
  - |
    2026-11-12, the repository owner, selecting "Fold into 0.4.0" over
    "0.3.2 patch": the members join schema 0.4.0, and this item waits on
    0436, which cuts it (decision 0001). spec-author's reading, not the
    owner's: `0.3.1` has gone out in NuGet packages, so `0001-F7` C-1
    and C-17 forbid the relock this item planned; `0.4.0` is a
    `0.minor` step, which `0001-F7` C-11 lets add the members, and
    `0001-F7` B-154's `0.3.0` and `0.3.1` comparison leaves the
    acceptance criteria. Status stays in-progress.
  - |
    2026-11-13, the repository owner, selecting "Ignore below 0.4.0":
    under a pin below 0.4.0 the new `claim` members go unread, as today,
    and change no verdict (decision 0002). spec-author's reading, not the
    owner's: the B-028 criterion said such a pin refuses a member with
    exit 3 as today, but the parser reads only `claim.tag` and
    `claim.tagIgnoreCase` at every pin, and refusing the member would
    change a published pin's verdict (`0001-F7` C-1, C-4). The criterion
    is amended. Status stays in-progress.
  - |
    2026-11-13, the repository owner, selecting "Exit 3": a
    `claim.source` other than `markdown` or `gherkin` is an invalid
    manifest (decision 0003). spec-author's reading, not the owner's:
    B-031 states it under a pin of 0.4.0 or later, naming
    `claim.source`, case-exact and for a value that is not text, as
    `schemaSource` and `pinPolicy` refuse theirs (`0001-F7` B-056);
    the item takes B-031. Status stays in-progress.
  - |
    2026-11-13, spec-author's reading on test-writer's questions, not
    an owner answer: B-027's "both required" makes an entry without
    an `epic` under the epic grammar exit 3, and B-029's "any other
    `claim.source`" includes an omitted one, which reads as `markdown`
    (OQ-9); B-002 is narrowed to a manifest with no `claim.files`.
    The B-002, B-027 and B-029 criteria are amended.

