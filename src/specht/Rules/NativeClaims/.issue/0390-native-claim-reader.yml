summary: |
  The reader: for each claim file set, the `.feature` files its glob
  matches outside `exclusions`, read as text through `IFileSystem`
  (C-2), and a claim for each claim tag on a Feature, Rule, Scenario or
  Scenario Outline, with its lifecycle from the manifest's tag lists.
  Its claims enter the one catalogue the claim rules, `0001-F12` and
  `0001-F13` read (C-5), in place of the claims table for that Feature.

  Risk 4: a tag has one reading, the companion reader's form and
  grammar (C-1; `0001-F5` decision 0013), and the analyzer's reader
  must give the same answer (A-3; § 5 row 2); the catalogue record is
  fixed for three Features; and order is ordinal paths, document order
  and line order, so the output is byte-identical (B-030).

  Waits on 0389, for the members it reads.

acceptance_criteria:
  - "B-001 — under 0.4.0 and `gherkin`, a set's claims come from its .feature files; no claims table read"
  - "B-004 — a claim tag declares one claim, its id as authored, at the keyword line"
  - "B-005 — a tag failing the form or grammar declares nothing and draws nothing"
  - "B-006 — a Scenario Outline declares one claim, located at the outline"
  - "B-007 — a Rule declares once; its scenarios inherit and do not redeclare"
  - "B-011 — reordering or retitling scenarios keeps the catalogue"
  - "B-012 — withdrawn and superseded tags give Withdrawn and Superseded; none gives Active"
  - "B-013 — a planned tag keeps the claim and marks the scenario or rows planned"
  - "B-025 — the scenarios carrying a claim, as `0001-F12` A-1 and `0001-F13` B-001 count them"
  - "B-030 — byte-identical output for the same tree"
  - "One tag reading (C-1); text only, relative paths (C-2); every tag list from the manifest (C-4); one catalogue (C-5)"
  - "Under 0.4.0, a tree without `claim.source: gherkin` gets the verdicts it got before this item (B-002); `0001-F7` B-154 does not apply, since 0.3.1 and 0.4.0 are not patch neighbours (`0001-F7` OQ-78)"
  - "§ 9 carries a row naming a test for each id above."

