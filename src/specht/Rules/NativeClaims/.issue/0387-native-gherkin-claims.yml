summary: |
  As a maintainer whose repository keeps its claims as tags in .feature
  files and has no specification document per Feature, I want the check
  to build each Feature's claims from those tags when the manifest
  selects `claim.source: gherkin`, so that the same rules hold my tree
  without a Markdown claims table copied from the Gherkin.

  Risk 4: a second claim source feeds one catalogue that the claim rules,
  `0001-F12` and `0001-F13` all read (C-5), so its record shape is fixed
  for three Features; the tag reading must give the analyzer's answer
  (C-1; A-3); three new rules and the `claim` members enter schema
  `0.3.1`, a patch, so every verdict they add is reached only under
  `claim.source: gherkin` and a tree without it gets the report it gets
  under `0.3.0` (C-3; `0001-F7` C-11, B-154, decision 0022).

  Every child waits, through 0389, on 0388 (`0001-F7`), which cuts
  schema `0.3.1`. 0389 adds the `claim` members; 0390 the reader and
  the claim file sets; 0391 a set's record, identity and report entry;
  0392 the existing rules on a native Feature; 0393 to 0395 the three
  new rules; 0396, blocked, the claims that need `SPEC024`, the open
  `0001-F12` rules and the trace command.

