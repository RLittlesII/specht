summary: |
  A native Feature as the rest of the check sees it: its frontmatter,
  lifecycle and edges from the set's `record`, held to the Feature
  schema by `SPEC1001` to `SPEC1003`, or current with no edge when the
  set has none (B-003); its identity declared once across sets and
  layouts, `SPEC3002` otherwise (B-017); and its place in the summary
  and the report (B-026).

  Risk 3: a record is a specification document missing its claims
  table, so discovery must not also read it as a layout's Feature, and
  the report path of a record-less Feature is its first claim file in
  ordinal order.

  Waits on 0390, for the sets.

acceptance_criteria:
  - "B-003 — a record supplies frontmatter, lifecycle and edges, held by SPEC1001 to SPEC1003; none means current, no edge"
  - "B-017 — one identity in two sets, or a set and a layout's specification: SPEC3002 at each, a set at its Feature's path, line 0"
  - "B-026 — counted in one `claims` entry after the manifest's layouts, beside any layout of that name; its violations carry its record, or its first claim file"
  - "B-036 — a set with no record and no claim file is no Feature: not counted, its identity compared with none"
  - "B-037 — a record's own `id` or `epic` does not change the set's identity"
  - "B-032 — a record's `claim_prefix` does not choose the grammar: the tags are read with the tree's claim grammar, so a tag only the prefix admits declares nothing"
  - "Relative paths only (C-2); no file written (C-6)"
  - "Under 0.4.0, a tree without `claim.source: gherkin` gets the verdicts it got before this item (B-002); `0001-F7` B-154 does not apply, since 0.3.1 and 0.4.0 are not patch neighbours (`0001-F7` OQ-78)"
  - "§ 9 carries a row naming a test for each id above."

