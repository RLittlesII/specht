summary: |
  One rule for a claim file or set the reader cannot take claims from:
  a `# language:` other than `en` (B-014), no `Feature:` line (B-015),
  a glob matching no file (B-016), a file two sets match (B-018), and a
  Feature-level tag naming another identity under
  `claim.scopes.featureTag` (B-019). Each records no claim from what it
  reports. A set's `record` that names no file, cannot be read or leads
  outside the root is reported at its path (B-033), an absolute one at
  the manifest (B-034), and either leaves the set record-less (B-035).

  Risk 3: five conditions, two of them across sets, and B-016 reports
  at a glob as written, a path that names no file.

  Waits on 0390, for the sets and their files, and on 0391, for a set's
  record.

acceptance_criteria:
  - "B-014 — `# language:` other than `en`: reported at that line, no claim from the file"
  - "B-015 — no `Feature:` line: reported at line 0, no claim from the file"
  - "B-016 — a set's glob matches no file: reported at line 0, path the glob as written"
  - "B-018 — one file matched by two sets: reported at that file, line 0, its claims under neither"
  - "B-019 — under `claim.scopes.featureTag`, a Feature-level tag naming another identity: reported at that tag's line"
  - "B-033 — a relative `record` naming no file, a file that cannot be read, or a path outside the root: reported at that path as written, line 0"
  - "B-034 — an absolute `record`: reported at `.specht/manifest.json`, line 0; no absolute path in any output (C-2)"
  - "B-035 — any of those records: the set read as one with no `record` (B-003, B-026)"
  - "Its id the next free one in its ADR-0029 group, on the owner's approval in this item's pull request; working name SPEC027 (OQ-5)"
  - "`0001-F7` B-014 — the id joins 0.4.0's vocabulary here, with its rule page (`0001-F3` B-031) and a relock while no published package carries 0.4.0 (`0001-F7` C-17, decision 0014); 0.1.0 to 0.3.1 unchanged (`0001-F7` C-1)"
  - "`0001-F7` B-066 — holds, 0.4.0's minor being greater than 0.3.1's; the id still reports only when `claim.source` is `gherkin` (C-3)"
  - "Under 0.4.0, a tree without `claim.source: gherkin` gets the verdicts it got before this item (B-002, C-3); `0001-F7` B-154 does not apply, since 0.3.1 and 0.4.0 are not patch neighbours (`0001-F7` OQ-78)"
  - "§ 9 carries a row naming a test for each id above."

