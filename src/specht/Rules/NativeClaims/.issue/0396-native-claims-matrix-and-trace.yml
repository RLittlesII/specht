  - "B-024 — no record or no matrix: no `0001-F12` rule and no SPEC4004 reports; the trace lists each claim as `none`"
  - "One catalogue, no second parse of a claim file in the trace (C-5)"
  - "`0001-F7` B-154 — same report under 0.3.0 and 0.3.1 for a tree without `claim.source: gherkin`"
  - "§ 9 carries a row naming a test for each id above."

