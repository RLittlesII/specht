summary: |
  Native claims under the rules and the command still to be built: a
  claim file is not a stray companion to `SPEC024` (B-022); a record's
  matrix holds one row per native claim, and the `0001-F12` rules
  resolve its rows against the set's claim files (B-023); and without a
  matrix nothing of `0001-F12` reports and `specht trace` lists each
  claim as `none` (B-024).

  Blocked: no item builds `SPEC024` (`0001-F6` B-013), a working name,
  or the trace command (`0001-F13`, approved, with no items cut), so no
  test of B-022 or of B-024's trace half can fail yet. When those items
  are cut, they join `depends_on`. It also waits on 0336 and 0337
  (`0001-F12`), open, which plan to add their rules to schema `0.3.0`,
  now published.

  Risk 3: three other Features' rules and a command read the
  catalogue, and each must see a native claim as the claim a § 3 row
  becomes (C-5).

