  - "B-002 — both layouts held to every rule; SPEC011 and SPEC004 legacy only"
  - "B-003 — identity survives a move"
  - "B-011 — same `epic` and `id` twice, reported once on each specification under that identity, each naming both paths"
  - "§ 9 carries a row naming a test for each id above."

