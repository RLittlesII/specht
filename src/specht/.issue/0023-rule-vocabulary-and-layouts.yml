summary: |
  Scenarios and tests, over synthetic trees, that the copied engine applies
  exactly the twenty-one rules, holds both layouts to them (SPEC011 and
  SPEC004 legacy only, decision 0001), takes a co-located specification's
  identity from its frontmatter, and reports a duplicate identity on each
  specification declaring it. Start from the 56 extracted tests (A-1); add
  only what they leave unproven. No engine change (C-9).

