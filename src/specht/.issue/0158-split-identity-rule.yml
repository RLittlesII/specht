    (.spec/adr/0027-structural-stages-proceed-on-a-no-regression-guard.md),
    accepted by the repository owner the same day, which lifts ADR-0014's
    benchmark gate for ADR-0010's remaining structural stages and puts a
    no-regression guard on each stage's pull request. The pause in the
    summary is replaced and a criterion for the guard is added. 0216 is
    done and stays in `depends_on` as the record of the evaluation.
    `depends_on` gains 0100, by the owner's order "ADR, then 0100, then
    splits"; 0100 also renames every engine type a split touches. Status
    `blocked` to `ready-for-implementation`, as cut: the design is ADR-0010's
    and 0100 is open.
  - |
    2026-11-01, implementer: `IdentityRule` is gone. `PathIdentityRule`
    (src/specht/Rules/PathIdentityRule.cs) reports SPEC011 and
    `DuplicateIdentityRule` (src/specht/Rules/DuplicateIdentityRule.cs)
    reports SPEC012, each with `ReportedIds` of its own id alone, registered
    by name in that order where `IdentityRule` was. Each is the old class's
    branch for its id, moved unchanged with its guards and its emission
    order; the private `DirectoryIdentity` helper moves with SPEC011, its
    only user, so the two share nothing. The two tests that constructed
    `IdentityRule` now construct the rule for the id each pins and keep
    their names, so no § 9 row needs re-pointing; the § 8 prose that names
    `IdentityRule` is test-writer's to update. Judged: a rule that throws is
    now isolated per id, so a fault in one identity check no longer discards
    the other id's findings or reports under SPEC011 for both; no tree a
    test checks reaches it, and fault isolation is out of scope. The
    ADR-0027 benchmark guard is run once for the batched pull request of
    0156 to 0163, not in this worktree.
