summary: |
  Paused by ADR-0014: benchmark evaluation 0216 must establish that the
  architecture benefit justifies its cost before this migration proceeds.

  ADR-0010 (accepted 2026-10-11,
  .spec/adr/0010-layered-engine-boundaries-with-io-at-the-edge-and-a-mediator.md),
  stage 3 (B) of "The order of work": the owner's decision 1, one rule per
  rule id. `ApprovalRule` (`src/specht/Rules/ApprovalRule.cs:21`) reports
  SPEC060 and SPEC061, and with one of them off and the other on the whole
  class still runs (ADR-0010 § "What the source shows"). This item splits
  it into two rules, each reporting its own id and no other.

  The evaluator is untouched. `ISpecRule` keeps `Id`, `ReportedIds` and
  `Evaluate`; each new rule's `ReportedIds` names its one id;
  `SpechtRunner.Evaluate` selects, filters and counts as it does today.
  Collapsing the interface is item 0164. `AddSpechtEngine()` registers each
  new rule by name, in ordinal order of its id, where it registers
  `ApprovalRule` today.

  What keeps the report byte-identical is ADR-0010 § "Why no structural
  stage changes a verdict": the rule id is the last sort key and the sort
  is stable, so each new rule emits its violations in the order the old
  class emitted that id, and keeps every guard the old class applied before
  it. The acceptance criteria name both.

  Depends on 0155, so each split is written once, against the model that
  item leaves.

  It restructures the code of `0001-F1` alone, so it sits beside that
  specification. The eight splits, 0156 to 0163, touch different rule
  classes and share two files:
  `src/specht/Composition/SpechtEngineServiceCollectionExtensions.cs` and
  `test/tests/Composition/SpechtEngineServiceCollectionExtensions.Unit.Tests.cs`.
  Type names and lines are the source's at commit `eb7c161`; once item 0100
  lands each type carries the prefix that item gives it.

acceptance_criteria:
  - "Split: `ApprovalRule` is gone and two rules stand in its place, one each for SPEC060 and SPEC061; each one's `ReportedIds` names its own id alone, and `AddSpechtEngine()` registers each by name in ordinal order of its id."
  - "Order kept: SPEC060 and SPEC061 each keep the Features' order and, within one, the row order of the table each reads (`src/specht/Rules/ApprovalRule.cs:40-54`, `:64-78`)."
  - "Guards kept: both rules read only the Features whose status is the manifest's approved marker (`:31-34`); SPEC060 skips a Feature with no matrix section (`:38`) and SPEC061 one with no sign-off section (`:59-62`), each whether the other id is on or off."
  - "Untouched: `ISpecRule`, `SpechtRunner.Evaluate` and `SpechtRunner.Order`, and every violation's file, line, identifier, message and severity."
  - "The composition tests still hold: every concrete rule the engine declares is registered exactly once, the rules resolve in ordinal order of their ids, and the reported ids are the twenty-one of the pinned vocabulary, each once (`test/tests/Composition/SpechtEngineServiceCollectionExtensions.Unit.Tests.cs`)."
  - "Not a refactor until re-pointed: `ApprovalRuleUnitTests` (`0001-F5` § 9 B-001, B-003) constructs `ApprovalRule`. Its tests are aimed at the rule that reports the id each pins, and `test-writer` re-points the rows in the same pull request if the class or a method they name is renamed."
  - "The golden report `test/tests/Engine/Baseline/engine-e7dba24.json` is unchanged, byte for byte, and the test that compares it is green unedited. The unit, integration and acceptance tiers pass, and the benchmark project `.performance/benchmarks` still compiles."
  - "No .feature change needed: refactor - `ApprovalRule` becomes two rules of one id each; every violation, its severity, the report's order and its counts are unchanged."
  - "Constraints preserved: 0001-F1 C-5, 0001-F1 C-9, 0001-F1 C-10, 0001-F5 C-1, 0001-F5 C-3, 0055-F1 C-6"

