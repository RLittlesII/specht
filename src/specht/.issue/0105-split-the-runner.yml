summary: |
  ADR-0001 (accepted 2026-10-08), stage B. SpecCheckRunner splits into
  Evaluate(SpecModel) - every rule, collect, sort, count - and Run(root),
  which loads and evaluates; both stay static. The sort is the order
  function 0103 exposes, not a second one. No ISpecModelLoader: ADR-0001
  takes one only if this split is refused. No verdict changes (C-9).
  Depends on 0104 for a model a test can build, and on 0103 for the order
  function. 0014's per-rule step lands in Evaluate, so 0014 waits on this.

