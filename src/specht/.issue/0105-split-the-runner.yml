  - "§ 9 carries a row naming a test for each id above."

decisions:
  - |
    2026-10-08, cut by spec-author on the owner's acceptance of ADR-0001
    and ADR-0003, one item per migration stage.
  - |
    2026-10-09, the owner, asked directly during this item's delivery;
    recorded by spec-author as ADR-0008. The rule set is Evaluate's second
    argument, Evaluate(SpecModel model, IEnumerable<ISpecRule> rules), still
    static, and Run passes the discovered rules. SpecSchemas keeps the
    SchemaVersion it selects, and Evaluate reads the vocabulary from
    model.Schemas. Rejected: a one-parameter Evaluate with a separate public
    counting function; deferring the fake-rule proof to 0107; a
    SchemaVersion parameter on Evaluate; leaving the filter in Run. What
    the SpecSchemas.Load overload without a version set carries is the
    implementer's to propose in 0001-F1 § 7.

