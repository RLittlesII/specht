summary: |
  ADR-0001 (accepted 2026-10-08), stage B, as ADR-0008 amends it.
  SpechtRunner splits into Evaluate(SpecModel, rules) - every rule
  given, collect, sort, count - and Run(root), which loads, passes the
  discovered rules and evaluates; both stay static. Evaluate reads the
  pinned version's rule vocabulary from the model (0001-F7 B-014). The sort is the order
  function 0103 exposes, not a second one. No ISpecModelLoader: ADR-0001
  takes one only if this split is refused. No verdict changes (C-9).
  Depends on 0104 for a model a test can build, and on 0103 for the order
  function. 0014's per-rule step lands in Evaluate, so 0014 waits on this.

