summary: |
  ADR-0027 lifted ADR-0014's benchmark gate on 2026-10-31: this stage
  proceeds without benefit evidence, and its pull request carries the
  no-regression guard.

  ADR-0010 (accepted 2026-10-11,
  .spec/adr/0010-layered-engine-boundaries-with-io-at-the-edge-and-a-mediator.md),
  stage 3 (B) of "The order of work": the owner's decision 1, one rule per
  rule id. `DependencyRule` (`src/specht/Rules/DependencyRule.cs:20`)
  reports SPEC050, SPEC051 and SPEC052, and with one of them off and
  another on the whole class still runs (ADR-0010 § "What the source
  shows"). This item splits it into three rules, each reporting its own id
  and no other.

  The evaluator is untouched. `ISpechtRule` keeps `Id`, `ReportedIds` and
  `Evaluate`; each new rule's `ReportedIds` names its one id;
  `SpechtRunner.Evaluate` selects, filters and counts as it does today.
  Collapsing the interface is item 0164. `AddSpechtEngine()` registers each
  new rule by name, in ordinal order of its id, where it registers
  `DependencyRule` today.

  What keeps the report byte-identical is ADR-0010 § "Why no structural
  stage changes a verdict": the rule id is the last sort key and the sort
  is stable, so each new rule emits its violations in the order the old
  class emitted that id, and keeps every guard the old class applied before
  it, including a guard that today sits in another id's branch. The
  acceptance criteria name both.

  No test names this class; the golden report and the acceptance tier are
  what hold its behaviour until item 0152 gives each rule a class of its
  own.

  Depends on 0155: the dependency graph - the Features that have an
  identity and each one's resolved `depends_on` and `blocks` edges - is a
  derivation the model carries from that item, and the three rules read it
  there instead of each building it (`DependencyRule.cs:25-38`).

  It restructures the code of `0001-F1` alone, so it sits beside that
  specification. The eight splits, 0156 to 0163, touch different rule
  classes and share two files:
  `src/specht/Composition/SpechtEngineServiceCollectionExtensions.cs` and
  `test/tests/Composition/SpechtEngineServiceCollectionExtensions.Unit.Tests.cs`.
  Type names and lines are the source's at commit `eb7c161`; once item 0100
  lands each type carries the prefix that item gives it.

acceptance_criteria:
  - "Split: `DependencyRule` is gone and three rules stand in its place, one each for SPEC050, SPEC051 and SPEC052; each one's `ReportedIds` names its own id alone, and `AddSpechtEngine()` registers each by name in ordinal order of its id."
  - "Order kept: SPEC050 and SPEC051 keep the Features' order and, for one Feature, its `depends_on` edges before its `blocks` edges (`src/specht/Rules/DependencyRule.cs:76-78`, `:127-128`). SPEC052 emits every self-dependency, in the Features' order (`:93-104`), before any cycle (`:131-153`), and the cycles in the order the old walk finds them."
  - "Guards kept: every rule reads only the Features that have both `epic` and `id` (`:25-27`). SPEC051 does not test an edge whose target does not resolve (`:80-91`) or an edge to the Feature itself (`:93-104`), whether SPEC050 and SPEC052 are on or off. SPEC052 reports one cycle once (`:173`)."
  - "Untouched: `ISpechtRule`, `SpechtRunner.Evaluate` and `SpechtRunner.Order`, and every violation's file, line, identifier, message and severity."
  - "The composition tests still hold: every concrete rule the engine declares is registered exactly once, the rules resolve in ordinal order of their ids, and the reported ids are the twenty-one of the pinned vocabulary, each once (`test/tests/Composition/SpechtEngineServiceCollectionExtensions.Unit.Tests.cs`)."
  - "No test names `DependencyRule` and no § 9 row names one, so no row is re-pointed here. The three ids are held by the golden report and the acceptance tier, both green unedited."
  - "The golden report `test/tests/Engine/Baseline/engine-e7dba24.json` is unchanged, byte for byte, and the test that compares it is green unedited. The unit, integration and acceptance tiers pass, and the benchmark project `.performance/benchmarks` still compiles."
  - "No .feature change needed: refactor - `DependencyRule` becomes three rules of one id each; every violation, its severity, the report's order and its counts are unchanged."
  - "Constraints preserved: 0001-F1 C-5, 0001-F1 C-9, 0001-F1 C-10, 0001-F5 C-3"
  - "The guard of ADR-0027: CheckBenchmarks at 100 and 1,000 specifications on the base `main` commit and on the branch head, judged by 0211's rule, numbers in the PR description and in a decisions entry; a flag waits for the owner's ruling."

decisions:
  - |
    2026-10-11, spec-author: cut from ADR-0010 on the repository owner's
    acceptance of it the same day, as one of the eight parts of stage 3 (B).
    Item 0154 is the session that produced the record and holds the owner's
    decisions. ADR-0010 found eight rule classes where the plan said seven
    and left the cut to spec-author: eight items, one for each class, 0156
    to 0163. Status `ready-for-implementation`, as items 0104 to 0107 were
    cut on ADR-0001: the design is the accepted record's.
  - |
    2026-10-31, spec-author: on ADR-0027
    (.spec/adr/0027-structural-stages-proceed-on-a-no-regression-guard.md),
    accepted by the repository owner the same day, which lifts ADR-0014's
    benchmark gate for ADR-0010's remaining structural stages and puts a
    no-regression guard on each stage's pull request. The pause in the
    summary is replaced and a criterion for the guard is added. 0216 is
    done and stays in `depends_on` as the record of the evaluation.
    `depends_on` gains 0100, by the owner's order "ADR, then 0100, then
    splits"; 0100 also renames every engine type a split touches. Status
    `blocked` to `ready-for-implementation`, as cut: the design is ADR-0010's
    and 0100 is open.
  - |
    2026-11-01, implementer: `DependencyRule` is deleted and three rules
    stand in its place: `DependencyTargetRule` (SPEC050),
    `DependencySymmetryRule` (SPEC051) and `DependencyCycleRule` (SPEC052),
    registered in that order where `DependencyRule` was. Each walks
    `FeaturesWithIdentity` and a Feature's `depends_on` edges before its
    `blocks` edges, reading the model's `SpechtDependencyGraph`.
    `DependencySymmetryRule` skips an unresolved target and a self-edge
    itself, the guards that sat in the SPEC050 and SPEC052 branches;
    `DependencyCycleRule` keeps the resolved-target guard on its self-edge
    test, emits self-dependencies before cycles and keeps the old walk and
    its once-per-identity set unchanged. The edge walk is repeated in each
    rule rather than shared, since the three read different things from it.
    Judged: the summary says no test names `DependencyRule`, but
    `test/tests/Report/ItemsEdgesApprovalExpectations.cs` constructed it as
    theory data; its cases now construct the rule for their id, and no test
    name or § 9 row changes. A rule that throws now faults under its own id
    rather than SPEC050; none of the three throws on a loaded model. The
    ADR-0027 benchmark guard was not run with this change; it is owed by
    the pull request that carries it.
  - |
    2026-11-01, benchmarker: the guard of ADR-0027, run once for the
    batched pull request of 0156 to 0163, ADR-0010 stage 3. Base `6788caaf`
    (main, the branch's merge base, 0100's rename included), head
    `1d72a7b2` (all eight splits folded; the branch's later changes touch
    documents, item files and one XML remark, no executed code). Separate
    detached checkouts on one host, run alternately base-100, head-100,
    base-1000, head-1000 from 04:01 to 04:04 with `./build.sh Benchmark
    --benchmark-filter '*CheckBenchmarks.Check(Specifications: N)'`,
    BenchmarkDotNet 0.15.8 default job. Host: Apple M1 Max, 10 cores,
    macOS Tahoe 26.4 (25E246), .NET SDK 11.0.100-rc.2.26504.105, runtime
    .NET 10.0.12 Arm64 RyuJIT; 1-minute load average 10.49 falling to 6.45
    on 10 cores during the runs (5-minute 60.8 to 38.2), a shared host
    settling.
    100 specifications: base Mean 45.18 ms, Error 0.601 ms (CI 44.58 to
    45.78 ms), Allocated 33.42 MB; head 45.51 ms, Error 0.603 ms (CI 44.91
    to 46.11 ms), 33.43 MB. Time +0.7%, allocation +0.03%.
    1,000 specifications: base Mean 455.5 ms, Error 6.90 ms (CI 448.6 to
    462.4 ms), Allocated 329.6 MB; head 456.1 ms, Error 4.15 ms (CI 452.0
    to 460.3 ms), 329.88 MB. Time +0.1%, allocation +0.08%.
    Judged by 0109-F5 B-011 and B-012 under ComparisonPolicy.Initial: no
    flag at either size; neither mean rose more than 10% and each head
    interval overlaps its base's, and neither allocation rose more than
    10%. Only the absence of a flag is claimed: one run per side, the
    differences sit inside the intervals, and no change in either direction
    is claimed. The net11.0 runtime was not measured.

