summary: |
  The order the engine reports violations in (severity descending, then
  file, line and rule id, ordinal) is computed inline in SpecCheckRunner.Run,
  where no unit test can reach it, so B-004 stays Partial in § 9. Expose the
  order as a function a unit test can reach, with no verdict change (C-9):
  the golden baseline test 0022 landed stays green unchanged.

acceptance_criteria:
  - "B-004 — the order reachable from a unit test; the golden report still equal, field for field, in order"
  - "C-9 — no verdict changes"
  - "§ 9 carries a row naming a test for each id above."

decisions:
  - |
    2026-10-08, cut by spec-author on spec-reviewer's non-blocking finding
    in 0022's review round 1: the order has no unit-tier proof.
  - |
    2026-10-09, implementer's architecture pass: the order becomes
    `public static IReadOnlyList<SpecViolation> Order(IEnumerable<SpecViolation>)`
    on `SpecCheckRunner`, the inline LINQ chain moved verbatim, and `Run`
    calls it. LINQ stays because its sort is stable, and ties on all four
    keys keep collection order (C-9). No `IComparer` (no second caller;
    invites the unstable `List.Sort`) and no new type. Static under ADR-0001
    "The statics that stay": a pure function with no I/O, kept static at
    stage D. 0105's `Evaluate` calls it once; 0014's severity map runs
    before it; ADR-0005's `Order(graded)` is this function. Design in
    0001-F1 § 6, § 7.

out_of_scope:
  - "Changing the order or any verdict — C-9; 0001-F5 at brief § 8 step 5."
  - "Everything else in § 5 of the spec."
