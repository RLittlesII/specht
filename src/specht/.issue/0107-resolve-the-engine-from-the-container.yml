summary: |
  ADR-0001 (accepted 2026-10-08), stage D; the host half is ADR-0003's.
  The readers other than FrontmatterReader (delivered by 0104), the
  parser's caller, the discovery walk and the loader become sealed
  instance classes taking IFileSystem by constructor, with
  no interface per reader. One hand-written IServiceCollection extension,
  AddSpechtEngine(), registers every engine type as a singleton, each rule
  by name; Program.cs calls it once. The engine references
  Microsoft.Extensions.DependencyInjection.Abstractions only, pinned in the
  Engine item group of Directory.Packages.props. The two SpechtRunner
  Unit files move to Integration with the § 9 rows that name them (B-004,
  B-010). No verdict changes (C-9).

  Depends on 0106 for the rule list it registers and on 0099 for how tests
  compose the host. The C-7 amendment this waited on is on main (§ 4 C-7,
  § 10 2026-10-08): the new package is the fifth engine dependency C-7
  names. Discovery's interface and git-listing seam
  (ADR-0001 stage E) are not here: they land inside 0007 and 0008, which
  wait on this, as does 0016.

  ADR-0005 (a) adds two pieces stage D did not name. The manifest stage
  becomes a sealed instance class, SpecSchemasLoader, around
  SpecSchemas.Load(IFileSystem, root). The pure root-relative path
  mapping, SpecDiscovery.Relative, which FeatureFileRule calls from inside
  a rule (FeatureFileRule.cs:39), moves to a static type of its own,
  SpecPath, so no rule reaches into the discovery stage. The model loader,
  SpecModelLoader, is sealed and concrete. SpechtRunner keeps its name.

