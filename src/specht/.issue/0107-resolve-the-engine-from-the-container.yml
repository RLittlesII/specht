summary: |
  ADR-0001 (accepted 2026-10-08), stage D; the host half is ADR-0003's.
  The readers, the parser's caller, the discovery walk and the loader
  become sealed instance classes taking IFileSystem by constructor, with
  no interface per reader. One hand-written IServiceCollection extension,
  AddSpechtEngine(), registers every engine type as a singleton, each rule
  by name; Program.cs calls it once. The engine references
  Microsoft.Extensions.DependencyInjection.Abstractions only, pinned in the
  Engine item group of Directory.Packages.props. The two SpecCheckRunner
  Unit files move to Integration with the § 9 rows that name them (B-004,
  B-010). No verdict changes (C-9).

  Depends on 0106 for the rule list it registers and on 0099 for how tests
  compose the host. Also waits on the C-7 amendment on branch
  spec/adr-0001-owed-edits, which must merge first: the new package is a
  fifth engine dependency against C-7, and that amendment has no item id
  to put in depends_on. Discovery's interface and git-listing seam
  (ADR-0001 stage E) are not here: they land inside 0007 and 0008, which
  wait on this, as does 0016.

  ADR-0005 (a) adds two pieces stage D did not name. The manifest stage
  becomes a sealed instance class, SpecSchemasLoader (placeholder name),
  around SpecSchemas.Load(IFileSystem, root). The pure root-relative path
  mapping, SpecDiscovery.Relative, which FeatureFileRule calls from inside
  a rule (FeatureFileRule.cs:39), moves to a static type of its own, so no
  rule reaches into the discovery stage. The model loader, SpecModelLoader
  (placeholder name), is sealed and concrete. SpecCheckRunner keeps its
  name.

