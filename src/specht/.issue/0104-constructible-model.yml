summary: |
  ADR-0001 (accepted 2026-10-08), stage A. SpecModel, SpecDocument,
  FeatureSpec and ChildItem get public constructors or named factories, so
  a test builds a model in memory. SpecDocument.Parse(text, relativePath)
  replaces the path-based Parse(absolutePath, relativePath) rather than
  overloading it; the loader reads the text and passes it in. No container,
  no package, no InternalsVisibleTo (ADR-0001 Decision). No verdict changes
  (C-9). Depends on 0012: the stage's proof includes the default-manifest
  guard, and ADR-0001 accepts no substitute proof.

