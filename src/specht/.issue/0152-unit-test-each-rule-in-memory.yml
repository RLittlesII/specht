summary: |
  Item 0107 re-tiered the rule-level tests that write a SpecTree to disk to
  Integration and rewrote none over an in-memory model, so 0001-F1 § 9 holds
  B-004 Partial and § 8 records a unit test per rule over SpecModelFixture
  as owed. This item writes them. No production code changes.

  Each of the eight rules AddSpechtEngine() registers gets one Unit class
  that calls the rule's Evaluate over a SpecModel built with
  SpecModelFixture, with no tree on disk and no container. FeatureFileRule
  is built over a FeatureFileReader on a MockFileSystem, as
  FeatureFileRuleUnitTests already does. Four rules have a Unit class today
  (ApprovalRule, ClaimRule, SectionStructureRule, FeatureFileRule) and four
  have none (ChildItemRule, DependencyRule, FrontmatterSchemaRule,
  IdentityRule); the existing classes are extended where a rule id they
  report is pinned by none of their tests.

  Depends on 0107 for the constructor-injected reader. It needs no design
  pass: § 8 says nothing in the design stands in the way since item 0104.
  The schema set of an in-memory model is loaded over a MockFileSystem
  holding a manifest, as § 8 describes for item 0105.

  Reshaped 2026-10-11 on ADR-0010 (accepted 2026-10-11,
  .spec/adr/0010-layered-engine-boundaries-with-io-at-the-edge-and-a-mediator.md,
  § "Items reshaped"). The claim and the purpose stand; the count and the
  shape change. Where the paragraphs above say eight rules and eight Unit
  classes, read twenty-one: one Unit class for each single-id rule the
  splits of items 0156 to 0163 leave, each pinning the one id its rule
  reports. The item is kept and not dissolved into those eight: a split is
  a refactor that re-points the tests a class already has and writes none,
  and four of the eight classes have no Unit test to re-point, so the
  tests owed for B-004 are still owed after the last split.

  After item 0155 the companion tags are on the model, so the rules of
  SPEC020 and SPEC021 are built with no reader and no MockFileSystem; the
  second paragraph's sentence on FeatureFileRule no longer holds. How the
  schema set of an in-memory model is built follows whichever of items
  0165 and 0166 has landed when this is taken.

  It does not wait on item 0164. If it lands first, 0164 re-points these
  classes from violations to findings; if 0164 lands first, each class
  asserts a rule's findings and leaves the id and severity to the
  evaluator's tests.

acceptance_criteria:
  - "B-004 — one Unit class per rule, for each of the eight rules, over
    `SpecModelFixture`"
  - "B-004 — every rule id a rule reports is pinned by at least one unit
    test of that rule: all twenty-one"
  - "B-004 — no test of these classes writes a tree to disk or builds a
    container; `FeatureFileRule` reads through a `MockFileSystem`"
  - "0001-F1 § 9's B-004 row moves `Partial` to `Covered` and names the
    classes."
  - "C-9 — no verdict changes; the golden-report test green, unedited"
  - "§ 9 carries a row naming a test for each id above."
  - "ADR-0010, as reshaped 2026-10-11: the three B-004 criteria above are
    read with twenty-one single-id rules in place of eight rule classes -
    one Unit class for each rule of items 0156 to 0163, twenty-one classes,
    each pinning its rule's one id over a model built in memory."
  - "ADR-0010, as reshaped: no test of these classes holds a file system of
    any kind, `MockFileSystem` included, to build a rule; the companion
    tags a test needs are given to the model (item 0155)."
  - "ADR-0010, as reshaped: every order and guard the split items name as
    kept - the Order kept and Guards kept criteria of items 0156 to 0163 -
    is pinned by a test of the rule it belongs to, including a guard that
    holds with the sibling ids off."

