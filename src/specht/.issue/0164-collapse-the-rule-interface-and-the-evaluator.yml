  - "A rule that defaults to a severity other than error, and `MinimumSchemaVersion` - epic `0101` (ADR-0004, as it stands)."
  - "Fault isolation around a rule that throws, by a decorator - `0001-F1` B-012 to B-016 and OQ-2; ADR-0005 (c). No item owns it yet."
  - "New rule ids and a folder for each rule group - item 0169."
  - "A unit-test class for each rule - item 0152, whose tests this item re-points from violations to findings where it has landed first."
  - "The vocabulary written twice, in `SchemaVersions` and as the rules' ids - ADR-0010 open point 7, revisited in item 0169."
