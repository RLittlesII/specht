summary: |
  ADR-0027 lifted ADR-0014's benchmark gate on 2026-10-31: this stage
  proceeds without benefit evidence, and its pull request carries the
  no-regression guard.

  ADR-0010 (accepted 2026-10-11,
  .spec/adr/0010-layered-engine-boundaries-with-io-at-the-edge-and-a-mediator.md),
  stage 3 (B) of "The order of work": the owner's decision 1, one rule per
  rule id. `FeatureFileRule` (`src/specht/Rules/FeatureFileRule.cs:17`)
  reports SPEC020 and SPEC021, and with one of them off and the other on the
  whole class still runs (ADR-0010 § "What the source shows"). This item
  splits it into two rules, each reporting its own id and no other.

  The evaluator is untouched. `ISpechtRule` keeps `Id`, `ReportedIds` and
  `Evaluate`; each new rule's `ReportedIds` names its one id;
  `SpechtRunner.Evaluate` selects, filters and counts as it does today.
  Collapsing the interface is item 0164. `AddSpechtEngine()` registers each
  new rule by name, in ordinal order of its id, where it registers
  `FeatureFileRule` today.

  Item 0155 rewrites this class first: after it the rule holds no reader,
  and the companion tags and a Feature's claims are on the model. ADR-0010
  § "Where the source differs from the plan" left it to `spec-author`
  whether this split rides with that stage; it is its own item.

  What keeps the report byte-identical is ADR-0010 § "Why no structural
  stage changes a verdict": the rule id is the last sort key and the sort
  is stable, so each new rule emits its violations in the order the old
  class emitted that id, and keeps every guard the old class applied before
  it, including a guard that today sits in the other id's branch. The
  acceptance criteria name both.

  It restructures the code of `0001-F1` alone, so it sits beside that
  specification. The eight splits, 0156 to 0163, touch different rule
  classes and share two files:
  `src/specht/Composition/SpechtEngineServiceCollectionExtensions.cs` and
  `test/tests/Composition/SpechtEngineServiceCollectionExtensions.Unit.Tests.cs`.
  Type names and lines are the source's at commit `eb7c161`; once item 0100
  lands each type carries the prefix that item gives it.

acceptance_criteria:
  - "Split: `FeatureFileRule` is gone and two rules stand in its place, one each for SPEC020 and SPEC021; each one's `ReportedIds` names its own id alone, and `AddSpechtEngine()` registers each by name in ordinal order of its id."
  - "Order kept: SPEC020 keeps the Features' order. SPEC021 keeps the Features' order and, within one companion, the tags' order in the file (`src/specht/Rules/FeatureFileRule.cs:43-55`)."
  - "Guards kept: SPEC021 reports nothing for a Feature that has not exactly one companion (`:26-37`), whether SPEC020 is on or off. A tag resolves against the Feature's claims as the claim grammar matches them (`:59-80`), the derivation the model carries from item 0155. SPEC021's violation names the companion by its root-relative path."
  - "Untouched: `ISpechtRule`, `SpechtRunner.Evaluate` and `SpechtRunner.Order`, and every violation's file, line, identifier, message and severity."
  - "The composition tests still hold: every concrete rule the engine declares is registered exactly once, the rules resolve in ordinal order of their ids, and the reported ids are the twenty-one of the pinned vocabulary, each once (`test/tests/Composition/SpechtEngineServiceCollectionExtensions.Unit.Tests.cs`)."
  - "Not a refactor until re-pointed: `FeatureFileRuleUnitTests` and `FeatureFileRuleIntegrationTests` (`0001-F5` § 9 B-001) and `SpechtModelUnitTests` (`test/tests/Model/SpechtModel.Unit.Tests.cs:72`; `0001-F1` § 9 B-002, B-004, B-011) construct or name `FeatureFileRule`, as item 0155 leaves them. Each test is aimed at the rule that reports the id it pins, and `test-writer` re-points any row whose test is renamed, in the same pull request."
  - "The golden report `test/tests/Engine/Baseline/engine-e7dba24.json` is unchanged, byte for byte, and the test that compares it is green unedited. The unit, integration and acceptance tiers pass, and the benchmark project `.performance/benchmarks` still compiles."
  - "No .feature change needed: refactor - `FeatureFileRule` becomes two rules of one id each; every violation, its severity, the report's order and its counts are unchanged."
  - "Constraints preserved: 0001-F1 C-4, 0001-F1 C-5, 0001-F1 C-9, 0001-F1 C-10, 0001-F5 C-1, 0001-F5 C-3, 0001-F5 C-12"
  - "The guard of ADR-0027: CheckBenchmarks at 100 and 1,000 specifications on the base `main` commit and on the branch head, judged by 0211's rule, numbers in the PR description and in a decisions entry; a flag waits for the owner's ruling."

decisions:
  - |
    2026-10-11, spec-author: cut from ADR-0010 on the repository owner's
    acceptance of it the same day, as one of the eight parts of stage 3 (B).
    Item 0154 is the session that produced the record and holds the owner's
    decisions. ADR-0010 found eight rule classes where the plan said seven
    and left the cut to spec-author: eight items, one for each class, 0156
    to 0163, with this class's split apart from item 0155 so that 0155
    stays about the model. Status `ready-for-implementation`, as items 0104
    to 0107 were cut on ADR-0001: the design is the accepted record's.
  - |
    2026-10-31, spec-author: on ADR-0027
    (.spec/adr/0027-structural-stages-proceed-on-a-no-regression-guard.md),
    accepted by the repository owner the same day, which lifts ADR-0014's
    benchmark gate for ADR-0010's remaining structural stages and puts a
    no-regression guard on each stage's pull request. The pause in the
    summary is replaced and a criterion for the guard is added. 0216 is
    done and stays in `depends_on` as the record of the evaluation.
    `depends_on` gains 0100, by the owner's order "ADR, then 0100, then
    splits"; 0100 also renames every engine type a split touches. Status
    `blocked` to `ready-for-implementation`, as cut: the design is ADR-0010's
    and 0100 is open.
  - |
    2026-11-01, implementer: `FeatureFileRule` is gone; `CompanionFileRule`
    (`src/specht/Rules/CompanionFileRule.cs`) reports SPEC020 and
    `ClaimTagRule` (`src/specht/Rules/ClaimTagRule.cs`) reports SPEC021,
    each with `Id` and `ReportedIds` naming its one id, registered by name
    in that order where the old class was. `ClaimTagRule` keeps the
    exactly-one-companion guard from the old SPEC020 branch, and both rules
    keep the `EnsureClaimGrammar()` call the old class made before either
    id. Judged: under a legacy manifest whose claim grammar does not
    compile, the old class faulted once as SPEC020; each enabled rule now
    faults under its own id, so with both on the report gains a second
    rule-failure violation, and with SPEC020 off the one fault names
    SPEC021. No tree whose grammar compiles changes, and the golden report
    is byte-unchanged. Recorded in `0001-F1` § 7. The tests that named the
    old class are aimed at the rule that reports their id; the three
    `FeatureFileRule*Tests` classes are renamed `ClaimTagRule*Tests` and
    `SpechtModelUnitTests`' SPEC020 fact names `CompanionFileRule`, with
    the § 8 and § 9 rows that cite them left to `test-writer`. The ADR-0027
    guard was not run in this worker tree: eight builds shared the host, so
    its numbers would not be comparable; it is owed by the batched pull
    request.

