summary: |
  The top-level manifest key `mint` in C-12's shape, keyed by the
  seven types of C-13 (A-1), and the optional `adr`, `lesson`,
  `decision` and `scenario` members of `identifiers`, each with no
  default grammar (C-14). Both join `0.3.1`'s manifest schema with a
  relock, in place, while no package carries `0.3.1` (C-17; decision
  0003); `0.3.0` and earlier stay as published. The checker owns the
  key (C-5; ADR-0023), and the check reads nothing from it (C-8).

  Risk 3: the key is an opt-in addition, so a tree with it gets the
  report it gets without it (B-014; C-6), and a pin below `0.3.1`
  refuses it as a key it does not define, which is B-015, 0415's.

  Waits on 0388 alone: the `0.3.1` it adds the key to. Whether a
  `mint` entry naming `epic`, `feature` or `task` is a key `0.3.1`
  defines is OQ-17, open with no default; this item states no claim
  on it, and 0421 settles it in `0.3.1` before a package carries it.

acceptance_criteria:
  - "B-014 — a valid manifest that opts types in, the same violations as without the key"
  - "B-044 — 0.3.1 accepts a `mint` key in C-12's shape"
  - "B-045 — 0.3.1 accepts an `adr`, `lesson`, `decision` or `scenario` grammar"
  - "The key and grammars join 0.3.1 with a relock (`0001-F7` C-17, decision 0014); 0.1.0 to 0.3.0 unchanged (`0001-F7` C-1)"
  - "No shipped default grammar changes (C-14)"
  - "§ 9 carries a row naming a test for each id above."

