summary: |
  Closes Feature 0001-F5's open gaps so milestone 0.4.0 can be released.
  B-022 and B-023 reach every rejection they list, the done marker's
  included. A name inside `roles` or `markers` that the engine does not read
  is kept and never read (OQ-10). From schema 0.3.0, a marker of white
  space alone and an empty or `.` schema file name are rejected (OQ-11,
  OQ-22), and a `$`-prefixed member of a path identity is ignored (OQ-14).
  Older pins keep today's behaviour (B-049).
  Risk 2: the rejections and the annotation change only how a manifest is
  read, and they change no shipped file. They must merge before a package
  carries schema 0.3.0 (Manifest decision 0021, reversal).

