  - "B-074 — from 0.3.0, a `$`-prefixed identity member is ignored"
  - "B-075 — from 0.3.0, an empty or `.` schema file name is rejected"
  - "B-073 to B-075 hold from schema 0.3.0 only; older pins keep their verdicts (B-049, A-6)."
  - "§ 9 carries a row naming a test for each id above."

