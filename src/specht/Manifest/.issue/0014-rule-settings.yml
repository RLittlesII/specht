summary: |
  Per-rule severity and disable, limited to the pinned vocabulary: a rule id
  outside it is rejected, and nothing named in the manifest is loaded or run.
  The default manifest sets nothing, so the baseline is untouched. Key names
  wait on OQ-1.

acceptance_criteria:
  - "B-010 — warning severity: printed, counted, fails only under `--strict`"
  - "B-011 — disabled: not evaluated at all, so not counted"
  - "B-013 — rule id outside the vocabulary rejected, naming it"
  - "B-017 — no rule type, library or body loaded (C-3)"
  - "The severity map skips fault violations — 0001-F1 B-015 (ADR-0005 (c))"
  - "§ 9 carries a row naming a test for each id above."

decisions:
  - |
    2026-10-08, implementer at the owner's request: disable (B-011) and
    re-grade (B-010) are one step in `SpecCheckRunner` over each rule's
    collected violations, read from the manifest, before the single sort.
    No chain of handlers, no decorator, no context object (ADR-0002, option
    1). A chain around `ISpecRule` waits on a third per-rule behaviour and a
    superseding ADR.
  - |
    2026-10-09, spec-author on the owner's acceptance of ADR-0004,
    superseding the 2026-10-08 entry: disable and re-grade are two
    functions inside `SpecCheckRunner.Evaluate(SpecModel)` (0105), both
    reading the settings from `model.Schemas.Structure`. Selection runs over
    the rule set before evaluation, so a disabled rule is never evaluated and
    leaves the count (B-011); the severity map runs over the violations
    before 0103's order function, because that function sorts by severity
    first (B-010). The map skips fault violations (ADR-0005 (c)). No chain,
    decorator, stage list, rule-set filter or context object, however many
    per-rule settings accumulate. `DefaultSeverity` and
    `MinimumSchemaVersion` are cut with epic 0101's first item, not here.

