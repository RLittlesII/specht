summary: |
  Per-rule severity and disable, limited to the pinned vocabulary: a rule id
  outside it is rejected, and nothing named in the manifest is loaded or run.
  The default manifest sets nothing, so the baseline is untouched. The key is
  `rules`, each rule id mapped to `error`, `warning` or `off` (decision 0007).

acceptance_criteria:
  - "B-010 — warning severity: printed, counted, fails only under `--strict`"
  - "B-011 — disabled: not evaluated at all, so not counted"
  - "B-013 — rule id outside the vocabulary rejected, naming it"
  - "B-017 — no rule type, library or body loaded (C-3)"
  - "B-042 — level other than `error`, `warning`, `off` rejected, naming the id and the value"
  - "B-010's re-grade is proven on a rule's findings only; that it skips a fault violation is 0001-F1 B-015, owed to the item that delivers it (ADR-0005 (c); 0001-F1 OQ-2)"
  - "§ 9 carries a row naming a test for each id above."

decisions:
  - |
    2026-10-08, implementer at the owner's request: disable (B-011) and
    re-grade (B-010) are one step in `SpechtRunner` over each rule's
    collected violations, read from the manifest, before the single sort.
    No chain of handlers, no decorator, no context object (ADR-0002, option
    1). A chain around `ISpecRule` waits on a third per-rule behaviour and a
    superseding ADR.
  - |
    2026-10-09, spec-author on the owner's acceptance of ADR-0004,
    superseding the 2026-10-08 entry: disable and re-grade are two
    functions inside `SpechtRunner.Evaluate(SpecModel)` (0105), both
    reading the settings from `model.Schemas.Structure`. Selection runs over
    the rule set before evaluation, so a disabled rule is never evaluated and
    leaves the count (B-011); the severity map runs over the violations
    before 0103's order function, because that function sorts by severity
    first (B-010). The map skips fault violations (ADR-0005 (c)). No chain,
    decorator, stage list, rule-set filter or context object, however many
    per-rule settings accumulate. `DefaultSeverity` and
    `MinimumSchemaVersion` are cut with epic 0101's first item, not here.
  - |
    2026-10-10, spec-author on the repository owner's decision (OQ-1,
    decision 0007): one top-level key `rules`, each rule id mapped to
    `error`, `warning` or `off`; an id not named keeps the rule's own
    severity (B-019), and the default manifest declares `"rules": {}`. Any
    other value is an invalid manifest (B-042, added to this item).
    Rejected: `rules` mapping an id to an object with `severity` and
    `enabled`; two keys, a `severities` map and a `disabled` list.
  - |
    2026-10-10, spec-author, amending the 2026-10-09 entry's "The map skips
    fault violations": this item proves B-010 on a rule's findings only.
    Nothing in the engine produces a fault violation, 0001-F1 B-013 and
    B-015 are `Missing`, and the provenance marker the map would test is
    owed to the item that delivers them (ADR-0005 (c)). No item does today
    (0001-F1 OQ-2). That item owes the marker, the skip in the map and the
    test of 0001-F1 B-015; this item adds no marker and no test of a skip.

