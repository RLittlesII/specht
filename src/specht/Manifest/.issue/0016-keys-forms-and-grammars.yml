summary: |
  Moves the frontmatter key names, the identity and edge forms and the task
  grammar into the manifest, one shared literal at a time with 0012 green after each
  (A-2), and rejects a grammar that does not compile. Risk 4: it changes
  what SPEC011, SPEC012, SPEC020, SPEC040, SPEC041, SPEC043, SPEC044,
  SPEC050-SPEC052, SPEC060 and SPEC061 read, and SPEC021, SPEC030 and
  SPEC031 under B-014 (§ 7, the moves); every id grammar must live once
  (C-2), and a renamed key must not be excused from the frontmatter schemas
  (C-8). Key names are ratified in decision 0010, grouped by document kind.

acceptance_criteria:
  - "B-049 — Older pins keep their manifest interpretation"
  - "B-050 — A task grammar requires its sequence group"
  - "B-051 — An epic task grammar requires its epic group"
  - "B-052 — A form requires each expected placeholder exactly once"
  - "B-053 — A sequence gap message follows the captured width"
  - "B-054 — A malformed dependency edge retains its text"
  - "B-004 — every frontmatter key a rule reads named in the manifest"
  - "B-005 — qualified identity and both edge forms declared"
  - "B-006 — epic and sequence via named groups; three-digit sequence checked"
  - "B-014 — non-compiling grammar rejected, naming it"
  - "§ 9 carries a row naming a test for each id above."

decisions:
  - |
    2026-10-13, the repository owner: design decisions ratified in Manifest
    decision 0010. Keys are grouped by document kind; the new contract starts
    at schema 0.2.0, preserving older pins. Strict groups and form validation,
    raw malformed-edge identifiers and captured sequence width are agreed.
    Implementation follows ADR-0010 stages 0164 and 0166 and the pinned-default
    work 0191. This design pass writes no engine code or test implementation;
    status is blocked on those prerequisite items, not on the resolved calls.
    Architecture finding: 0043 also precedes completion because B-004 and
    B-005 need the on-disk schema source through the public command. The
    current loader selects embedded schemas and the source selector is not
    built; a hand-composed test seam alone would not prove that entry point.
  - |
    2026-10-09, spec-author on the owner's direction: B-007 moved to item
    0118, which carries all the claim-tag work (B-007, B-036 to B-038). Risk
    stays 4: five rules and C-2 and C-8 remain here. Rejected: keeping B-007
    here, which would split one reader's change across two items.
  - |
    2026-10-10, the repository owner: the claim-tags item is renumbered
    from 0118 to 0134 (item 0134's decisions). Recorded by spec-author.
  - |
    2026-10-11, the repository owner: a design pass only. No engine code is
    written until the first release tag has landed and the order against
    ADR-0010 is settled (OQ-17). The implementer's design is in § 6 and § 7;
