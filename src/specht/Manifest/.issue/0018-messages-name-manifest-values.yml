summary: |
  A message naming a section, a key or the manifest's path spells it as the
  manifest does. Depends on 0015, 0016 and 0017, which make those values
  readable; 0012 stays green because the default values preserve the baseline.

acceptance_criteria:
  - "B-009 — section, key and manifest path named by the manifest's value"
  - "§ 9 carries a row naming a test for each id above."

decisions:
  - |
    2026-11-03, the repository owner: two rulings, recorded by spec-author in
    Manifest decision 0019. A message numbers a section `§ N` by the leading
    number of its role's title, or names it `## <title>` when the title has
    none, at every pin. B-009 is widened to markers: a message naming a
    marker names the manifest's text. Under the default manifest no golden
    report changes. Rejected: the full title from schema 0.3.0 with a relock
    of engine-v0.3.0.json; keeping markers out and correcting § 7. The
    manifest's own path is the fixed `.specht/manifest.json`, which no key
    sets.

