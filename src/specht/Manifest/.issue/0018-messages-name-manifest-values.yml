    spec-author. Base `6795e03b` (`main`), head `8332537e`, run back to
    back on one host with `CheckBenchmarks.Check`, BenchmarkDotNet v0.15.8
    default job, interleaved: base 100, head 100, base 1000, head 1000.
    Host: Apple M1 Max, 10 cores, macOS Tahoe 26.4 (25E246), .NET SDK
