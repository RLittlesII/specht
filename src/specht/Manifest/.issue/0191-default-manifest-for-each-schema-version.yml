summary: |
  The tool ships more than one schema version but the engine still fills
  omissions from one embedded live-copy default. Read the pinned version's
  shipped default instead, per omitted value, leaving consumer declarations
  and rule levels as written. Manifest B-048 and decision 0010 own the
  agreement, resolved by the owner on 2026-10-13. This supplies the omission
  mechanism required before 0016's versioned 0.2.0 interpretation is built.

acceptance_criteria:
  - "B-048 — missing values use pinned defaults, explicit values win, and rule levels are not inherited."
  - "Design: Manifest § 7 and decision 0012 name the source, pin selection, parser lifetime, omission boundaries and caller migration."
  - "B-048 tests distinguish synthetic versions with different defaults; equal real defaults alone do not prove the selected version."
  - "§ 9 carries a row naming a test for that claim."

decisions:
  - |
    2026-10-13, implementer: design pass complete in Manifest § 6 to § 8
    and decision 0012. The owner's B-048 behavior from decision 0010 is
    unchanged. Implementation follows 0165, whose instance version catalog,
    pure lookup and embedded-resource boundary are the required seams.
    Existing versioned manifest sources are linked rather than copied;
    whole-value/per-name fill boundaries and unfilled rule levels remain.
    No engine code, test implementation or version files are changed in
    this pass. Status is blocked on that structural prerequisite.
  - |
    2026-10-13, the repository owner: OQ-23 resolved in Manifest decision 0010.
    This item carries B-048 and is ready for its architecture pass; it is not
    taken and no implementation was added by the 0016 design pass.
  - |
    2026-10-11, spec-author: cut blocked, on the repository owner's
    instruction to raise the question and not decide it. It waits on
    0011 for the fill and on 0126 for the version folders; both edges
    are spec-author's reading.

