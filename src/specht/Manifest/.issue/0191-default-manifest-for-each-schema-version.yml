summary: |
  A value a manifest omits takes the default manifest's (B-019), and the
  engine holds one default manifest. Once the tool ships more than one
  schema version, each version ships its own manifest (0001-F7 B-013,
  decision 0009), and nothing says which one fills what a
  manifest pinned to an older version leaves out.

  Blocked on the owner: OQ-23. Its default is that the fill comes from
  the pinned version's shipped manifest, so a pinned tree's verdict does
  not move when the tool is updated (0001-F7 C-4). Nothing is built on
  the default: with one shipped version the two readings give the same
  result.

  `claims: []` because no claim is written until OQ-23 is answered; the
  answer adds one, and this item takes it.

acceptance_criteria:
  - "OQ-23 answered and resolved in place, and the claim it adds cited here."
  - "§ 9 carries a row naming a test for that claim."

