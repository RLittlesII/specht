summary: |
  Makes epics opt-in: whether a tree has an epic tier is read from the
  manifest's epic grammar alone (decision 0004, C-10). Without the epic
  grammar, a Feature's identity is its `id`, local edges resolve by `id`,
  qualified edges name no Feature, items number per Feature, the epic schema
  and files are not read, and SPEC3001 checks the Feature segment alone. No
  specification is left out of SPEC3002 or SPEC6001-SPEC6003 for carrying no
  `epic` (C-11).
  Depends on 0016: it adapts the identity, edge resolution and item sequence
  that 0016 first reads from the manifest's forms and task grammar
  (decision 0018). Risk 4: it changes what SPEC1004, SPEC3001, SPEC3002,
  SPEC5003, SPEC5004 and SPEC6001-SPEC6003 read for every epic-less tree.
  In milestone 0.4.0, so the first package carrying schema 0.3.0 holds it
  (`0001-F7` OQ-72, default (a)).
  Open questions this item meets, each to be settled before or in it:
  OQ-4 (identity under the epic grammar for a Feature with no `epic`),
  OQ-13 (whether the shipped default stops declaring the epic grammar)
  and OQ-26 (`expected.form` without the epic grammar). OQ-5 was resolved
  on item 0016.

