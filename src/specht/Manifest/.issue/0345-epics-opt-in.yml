  - "B-025 — without epics, identity is the `id` alone"
  - "B-026 — without epics, a repeated `id` is a duplicate"
  - "B-027 — without epics, no specification left out for carrying no `epic`"
  - "B-028 — without epics, a local edge resolves by `id`"
  - "B-029 — without epics, a qualified edge names no Feature"
  - "B-030 — without epics, `parent` compared with the Feature `id`"
  - "B-031 — with epics, a bare parent reported"
  - "B-032 — without epics, items numbered per Feature"
  - "B-033 — without epics, no epic schema file needed"
  - "B-034 — without epics, SPEC1004 reports nothing"
  - "B-035 — with epics, a missing `epic` reported, in either layout"
  - "B-042 — without epics, SPEC3001 checks the Feature segment alone"
  - "§ 9 carries a row naming a test for each id above."

