summary: |
  A rule may ship with its own level off: it reports nothing until the
  manifest's `rules` raises it to error or warning, and a manifest that
  names no level for it keeps that off level (B-044, decision 0009). The
  schema 0.2.0 default manifest gains a `rules` map listing SPEC034 and
  SPEC035 as off. Matrix resolution's waiver and retired-claim rules
  (0001-F12 B-018 to B-020) are the first rules at that level.

  Risk 3: no rule declares a level of its own today - a violation carries
  its severity, and SpecSeverity has no off - so selection in the runner
  changes beside the one 0014 built for a manifest's `off`. The 0.2.0
  default manifest changes, so 0.2.0, never published, is relocked by
  0001-F7 decision 0014's procedure, as 0222 did. Item 0164's rule
  interface carries a default severity, but it is gated by ADR-0014 and
  is not a prerequisite.

  Depends on 0226: the 0.2.0 default manifest cannot list SPEC034 and
  SPEC035 until they are in 0.2.0's rule vocabulary (0001-F7 B-115), or
  B-013 rejects them. The @B-061 scenarios observe the waiver rule
  (0001-F12 B-018), which the later 0001-F12 item for SPEC034 and SPEC035
  builds; that item depends on this one, for B-020, so the scenarios bind
  there. Until then this item's tests are unit and integration tier, and
  B-061's § 9 row stays Partial.

acceptance_criteria:
  - "B-061 — own level off, reports only when raised; 0.2.0 default lists SPEC034 and SPEC035 off"
  - "0.2.0 relocked by 0001-F7 decision 0014's procedure; 0.1.0's digest unchanged (0001-F7 C-17)."
  - "§ 9 carries a row naming a test for each id above."

