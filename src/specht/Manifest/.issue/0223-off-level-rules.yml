summary: |
  A rule may ship with its own level off: it reports nothing until the
  manifest's `rules` raises it to error or warning, and a manifest that
  names no level for it keeps that off level (B-044, decision 0009). This
  item builds that mechanism and needs no new rule id: its tests run fake
  rules over a fixture vocabulary, as the runner's tests do for 0014's
  `off`.

  B-061's other half - the 0.2.0 default manifest's `rules` listing
  SPEC034 and SPEC035 as off - lands with 0227, the 0001-F12 item that
  builds those two rules and adds their ids to the 0.2.0 vocabulary, since
  a `rules` key outside the vocabulary is rejected (B-013). 0227 depends
  on this item for 0001-F12 B-020 and binds the @B-061 scenarios, which
  observe the waiver rule. Until then B-061's § 9 row stays Partial.

  Such a rule, not raised, is not run and is not counted among the rules
  evaluated (B-062, decision 0014), the same selection B-011 makes for a
  manifest's `off`, so 0001-F7 B-014 reads as it does under B-011. The
  @B-062 scenario observes the waiver rule too and binds in 0227.

  Risk 3: no rule declares a level of its own today - a violation carries
  its severity, and SpecSeverity has no off - so the rule contract and
  the runner's selection change beside the one 0014 built for a
  manifest's `off`. Item 0164 reshapes the same rule interface; it is
  gated by ADR-0014 and is not a prerequisite, but the two must not
  disagree. No file of a shipped version changes, so nothing is relocked.

acceptance_criteria:
  - "B-061 — a rule whose own level is off reports only when raised; the 0.2.0 default's SPEC034 and SPEC035 entries are 0227's"
  - "B-062 — such a rule, not raised, is not run and the count of rules evaluated excludes it, as under B-011"
  - "B-044 holds for such a rule: no level named keeps its own, off."
  - "§ 9 carries a row naming a test for each id above."

decisions:
  - |
    2026-10-15, spec-author: cut for B-061, which 0222 left to a later
    item because it touches the same manifest files. Value omitted, so it
    inherits 0010's.
  - |
    2026-10-15, spec-author, on the owner's ruling that each id enters the
    0.2.0 vocabulary with its own rule (so 0001-F7 B-014 holds at every
    commit): B-061 is delivered in two items. This one builds the off
    level and depends on nothing; 0227 lists SPEC034 and SPEC035 off in
    the 0.2.0 default manifest when it adds their ids, and depends on this
    one. The claims order it so: 0001-F12 B-020 needs the off level before
    SPEC034 and SPEC035 can ship off, and B-013 needs their ids in the
    vocabulary before any manifest lists them. Rejected: this item waiting
    on the vocabulary (0226, withdrawn), which left B-014 false until the
    last of nine rules landed; this item waiting on 0227, which needs the
    off level first, so each would wait on the other; the off level built
    inside 0227, which leaves no 0001-F5 item for a 0001-F5 mechanism; and
    shipping SPEC034 and SPEC035 at warning until the off level lands,
    which 0001-F12 B-020 forbids.
  - |
    2026-10-15, spec-author: gains B-062 on the owner's answer to
    spec-reviewer's round-2 question (a), "If the rule is off, why would
    we waste cycles evaluating it?" (decision 0014). B-061 did not say
    whether such a rule runs or counts. The runner's selection for a
    manifest's `off` (B-011, item 0014) is extended to the rule's own level,
    not duplicated beside it. Rejected: running the rule and dropping its
    violations, which the owner ruled out; counting it unrun, which
    B-011 rules out for `off`.

