summary: |
  As a repository whose Features declare their own claim prefix, I want
  one manifest record per id type that gives its plain text, its form in
  a prefixed Feature, its grammar and its mint settings, and shipped
  records that admit minted ids, so that ids such as `ACTIVITY-k3x9ab`
  pass the check (decision 0024).

  The cut follows item 0388: `./build.sh CutSchemaVersion` copies
  `0.3.1` through 0189's target (`0001-F7` B-094 to B-100), then
  `./build.sh LockSchemaVersion` locks it. `0.4.0` adds the `ids` key
  and its shipped records, and rejects the top-level `mint` key and the
  `identifiers` members for the seven types. It is a `0.minor` step, not
  a patch: the wider `claim` record can fail a tree `0.3.1` accepts,
  which `0001-F7` C-11 allows only in a `0.minor` below `1.0.0`
  (`0001-F7` OQ-78, the owner's answer). `0.3.1` is carried by a
  published package, so it stays byte-identical (`0001-F7` C-1).

  Risk 4: a new key with four members, the claim grammar for a prefixed
  Feature (A-8), the tag reading between claim and scenario heads
  (B-094, B-095, B-100, B-101), shipped records that change verdicts, rejected old
  keys, and this repository's live `.specht/` and pin moving to `0.4.0`
  in the same pull request, because `0001-F4` B-004 fails from the cut
  until they do (the precedent is 0388). Value 4 is the value of `0010`.
  `0001-F19`'s 0436 and `0001-F7`'s 0437 wait on it.

