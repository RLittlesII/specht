summary: |
  The loader every other manifest read goes through: read the manifest from
  disk once, fill each omitted value from the default manifest, ignore `$`
  annotations, reject an unknown key, and finish validating before any rule
  runs (C-5). Every family of keys in this Feature, and Discovery's inputs
  (0005), plug into it, so it goes first.

acceptance_criteria:
  - "B-012 — unknown key rejected, naming it"
  - "B-018 — rejection before any rule; no violation beside it"
  - "B-019 — omitted value read as the default manifest's"
  - "B-020 — `$`-prefixed key ignored"
  - "§ 9 carries a row naming a test for each id above."

decisions:
  - |
    2026-10-08, spec-author recording the owner's direction: file-system
    access goes through System.IO.Abstractions — an `IFileSystem` in
    production, a `MockFileSystem` in tests. The seam reaches
    `SpecManifest` and `SpecSchemas` only; the rest of the engine is
    deferred, each part to the item that first needs a test double there
    (0001-F5 § 7). Rejected: threading `IFileSystem` through the whole
    copied engine in this item, which no claim asks for.

