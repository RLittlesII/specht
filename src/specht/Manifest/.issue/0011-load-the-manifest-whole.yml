summary: |
  The loader every other manifest read goes through: read the manifest from
  disk once, fill each omitted value from the default manifest, ignore `$`
  annotations, reject an unknown key, and finish validating before any rule
  runs (C-5). Every family of keys in this Feature, and Discovery's inputs
  (0005), plug into it, so it goes first.

