summary: |
  Moves the claim tag scan out of the companion reader's own expression and
  onto the manifest: the one claim grammar, a tag form around it, and a case
  setting, with a form that does not hold exactly one placeholder rejected.
  Depends on 0011 for the loader the two keys join, on 0012 because the
  default form and exact case must keep the baseline verdicts (A-2, C-4), and
  on 0107 because ADR-0001 stage D threads the file system through the reader
  this item changes. Risk 3: one rule and one reader, but the tag scan and the
  claim grammar must become one expression without a second one appearing
  (C-2), the default must read every tag exactly as today's scan does, and the
  case setting must stop at the tag (C-12). Key names wait on OQ-1; OQ-8 and
  OQ-9 are open on B-037 and B-036.

