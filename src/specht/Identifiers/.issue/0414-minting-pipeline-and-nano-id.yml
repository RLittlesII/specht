summary: |
  The engine's minting pipeline in `src/specht/Identifiers/`: read a
  type's `mint` entry, select its strategy, run the decorators around
  it and give back one id or a refusal (C-4, C-9). Nano ID is its first
  strategy, reading only its own sub-object (C-3), with the default
  alphabet and the repository-wide default size (B-019, B-020).

  Risk 3: the pipeline is the seam every later strategy and decorator
  joins, so its shape is fixed here; minting draws at random, so the
  random source is injected and a test reads a fixed draw; the
  pipeline writes nothing (C-1) and needs no network (C-7).

  Waits on 0413 alone. The command that prints the id is 0415.

acceptance_criteria:
  - "B-005 — the configured Nano ID size"
  - "B-006 — every character in the configured alphabet"
  - "B-008 — each type minted with its own settings"
  - "B-019 — no alphabet, lower-case base32"
  - "B-020 — adr or lesson with no size, 8 characters"
  - "Strategies and decorators in the engine, none in a command (C-9)"
  - "§ 9 carries a row naming a test for each id above."

