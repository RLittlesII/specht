summary: |
  As an author or an agent session on one of several branches or
  worktrees, I want `specht mint <type>` to print a new id for a type
  my manifest opts in, so that no other branch takes the same id and
  no record is renumbered before a merge.

  Risk 4: two strategies, three decorators and the request each have
  their own claims (C-3, C-4); the `mint` key and four `identifiers`
  grammars enter schema `0.3.1`, amended in place, and must change no
  check verdict (C-6, C-17, B-014); the collision guard reads the tree
  in five places; and three open questions hold two children.

  Every child waits, through 0413, on 0388 (`0001-F7`), which cuts
  schema `0.3.1`. 0413 adds the key and the grammars; 0414 the
  engine's minting pipeline and Nano ID; 0415 the command; 0416 the
  collision guard for the repository-wide types and its number of
  attempts (B-017, B-034 to B-039, B-052); 0417 the prefix and
  the Nano ID encoding; 0419 Snowflake; 0420 validation against a
  grammar. Two are blocked on open questions with no recorded
  default: 0418, the per-Feature types (OQ-15, OQ-16); and 0421, the
  types the first slice leaves out (OQ-17). 0419 was blocked on
  OQ-13 until its 2026-11-10 answer, B-056.

