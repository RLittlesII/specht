summary: |
  The collision guard, a decorator in the engine (C-4, C-9): it draws
  a new candidate while the tree holds one in any letter case (B-034),
  up to `attempts`, 8 by default (B-035 to B-037), and then refuses;
  an `attempts` that is not a positive whole number is refused too
  (B-052).
  This item reads the two repository-wide places, the file names in
  every `adr/` and `lessons/` folder (B-038, B-039). B-017 lands here
  because its third row is the guard's exhaustion and its other two
  are 0415's.

  Risk 3: the guard reads the tree and never writes (C-1, C-11). It
  lists through the check's discovery with every manifest exclusion
  but `/.spec`, so the root `.spec/` is read, and where discovery asks
  git a file git ignores holds no id: OQ-20's default, which no claim
  states. A test fixes the draws so the held candidates are known.

  Proceeds on OQ-11's recorded default for the exit code of an
  exhausted guard (C-10), and on OQ-20's for the places it skips.
  Waits on 0415 alone.

acceptance_criteria:
