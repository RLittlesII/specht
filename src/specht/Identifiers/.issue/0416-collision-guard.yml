  - "B-036 — no attempts named, eight held, nothing printed"
  - "B-037 — the named attempts held, nothing printed"
  - "B-038 — an `adr/` file name held"
  - "B-039 — a `lessons/` file name held"
  - "B-052 — attempts not a positive whole number, nothing printed"
  - "§ 9 carries a row naming a test for each id above."

