summary: |
  Two answers the repository owner gave on 2026-11-14 (§ 10).

  OQ-21: under schema 0.4.0 with a `gherkin` claim source, the
  collision guard for a claim request treats an id as held when either
  the Feature's README first cells or the claims `0001-F16` B-001
  builds from the Feature's claim file sets hold it, so mint prints no
  claim id the check holds under either source.

  OQ-19: under a pin below 0.4.0, a request naming a `mint` member
  outside the ten types is refused as a type not opted in, as from
  0.4.0, where only the seven `ids` records are read.

  The reader B-078 needs is built: `0001-F16` B-001 is covered (item
  0390, done), so no dependency is open.

  Value 3: closes a gap where mint could print a claim id a native
  Feature already declares, and a below-0.4.0 path that mints for a
  name the check never reads. Risk 2: the guard gains one source of
  held ids beside the README, read through the check's own claim
  reader; the refusal joins B-002's existing path.

acceptance_criteria:
  - "B-078 - a claim candidate a native claim of the Feature already holds is not printed"
  - "B-041, B-070 - still hold under a `gherkin` claim source"
  - "B-079, B-080 - below 0.4.0, a request naming a `mint` member outside the ten types prints nothing and exits 4"
  - "§ 9 carries a row naming a test for each id above."

decisions:
