    2026-11-14, spec-author: cut on the repository owner's selections of
    2026-11-14, "(a) Adopt, item in 0.7.0" for OQ-21, and "Adopt default
    as answer" and "(a) Exit 4, not opted in" for OQ-19, relayed in
    session by the coordinating session. One item, spec-author's cut,
    not an owner ruling. OQ-19's request is two claims, B-079 and B-080,
    so each carries one assertion.

