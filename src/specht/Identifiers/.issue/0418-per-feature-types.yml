summary: |
  `decision`, `claim`, `constraint`, `openQuestion` and `scenario`
  ids for the Feature `--feature` names (A-7): the default size of 6
  (B-021), and the guard's per-Feature places, the Feature's
  `.spec/decisions/` file names, the first column of its
  `.spec/README.md` tables and its scenarios' tags (B-010, B-040 to
  B-042; C-18). A request without `--feature` writes nothing and
  exits 2 (B-057, B-058); a `--feature` folder that holds no
  Feature's `.spec/`, a legacy `epics/<epic>/<feature>/` folder
  among them, writes nothing and exits 4 (B-059, B-060).

  Risk 3: three readers of one Feature's files, each matching the
  check's reading of them.

  Was blocked on OQ-15 and OQ-16 until their 2026-11-10 answers,
  B-057 to B-060; `--feature` takes the folder, relative to the root,
  that holds a Feature's `.spec/` (A-7). Its prefixes are 0417's, the
  in-tree prefix of a type that names none (B-055), OQ-14's default
  until its 2026-11-10 answer.

acceptance_criteria:
  - "B-010 — the guard skips a claim id the Feature holds"
  - "B-021 — a per-Feature type with no size, 6 characters"
  - "B-040 — a `.spec/decisions/` file name held"
  - "B-041 — a claim, constraint or open question id held in a first column"
  - "B-042 — a scenario tag held"
  - "B-057 — no `--feature`, nothing on standard output"
  - "B-058 — no `--feature`, exit 2"
  - "B-059 — a folder holding no Feature, nothing on standard output"
  - "B-060 — a folder holding no Feature, exit 4"
  - "§ 9 carries a row naming a test for each id above."

