summary: |
  `specht mint <type> [--feature <dir>] [--root <dir>]` (A-2), a
  command folder `src/tool/Features/Mint/` (decision 0002) that
  parses, calls 0414's pipeline, prints the one id and folds a refusal
  into an exit code; it holds no strategy and no decorator (C-9). A
  type not opted in gets no id (C-2), and a manifest whose id settings
  its pin does not accept, or that opts in a type with no grammar,
  exits `3` (B-015, B-043). `--feature` is refused for `adr` and
  `lesson` whatever folder it names, so B-016 holds under every answer
  to OQ-16. `docs/cli.md` gains the command, as its test requires
  (`0002-F1`).

  Risk 2: a thin command; the hazard is writing anything but the id
  on standard output, or any file (C-1).

  Proceeds on OQ-11's recorded default: a refusal exits one of `2`,
  `3` and `4`, with the reason on standard error and no absolute path
  (C-10). Waits on 0414 alone.

acceptance_criteria:
  - "B-001 — a type not opted in, nothing on standard output"
  - "B-002 — a type not opted in, exit 2, 3 or 4 (OQ-11's default)"
  - "B-003 — one line, the id alone"
  - "B-004 — a printed id exits 0"
  - "B-015 — id settings the pin does not accept, exit 3"
  - "B-016 — `--feature` for adr or lesson, nothing on standard output"
  - "B-043 — an opted-in type with no grammar, exit 3"
  - "No absolute path in any output (AGENTS.md § Invariants)"
  - "B-005, B-006, B-008, B-019, B-020 — their scenarios bound through the command; § 9 rows Partial to Covered"
  - "B-047 to B-051 — their scenarios bound through the command, no id minted read as A-8 states; § 9 rows Partial to Covered"
  - "§ 9 carries a row naming a test for each id above."

