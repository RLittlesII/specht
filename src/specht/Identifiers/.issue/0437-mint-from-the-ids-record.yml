summary: |
  As a repository whose Features declare `claim_prefix: ACTIVITY`, I
  want `specht mint` to print claims such as `ACTIVITY-k3x9ab` and
  scenarios such as `ACTIVITY-SCENARIO-k3x9ab` for those Features from
  the type's `ids` record, so that every minted id is one the check
  accepts (decision 0005).

  Waits on 0436, which cuts schema `0.4.0` with the `ids` key, the claim
  grammar the check reads, and the shipped records B-074 relies on.

  Risk 3: the record read in place of the `mint` key and `identifiers`
  (C-19, C-21), the form or plain text a request takes (B-063, B-065,
  B-066), the claim request for a Feature with an invalid prefix
  (B-067), the guard reading a Feature's scenario tags (B-071), and the
  ids the check would read as the other type's tag (B-076, B-077). Value 4: the
  consumer need in § 2 row 5.

acceptance_criteria:
  - "B-063, B-065, B-066 — the head from the record's form or plain text, and the drawn id after it"
  - "B-002 from 0.4.0 — a type with no record, or whose record's `mint` names no strategy, gives no id and exits 4"
  - "B-009, B-011, B-012, B-043, B-055 as amended — held below 0.4.0"
  - "B-067, B-068 — validation against the record's id, and the plain text for every type in a Feature whose prefix `0001-F5` B-078 or B-100 reports"
  - "B-070, B-071 — the guard over first cells and scenario tags"
  - "B-072, B-073 — Nano ID size and Snowflake decoding after the head"
  - "B-074 — 0.4.0's shipped records admit every type's default draws"
  - "B-075 — exit 3 under the old settings or a prefix in a record's mint"
  - "B-076, B-077 — no scenario id the check would read as a claim tag, and no claim id it would read as a scenario tag; a claim under a longer scenario head, as `ACTIVITY-` and `ACTIVITY-SCENARIO-`, is printed"
  - "`docs/cli.md` and `docs/mcp.md` describe the ids record"
  - "§ 9 carries a row naming a test for each id above."

