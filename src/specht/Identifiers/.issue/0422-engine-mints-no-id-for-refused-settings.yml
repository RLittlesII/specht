summary: |
  The engine's refusals as item 0414 built them, in `Minter` and the
  `NanoIdStrategy` constructor, are behaviour no claim states, so § 7
  and § 8 disclose them as untested and PR 789's patch coverage fell
  short. This item states them as claims, B-047 to B-051, and pins
  each with an engine test: no id is minted for an entry naming no
  strategy or a strategy that does not exist, or for Nano ID
  settings, an alphabet or a size outside C-12's shape. A type not
  opted in is B-001's; its engine test is B-001's mechanism.

  Value 2: no new behaviour reaches a consumer; the refusals become
  agreed and tested, so a later item cannot drop one unseen. Risk 1:
  the claims state what the code on `main` does, so the work is tests
  over existing code.

  Waits on 0414 alone, done. The command's output and exit code for
  these requests stay with 0415 and 0416.

acceptance_criteria:
  - "B-047 — an entry naming no strategy, no id minted"
  - "B-048 — a strategy other than nanoid or snowflake, no id minted"
  - "B-049 — Nano ID settings not an object, no id minted"
  - "B-050 — an empty or non-string alphabet, no id minted"
  - "B-051 — a size not a positive whole number, no id minted"
  - "§ 9 carries a row naming a test for each id above."

