summary: |
  As an agent editing a manifest I want `specht manifest --defaults` to print the default the tool ships, so that I read every key's default without a repository at hand.

  The default is the `manifest.json` the tool embeds for the newest version it ships (A-3, decision 0002), not the output of `specht init --epics`, which is not built. No root is read: the output and the exit code are the same under a missing root, a missing manifest and a rejected one (B-009, B-010).

  Waits on 0284: the option is on that command.

