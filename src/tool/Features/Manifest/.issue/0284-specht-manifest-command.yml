summary: |
  As a maintainer I want `specht manifest` to print the effective manifest as text, so that I see every value the check reads, the omitted ones too.

  The command parses, calls the engine of 0283 and folds the result into an exit code (C-4). The text form is B-020: the document `--json` prints, indented, in the default manifest's key order, derived by spec-author on OQ-1's default. The exit codes are the check's (C-5).

  Waits on 0283: the command prints what the engine produces.

