summary: |
  As a coding agent I want `specht facts <path>` to give the facts of one specification, or of every specification under a directory, so that I ask about the Feature I am working in.

  A directory selects by whole path segments, OQ-4's default; OQ-4 stays open in § 11. A path selecting nothing writes nothing on stdout and exits `4` (B-020). The argument changes the help, so `docs/cli.md` changes with it (`0002-F1`).

  Waits on 0364: the command the argument is on.

