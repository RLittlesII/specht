  The line shape is OQ-5's default: one tab-separated line per fact, carrying path, kind, id, line and text, as `0001-F10` decision 0002 lists the rules. OQ-5 stays open in § 11.

  Waits on 0365: claims and constraints are lines. Waits on 0366: § 5 rows and open questions are lines.

