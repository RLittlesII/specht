summary: |
  As a coding agent I want each Feature's § 3 claims and § 4 constraints in the facts, with their text, status and line, so that I learn where a claim stands without reading the Markdown.

  The claims and constraints are found as the check finds them (C-1); the constraints table's headers are the engine's (C-7). A withdrawn claim and two claims sharing an id are still given, and the command exits `0` on a tree the check fails (B-012, B-013). The members join the document and its schema by addition (C-3).

  Waits on 0364: the command and the document it adds members to.

