summary: |
  The packed `specht.tool` names no repository, author, licence or
  description and carries no readme or icon. The repository owner,
  2026-10-11: "Can we make tool "release ready" so when it hits a package
  manager it has all the README.md and stuff a good package should have?"
  The list is spec-author's proposal on that delegation (decision 0007);
  B-018 and B-019 answer 0055-F6 OQ-11, which must hold before item 0084's
  tag. Waits on 0171: every test here opens the package by its id.

  Value 4: the first release's package page, and what ties the package and
  the binary in it to the repository and a commit. Risk 3, re-scored
  2026-10-11 from 2: B-032 holds only for a build made as a runner makes
  it, and its test has to make one on a developer's machine.

  The description, and the opening line of `src/tool/README.md`, read
  "A dotnet tool that checks a repository's specification documents against
  a versioned schema." (owner, 2026-10-11; B-024, B-034). The repository
  `README.md` keeps its own tagline and is not this item's.

  Expected files: `src/tool/tool.csproj` (the settings and the two packed
  files; no version, C-5); `src/tool/README.md`, new, the readme written for
  the package (C-9, C-10) - it carries no frontmatter, because a package page
  would print it; `AGENTS.md` § Documentation structure, naming that file
  beside `README.md` as exempt; `.assets/logos/specht-book-avatar.png`,
  packed as it is and not changed (OQ-1); the tests for B-018 to B-029 and
  their step definitions, which may pack the way
  `test/acceptance/PackageVersioning/PackageVersioningSteps.cs` does; § 6 to
  § 9 of the specification by their owners. `Directory.Build.props` where a
  setting has to reach the engine's project as well as the tool's (B-030 to
  B-032 are about both assemblies).

