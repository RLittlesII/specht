summary: |
  The packed `specht.tool` names no repository, author, licence or
  description and carries no readme or icon. The repository owner,
  2026-10-11: "Can we make tool "release ready" so when it hits a package
  manager it has all the README.md and stuff a good package should have?"
  The list is spec-author's proposal on that delegation (decision 0007);
  B-018 and B-019 answer 0055-F6 OQ-11, which must hold before item 0084's
  tag. Waits on 0171: every test here opens the package by its id.

  Value 4: the first release's package page, and what ties the package to
  the repository. Risk 2: settings in one project file, two packed files and
  one new document; the commit in the package depends on how the SDK and
  Nerdbank.GitVersioning record it.

  Expected files: `src/tool/tool.csproj` (the settings and the two packed
  files; no version, C-5); `src/tool/README.md`, new, the readme written for
  the package (C-9, C-10) - it carries no frontmatter, because a package page
  would print it; `AGENTS.md` § Documentation structure, naming that file
  beside `README.md` as exempt; `.assets/logos/specht-book-avatar.png`,
  packed as it is and not changed (OQ-1); the tests for B-018 to B-029 and
  their step definitions, which may pack the way
  `test/acceptance/PackageVersioning/PackageVersioningSteps.cs` does; § 6 to
  § 9 of the specification by their owners. `Directory.Build.props` only if a
  setting has to apply before the project file is read.

acceptance_criteria:
  - "B-018 — the repository"
  - "B-019 — the commit"
  - "B-020 — the project page"
  - "B-021 — the licence expression"
  - "B-022 — the author"
  - "B-023 — the copyright notice"
  - "B-024 — the description"
  - "B-025 — the readme, named and carried"
  - "B-026 — no relative link or image in the packed readme"
  - "B-027 — the icon, named and carried"
  - "B-028 — the tags"
  - "B-029 — the release notes"
  - "C-9, C-10 — the packed readme is its own file, gives the commands, and links to the install document without restating the feed, the source entry or the token."
  - "`./build.sh Pack` still writes exactly one file (0055-F1 B-009), with the computed version (0055-F5 B-005)."
  - "§ 9 carries a row naming a test for each id above."

decisions:
