  - "B-034 — the packed readme opens with the description"
  - "B-035 — the packed readme links to the install document"
  - "B-036 — no feed address in the packed readme"
  - "C-11 — the debug information is a file beside each assembly, inside the one package."
  - "`./build.sh Pack` still writes exactly one file (0055-F1 B-009), with the computed version (0055-F5 B-005)."
  - "§ 9 carries a row naming a test for each id above."

decisions:
  - |
    2026-10-11, spec-author, on the owner's delegation: the list, this
    Feature as its owner, and a readme written for the package over packing
    the repository's `README.md` with absolute links. Recorded in the spec's
    decision 0007 with what was rejected.
  - |
    2026-10-11, spec-author: OQ-1 to OQ-4 are open and the owner was not
    asked; each is built as its proposed default and none blocks this item.
    OQ-3 builds nothing.
  - |
    2026-10-11, the repository owner, on OQ-3: "OQ-3 source link and
    deterministic CI build => yes. this will tie a version of my binary to
    a git commit? Yes please!" B-030 to B-032 and C-11 join this item
    (decision 0008). The line above on OQ-3 is superseded.
  - |
    2026-10-11, the repository owner, on the description: "`.spec/` tree =>
    specification documents", and of the repository README, "tagline
    stays". B-024 amended; B-034 added.
  - |
    2026-10-11, spec-author, on notes from the test-writer: B-035 and B-036
    replace the criterion that cited C-9 and C-10, which no test held.
    OQ-5 and OQ-6 are open at their defaults and block nothing here.

