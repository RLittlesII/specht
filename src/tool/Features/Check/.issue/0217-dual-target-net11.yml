summary: |
  `specht.tool` carries the tool for `net10.0` and for `net11.0`, on the
  owner's decision of 2026-10-14 (decision 0011). As ratified and widened
  the same day (decision 0011's addendum), `Directory.Build.props` builds
  every project for both; `.build` alone keeps `net10.0`, which NUKE
  requires. `global.json` pins the .NET 11
  release candidate 2 SDK, `11.0.100-rc.2.26504.105`, with prerelease SDKs
  allowed, and continuous integration installs it and `10.0.401`.

  Waits on nothing. Value 3: consumers on .NET 11 get a native build
  while the long-term-support target stays. Risk 2: a release-candidate
  SDK, every multi-targeted test project running twice, and test modules
  run one at a time because the acceptance tests pack the solution once
  per run and two packs together collide.

  Expected files: `Directory.Build.props`, `test/Directory.Build.props`,
  `global.json`, `.build/` and the regenerated workflows; the step
  definition for B-045 in `test/acceptance/Check/PackageSteps.cs`; § 6 to
  § 9 of the specification by their owners; `0055-F6` § 7 by its owner.

  After .NET 11 general availability, 2026-11-10, `global.json` moves from
  the release candidate to the released SDK. That bump may need a pull
  request by hand: the dependency bot may not propose a release candidate
  to release move.

