decisions:
  - |
    2026-10-14, the repository owner (decision 0011): dual target
    `net10.0` and `net11.0`, on the release candidate 2 SDK, with the
    project scope above. Rejected by the owner: a chore exemption in place
    of a claim. Rejected in decision 0011: `net11.0` alone, which is
    ADR-0009's separate gate 3, and every project on both targets.
  - |
    2026-10-14, spec-author: id `0217` taken above `.issue/.sequence` on
    `main`, `0216`; no open pull request holds an id.
  - |
    2026-10-14, implementer: `.performance/benchmarks` builds for both
    targets too, beyond the summary's scope. `test/tests` references it,
    and its `net10.0` runtime configuration for the tool overwrote the
    `net11.0` one in the `net11.0` test output. The `Benchmark` target
    still builds and runs `net10.0`. Owed to spec-author and the owner for
    ratification (`0001-F2` § 7, "Two target frameworks").
  - |
    2026-10-14, the repository owner (decision 0011, addendum): the
    `benchmarks` deviation above is ratified, and the scope widened: "put
    it in the directory props so _all_ the things do it".
    `Directory.Build.props` sets `TargetFrameworks` `net10.0;net11.0` for
    every project and selects none by name; `SpechtMultiTarget` is gone.
    `.build` alone sets `net10.0`: measured, NUKE's static constructor
    rejects a two-target build assembly, whose targets share one
    `bin/Debug/`, and refuses a suffixed one. It stays `net10.0` and not
    `net11.0` because `test/acceptance` and `test/build.tests` reference it
    and build for both. The `Benchmark` target still builds and runs
    `net10.0`. Full `./build.sh` green on both targets, 2026-10-14.
    Rejected in the decision's original text, now superseded: every project
    on both targets.
  - |
    2026-10-14, spec-author: the cross-project references that let the
    benchmarks' target break the tests' output are item `0218`.

