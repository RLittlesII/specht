summary: |
  The default command: resolve the root, call the runner, print each
  violation as `<path>(<line>): <severity> SPEC###: <message>` on stdout,
  and fold the report into exit 0 or 1, or 1 on any violation under
  `--strict`. Exit codes are named constants returned, never thrown (C-2); a
  command parses, runs and folds and nothing else (C-4). Every other Check
  item hangs off this one.

