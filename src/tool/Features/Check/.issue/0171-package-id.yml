summary: |
  `src/tool/tool.csproj` sets `<PackageId>tool</PackageId>`, so `Pack` writes
  `tool.<version>.nupkg` and the release workflow's push line names that
  file, where C-5 and every document give `specht.tool`. The value arrived
  in commit `a62689f`; no tag has been pushed, so nothing was published under
  it. How it passed every gate is lesson 0001. The repository owner,
  2026-10-11: "fix package id and repository".

  Value 5: the first release (`0084`) would publish under the wrong name, and
  a published version stays. Risk 1: one literal in four files and one
  regenerated workflow.

  Expected files: `src/tool/tool.csproj`; `.build/SpechtBuild.Publish.cs`
  (the push line) and `.build/SpechtBuild.cs` (the comment over `Pack`);
  `.github/workflows/publish.yml`, regenerated by `./build.sh Compile` and
  never edited by hand, with its step order diffed;
  `test/acceptance/PackageVersioning/PackageVersioningSteps.cs` (the file and
  entry names it expects); `test/acceptance/Build/BuildSteps.cs` (the unbound
  fixture and its two expectations); the test for B-017 and its step
  definitions; § 7, § 8 and § 9 of the specification by their owners.

acceptance_criteria:
  - "B-017 — the packed package's id"
  - "`./build.sh Pack` writes exactly one file, `specht.tool.<version>.nupkg` (0055-F1 B-009)."
  - "The generated `publish.yml` pushes `specht.tool.<version>.nupkg`, as 0055-F6 § 7 quotes it; `ci.yml` and `renovate.yml` regenerate with no difference."
  - "No file under `src/`, `test/`, `.build/` or `.github/` names the package `tool`."
  - "The `@B-005` scenario of 0055-F5 passes against the corrected name."
  - "Constraints preserved: 0001-F2 C-5, 0055-F6 C-4"
  - "§ 9 carries a row naming a test for each id above."

decisions:
  - |
    2026-10-11, spec-author: a specification gap exists, so the fix ships
    lesson 0001 (`src/tool/Features/Check/.spec/lessons/`) and B-017. The id
    was stated by a constraint and by a claim whose scenario does not run.

out_of_scope:
  - "What else the package says about itself — B-018 to B-029, item 0172."
  - "Pushing a tag — 0055-F6 C-2, item 0084."
  - "Running `build.feature` again — 0055-F1 § 8, the owner's standing decision."
