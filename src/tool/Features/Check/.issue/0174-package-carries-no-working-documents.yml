summary: |
  The packed tool carries 134 of this repository's working documents, under
  `content/` and `contentFiles/`: every `.spec/` Markdown file, `.feature`
  file and `.issue/` item under `src/tool`, a 311 KB specification among
  them (lesson 0002). `Directory.Build.props` declares the three globs as
  content of every project, and `src/tool` packs. Found by test-writer,
  2026-10-11; B-033 is spec-author's derivation from the owner's "release
  ready", not the owner's words.

  Its own item, not part of 0172: a different cause in a different file,
  present since commit `254aabc`, and a fix that touches what every project
  declares. Value 4: the first published package stays as published. Risk
  2: the declarations may be there so an editor lists the files; nothing in
  the build reads them, and the commit that added them says nothing.

  Expected files: `Directory.Build.props` or `src/tool/tool.csproj`,
  whichever the implementer chooses; the test for B-033 and its step
  definitions; § 7 to § 9 of the specification by their owners.

acceptance_criteria:
  - "B-033 — no specification, scenario or work-item file in the package"
  - "The package carries no `content/` or `contentFiles/` entry that B-025 and B-027 do not account for."
  - "The embedded schema set and templates still ship: `specht init` writes them as before (0001-F4)."
  - "The acceptance and unit tiers find every file they copy to their output today."
  - "§ 9 carries a row naming a test for each id above."

decisions:
  - |
    2026-10-11, spec-author: B-033 constrains what is packed, not how the
    files are declared (§ 5 #21). Removing the three declarations and
    keeping them out of the pack both satisfy it; the choice is the
    implementer's, recorded in § 7.

out_of_scope:
  - "What the package says about itself — B-017 to B-032, items 0171 and 0172."
  - "The readme and the icon the package does carry — B-025, B-027, item 0172."
