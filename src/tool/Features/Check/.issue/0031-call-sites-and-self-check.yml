summary: |
  Once 0001-F5's rule settings exist, prove that a shell, `./build.sh
  Specht` and the pre-commit hook print the same lines and exit with the
  same code on one root, and that the self-check exits with the command's
  code on this repository's tree. Before then B-010 and B-011 do not apply:
  0055-F1 B-025 and C-7 govern the exit code (C-8, decision 0004). 0061
  points `Specht` at the command — through `dotnet run --project
  src/specht.tool -- --root .` until a package exists (A-2) — and 0062 adds
  the hook's call and the gate, so this item waits on 0062 and builds no
  wiring of its own. Risk 3: Nuke and husky together, and the one test
  allowed to read this repository's real tree (C-7).

