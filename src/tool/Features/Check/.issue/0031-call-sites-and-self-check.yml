summary: |
  Once 0001-F5's rule settings exist, prove that a shell, `./build.sh
  Specht` and the pre-commit hook carry the command's lines and exit with
  the same code on one root (B-010 as amended by decision 0012, the root
  carrying this repository's source, A-4), and that the self-check exits
  with the command's code on this repository's tree. Before then B-010 and
  B-011 do not apply: 0055-F1 B-025 and C-7 govern the exit code (C-8,
  decision 0004). 0061 points `Specht` at the command — through `dotnet run
  --project src/specht.tool -- --root .` until a package exists (A-2) — and
  0062 adds the hook's call and the gate, so this item waits on 0062 and
  builds no wiring of its own. Risk 3: Nuke and husky together, and the one test
  allowed to read this repository's real tree (C-7).

acceptance_criteria:
  - "B-010 — with rule settings: shell, Specht and pre-commit carry the command's lines and give the same code"
  - "B-011 — with rule settings: `./build.sh Specht` runs the command on the repository root and exits with its code"
  - "§ 9 carries a row naming a test for each id above."

