summary: |
  As a maintainer I want `specht rules` to print the listing as plain text, so that I choose a level for a rule before a violation introduces it.

  The command parses, calls the engine of 0280 and folds the result into an exit code (C-4). It also registers `rules` as a branch whose default command is the listing, so that `0001-F11`'s set command (0288) can hang under it as `specht schema pin` hangs under `schema` (`src/tool/Features/Schema/SchemaRegistration.cs`); that is design, not a claim.

  The text form is B-019, derived by spec-author on OQ-2's default. The no-manifest case is B-013 on OQ-1's default.

  Waits on 0280: the command prints what the engine reads.

acceptance_criteria:
  - "B-011 — exit `0` whatever the levels"
  - "B-012 — missing root: `2`, stdout empty"
  - "B-013 — no manifest: `2`, stdout empty"
  - "B-014 — rejected manifest: `3`, stdout empty"
  - "B-015 — stdout carries only the listing"
  - "B-016 — a run writes nothing"
  - "B-017 — no derived path absolute"
  - "B-018 — same input, same output"
  - "B-019 — one tab-separated line per rule"
  - "§ 9 carries a row naming a test for each id above."

