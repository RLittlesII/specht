summary: |
  As the `specht rules` command I want the engine to give me one entry per rule id of the pinned version, so that the command prints a listing and holds no catalogue of its own.

  An entry is the id from the version's vocabulary, the family and default severity from the rule page, and the effective level from the manifest the check's loader produced: the manifest's level, else the level of the rule's own severity (`0001-F5` B-044). Entries come in ordinal rule-id order and include rules set to `off`. The listing is read when it is asked for; no second list of ids, families or severities is kept (C-2).

  `0283` also reads the effective level, so the seam is shared.

acceptance_criteria:
  - "B-001 — one entry per rule id, no other"
  - "B-002 — the rule page's family"
  - "B-003 — the rule page's default severity"
  - "B-004 — the manifest's level is the effective level"
  - "B-005 — no manifest level: the rule's own severity"
  - "B-006 — an `off` rule still has its entry"
  - "B-007 — agrees with what `--explain` prints"
  - "B-008 — ordinal rule-id order"
  - "§ 9 carries a row naming a test for each id above."

