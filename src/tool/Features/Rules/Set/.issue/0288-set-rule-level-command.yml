summary: |
  As a maintainer I want one command that sets one rule to `error`, `warning` or `off`, refused when the rule or the level is wrong, so that the manifest changes where I meant.

  The command is registered under the `rules` branch (A-1 reading (a)), which 0281 creates. If the owner picks another name for OQ-1, this dependency is revisited. The command parses, calls the engine of 0287 and folds the result into an exit code (C-7). The root and manifest are validated before the rule id and the level, so `2` or `3` wins over `4` (decision 0002; `0001-F7` B-111). Writes only the manifest (B-006).

  Waits on 0287 for the edit and on 0281 for the branch.

acceptance_criteria:
