summary: |
  `specht trace --report <path>` writes the document `--json` writes to
  that path, creating its directories and replacing a file that
  exists, keeps the trace lines on stdout and the exit code unchanged,
  and the path and the directories above it are the only things the
  trace writes. The contract is the check's (`0001-F3` B-003, B-004,
  B-022 to B-025, C-5, C-7), built by item 0036, done.

  Waits on 0442, the document the file holds.

  Risk 2: the check's `--report` writer exists; the trace reuses it.

