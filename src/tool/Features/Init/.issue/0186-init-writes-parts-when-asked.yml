    same day (decision 0004). Apart from 0185 because it changes what a
    run writes and 0185 changes only where; after it because the
    selection is stated over the new paths. The risk is spec-author's
    estimate. B-034, no fetch without the schemas, is cut to 0095, where
    the fetch is built.
  - |
    2026-10-11, spec-author, after review: B-018, B-020 and B-023 left
    `claims`. Each needs `--epics` or a manifest declaring no epic
    grammar, which no item builds (0001-F5 OQ-18), and 0052 and 0053
    delivered none of them. B-019 stays: it is the run without `--epics`.
    Rejected: leaving the epic frontmatter schema in the schemas part as
    built, which A-1 and B-030 do not allow. The sentence that this item
    must merge before the first release is replaced by the edge that
    exists.

