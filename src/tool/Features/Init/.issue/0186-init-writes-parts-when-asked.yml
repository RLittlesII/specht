summary: |
  The repository owner, 2026-10-11 (decision 0004): "the init needs
  flags. not everyone will want the templates. not everyone will want all
  the things." A bare `specht init` writes only the manifest; `--schemas`
  adds the frontmatter schemas, `--templates` adds the templates, and
  `--all` is `--schemas --templates`.

  B-029 to B-033 are new. B-006, B-010 and B-011 are amended claims that
  0052 and 0053 delivered when every run wrote every file; this item
  brings them to the selection. B-019 is new to an item: nothing built
  it. It needs no `--epics` option, only that the epic frontmatter schema
  is out of the selection in a root with no manifest (A-1).

  `--epics` is not built by this item and has no item (0001-F5 OQ-18).
  B-018, B-020 and B-023 are therefore not claimed; the criteria state
  the part of each that holds without it. Until B-021 is delivered the
  manifest a bare `init` writes still declares the epic grammar, so a
  second run with `--schemas` beside it writes the epic frontmatter
  schema (B-010, C-6).

  Risk 2: three options on one built command, and the write beneath them
  exists. The first publish is item 0084. It waits on 0095, and this
  change makes 0095 wait on this item.

acceptance_criteria:
  - "B-029 — bare init into a root with no `.specht/` folder writes only the manifest"
  - "B-030 — `--schemas` writes the manifest and the Feature and item frontmatter schemas, no template"
  - "B-031 — `--templates` writes the manifest and the four templates, no schema"
  - "B-032 — `--all` leaves the same files with the same content as `--schemas --templates`"
  - "B-033 — stdout names no file outside the run's selection"
  - "B-019 — `--all` into a root with no `.specht/` folder writes the manifest, the Feature and item frontmatter schemas and the four templates, and no epic frontmatter schema"
  - "B-006 — stdout lists each file of the selection, root-relative, written or skipped"
  - "B-010, B-011 — beside an existing manifest, each absent file of the selection is written, exit 0"
  - "B-020, not claimed — exit 0 for no option, `--schemas`, `--templates` and `--all`; the rows with `--epics` wait on that option"
  - "B-018, B-023, not claimed — each needs `--epics` or a manifest declaring no epic grammar"
  - "C-7 — no option removes the manifest from the selection"
  - "The documents that state what `init` writes say it for the selection: `docs/cli.md` and the tool's help (0002-F1), `README.md`, `docs/setup.md`, `docs/configuration.md`, `src/tool/README.md`, `.claude/skills/specht-conventions/references/specs.md`, and AGENTS.md § Configuration and § CLI, which no longer say the options wait on this item"
  - "§ 9, re-stated by test-writer: the rows for B-006, B-010 and B-011 name tests that hold for the selection, not for `the eight files`, and B-019 and B-029 to B-033 each carry a row naming a test"

decisions:
