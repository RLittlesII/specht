summary: |
  Init beside what already exists: an existing file is left byte-for-byte;
  beside a manifest pinning an older shipped version, the absent files are
  written at that version, keeping one version in `.specht/`; beside a pin the
  tool does not ship, init writes nothing and exits 3, as the check does.
  Depends on 0042 because writing an older version needs the embedded
  version set, and on 0120 because the pin it reads against that set is
  `major.minor.patch` once 0120 converts it.

acceptance_criteria:
  - "B-002 — an existing file left byte-for-byte"
  - "B-012 — older shipped pin: absent files at the pinned version; exit 0"
  - "B-013 — unshipped pin: versions on stderr, nothing written, exit 3"
  - "§ 9 carries a row naming a test for each id above."

decisions:
  - |
    2026-10-08, the repository owner: OQ-1 resolved — (a) no version
    argument, (b) write absent files at the pinned version, (c) refuse with
    exit 3. Rejected: a `--version` option; writing at the newest beside an
    older or unshipped pin. The spec gained B-012 and B-013 for (b) and (c);
    both land here beside B-002. Status moved from blocked to
    ready-for-architecture.
  - |
    2026-10-09, spec-author, at the spec-reviewer's request (0001-F7
    § 12, item cut of 2026-10-09): `0120` added to `depends_on`. 0001-F7
    decision 0005 makes the pin `major.minor.patch`; on 0042 alone this
    item could start beside 0120 and be built on the integer pin.
    Rejected: replacing the 0042 edge, which is still what ships the
    version set.
  - |
    2026-10-11, spec-author, after the repository owner's ruling of the
    same day (decision 0004): `0186` added to `depends_on`. B-002 now holds
    "whatever the run's selection" and B-012 writes the absent files of
    the selection, so neither can be proven before the part options exist.
    The summary's folder is `.specht/` (ADR-0011).

  - |
    2026-10-14: the pre-commit hook's fresh staged-tree restore rejected the
    existing System.Security.Cryptography.Xml and Pkcs 9.0.20 dependencies
    with NU1902/NU1903. The existing central Xml pin moves to 9.0.21, the
    patched version on the same release line, to unblock delivery without
    suppressing the audit. No .feature change is needed for this dependency
    bump; constraints preserved: 0001-F4 C-1, C-3, C-4 and C-7. Advisory:
    https://github.com/advisories/GHSA-c399-9853-6jmj

