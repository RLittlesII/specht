summary: |
  Init's side of 0001-F7 decision 0004: an absent frontmatter schema comes
  from the recorded upstream source, verified against its hash, and a
  present one is never overwritten (C-1, B-002). Builds the fetch and
  the hash check, which upgrade's 0093 reuses, and makes no network call
  when nothing asks for one (B-027). On the first release's path
  (0055-F6 C-8). Risk 4: the first network path in a tool that is
  otherwise offline (0001-F7 C-8), in the first command a consumer
  runs. Where the fetch lives and how a test reaches it without the
  network is 0001-F7 OQ-39, the implementer's.

acceptance_criteria:
  - "B-014 — fetched content matches: absent schema files written, present ones kept"
  - "B-015 — fetched content mismatches the hash: stderr, nothing written, exit 3"
  - "B-016 — source unreachable for an absent file: stderr, nothing written, exit 3"
  - "B-027 — no upstream source recorded, or a root with no manifest and no option but those B-027 names: no network call"
  - "B-034 — a recorded source and the schemas not in the selection: no network call"
  - "§ 9 carries a row naming a test for each id above."

decisions:
