summary: |
  The command `specht frontmatter --kind <kind> (<path> | --stdin)
  [--root <dir>]` (A-1), a Spectre.Console.Cli command in
  src/tool/Features/Frontmatter/, which, in B-027's order, parses; checks
  the usage (B-026); parses the kind through the engine (B-020); reads
  the document from the path, or from standard input whole (B-021,
  B-002); calls the entry point 0233 adds; prints each violation as the
  check's line and then the count line; and folds the result and each
  failure into the check's exit codes (C-5, C-6), with the usage failure
  handled in the command rather than by the library's validation so the
  library's -1 never surfaces (B-026).

  It also carries, in the same pull request, what 0002-F1 holds the
  documentation to: the docs/cli.md section and the readme synopsis lines
  (0002-F1 C-5, C-8), the exit-code page rows, and the AGENTS.md command
  block.

  Tests: integration tier for the command through the in-process command
  tester, and the acceptance scenarios for every claim of this Feature,
  including the @B scenarios 0233's claims bind here, with the test
  launcher gaining a way to feed standard input.

  Risk 3: the usage failure crosses the command-line library's own
  validation path; standard input is fed to a child process in the
  acceptance tests; the documentation test fails until the section
  exists.

  Waits on 0233: the command calls the engine entry point that item adds.

