summary: |
  As the maintainer writing an issue, I want the frontmatter of an issue
  body checked against the schema for its kind before I post it, and as
  the CI step that relays an issue, I want the check's diagnostic lines
  and exit codes for that one document, so that frontmatter that is not
  in the tree gets the verdict the check would give it (§ 2 rows 1 and 3).

  Risk 3: the command and the check must reach one verdict on one
  frontmatter through one reader, one schema selection and one rule
  (C-2), which means an engine seam the check also uses; the engine's
  frontmatter rule runs over a whole model today and must also judge one
  document; standard input is read whole; and the usage failure (B-026)
  must bypass the command-line library's own validation so its -1 never
  surfaces.

  The first child is 0230, the engine seam that checks one document's
  frontmatter, named by a kind, against the schemas the check selects for
  a root (B-003 to B-009, B-013, B-025). The second is 0231, the command,
  its documentation and the acceptance scenarios for every claim of this
  Feature (B-001, B-002, B-010 to B-012, B-014 to B-024, B-026, B-027),
  which waits on 0230.

