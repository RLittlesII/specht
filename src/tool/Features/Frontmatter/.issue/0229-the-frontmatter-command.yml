decisions:
  - |
    2026-10-15, spec-author: value 3 follows the specification's
    priority: med, as item 0224 took value 3 from priority: med, item
    0082 value 3, and item 0010 value 4 from priority: high (commit
    621f3e08). Risk 3 on the basis in the summary.
  - |
    2026-10-15, spec-author: 0230, the engine seam, is cut first because
    C-5 forbids frontmatter reading or schema evaluation in the command
    and C-2 forbids a second reader, so the engine must expose checking
    one document before the command exists. Rejected: one item for both,
    which would put the engine change and the command, two projects, two
    test tiers and the documentation, in one pull request.

