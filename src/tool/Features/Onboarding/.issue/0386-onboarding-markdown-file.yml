summary: |
  `specht onboard` writes the report as a Markdown file at the path
  `--output` names, with the same complete set of findings the terminal
  shows (decision 0002).

  Risk 2: one write into the consumer's tree, the caller-named file and
  nothing else (C-3; AGENTS.md § "Invariants"); the file and the terminal
  must not drift apart, so both come from the one check result (C-1).

  Waits on 0385: the file holds what that command prints from one check run.

acceptance_criteria:
  - "B-003 — the same complete findings in the terminal and the Markdown file"
  - "B-007 — exit 0 once the file is written, whatever the check found"
  - "B-010 — a write the file system refuses: the reason on stderr, nothing on stdout, exit 4"
  - "B-014 — missing directories above `--output` created"
  - "B-015 — an existing file at `--output` replaced"
  - "B-016 — a relative `--output` resolved from the working directory"
  - "B-017 — a request that exits 2 or 3 leaves no file, removing an earlier one"
  - "B-018 — a request that exits 2 or 3 creates no directory"
  - "OQ-6 resolved and its answer claimed before this item is done."
  - "Writes only the file at `--output` (C-3); no absolute path in it (C-4)."
  - "§ 9 carries a row naming a test for each id above."

