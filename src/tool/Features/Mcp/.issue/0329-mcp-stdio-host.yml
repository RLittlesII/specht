summary: |
  As a maintainer configuring an MCP client I want one entry that runs `dotnet specht mcp`, so that every agent in the repository reaches the tool version the repository pinned, with no terminal session.

  The command is inside `specht.tool` (OQ-1, OQ-2), composed by the one factory (C-4), and gets its `docs/cli.md` section (C-7). It serves no answer of its own (C-5): it delivers in one pull request with 0330, so no host item is done while the host serves nothing (epic `0132` § Features, candidate B).

acceptance_criteria:
  - "B-001 — one configuration entry completes the handshake"
  - "B-002 — standard input and output only"
  - "B-003 — no listening port"
  - "B-004 — no outbound call"
  - "B-005 — stdout carries only protocol messages"
  - "B-006 — the stated version is `--version`'s"
  - "B-007 — no package beyond `specht.tool`"
  - "B-008 — a session writes nothing"
  - "B-009 — the root from `--root` or the working directory"
  - "B-010 — a root that is not a directory exits `2`"
  - "B-011 — a missing or rejected manifest still starts"
  - "B-012 — closed input exits `0`"
  - "B-013 — help names the options"
  - "B-014 — protocol revision negotiation"
  - "C-7 — the command's section in `docs/cli.md`, held to the help"
  - "§ 9 carries a row naming a test for each id above."

