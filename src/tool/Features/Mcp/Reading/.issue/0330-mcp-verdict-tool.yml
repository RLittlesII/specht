  - "B-002 — no argument names a specification or a path"
  - "B-011 — violations are not an error"
  - "B-013 — each answer under each of two pins"
  - "B-015 — an edit between two calls is in the second answer"
  - "B-016 — a call writes nothing"
  - "B-017 — only tools B-001 to B-009 name"
  - "B-019 — each tool is named for the command it serves: `check` for the verdict; the same test holds 0331's `explain`, `rules` and `manifest`"
  - "§ 9 carries a row naming a test for each id above."

