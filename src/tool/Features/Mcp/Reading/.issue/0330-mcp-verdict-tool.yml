summary: |
  As a coding agent I want the check's verdict for the whole tree through MCP, byte for byte what `specht --json` prints, so that I stop scraping the command's output.

  The first tool, and the answer rules every later tool inherits: the pin, a fresh read at each call, no write, and only answers the command line gives. Tool names are working names (§ 11 OQ-7); the answers are tools only (§ 11 OQ-4).

  Waits on 0329, the host, and on 0359, which finds the pinned tool each answer runs. 0329, 0359 and 0330 deliver in one pull request, so no host item is done while the host serves nothing (epic `0132` § Features, candidate B).

  The host is a program of its own that relays the pinned `specht`'s output (ADR-0031); the answers stay byte for byte the command's, and the host's unpinned report is a separate part of the result (`0132-F3` B-024; this Feature's A-4).

acceptance_criteria:
