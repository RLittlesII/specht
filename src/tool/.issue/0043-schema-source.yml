summary: |
  The embedded set is the default without a recorded upstream source.
  The manifest key schemaSource or --schema-source selects the frontmatter
  schemas under .specht/schema/frontmatter/ only (C-4); decision 0011 owns
  the names, CLI precedence, compatibility and controlled disk failures.
  The report carries the selected provenance. Manifest's 0017 loads the
  on-disk files by
  their manifest names once this selects disk. Waits on 0120: the
  version the report names beside the source is `major.minor.patch`
  (decision 0005).

