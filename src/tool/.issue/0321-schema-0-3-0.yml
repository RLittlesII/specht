summary: |
  As a maintainer whose reviewer approves a specification before its
  tests exist, I want `SPEC060` to report a § 9 `Missing` row once the
  Feature is done, not once it is approved, so that an honest approval
  passes and a done Feature with an untested claim fails (decision
  0015).

  The change is a new schema version, `0.3.0` (decision 0015 call 7),
  made through 0189's cut target (B-094 to B-100; decision 0009), locked
  through 0188's, and relocked only as decision 0014 allows. `0.1.0` and
  `0.2.0` keep the approved axis (B-120; C-1). Risk 4: once a package
  carries `0.3.0` it is never changed in place (C-1, C-17).

  Proceeds on the defaults of OQ-60 (the change is `0.3.0`, not a
  `0.2.0` relock) and OQ-56 (this repository's live copy moves by hand
  in the same change). The `done` marker the rule compares is
  `0001-F5` B-063 and B-064, which no item carries yet.

  It delivers `0001-F7` claims and has no parent, as 0124 has none:
  under 0041 the queue would rank it with 0041 in milestone 0.3.0.
  Value 4, the one it inherited from 0041, since an item with no parent
  inherits none.
  B-118 to B-124 are this item's alone and not in 0041's `claims`, so
  0041 closes in 0.3.0 while this item stays open in 0.4.0.

