  - "B-119 — `0.3.0`, status not done: nothing reported, any `spec_status`"
  - "B-120 — `0.1.0` or `0.2.0`: the approved axis, unchanged"
  - "B-121 — `0.3.0`: the fixed message naming the done status"
  - "B-122 — `0.3.0`: `SPEC061` still follows approval"
  - "B-123 — `0.3.0`: `SPEC060` keeps its id and error severity; no new id"
  - "B-124 — `0.3.0`'s feature template: the § 9 guidance text"
  - "§ 9 carries a row naming a test for each id above."

