summary: |
  `specht upgrade`: rewrite the three frontmatter schemas and the
  templates the manifest does not name as the consumer's (decision 0006;
  no key names one until 0130) with the pinned version's, whether the files were at an older
  version or a newer one, writing only `.specht/manifest.json` and under
  `.specht/schema/frontmatter/` and `.specht/templates/` (C-2) and never moving `schemaVersion` (C-13); when
  the root already holds what it would write, say so and write nothing.
  Risk 4: the first command that writes into a consumer's tree. Waits on
  0120 for the semver pin it reads. Manifest keys and printing what
  changed are 0047; moving the pin is 0122.

acceptance_criteria:
  - "B-005 — schemas, and the templates the manifest does not name, rewritten to the pin, from older or newer; exit 0"
  - "B-006 — already at the pin, a named template apart: says current, rewrites nothing, exit 0"
  - "B-007 — nothing but the manifest, the frontmatter schema folder and the templates folder touched"
  - "B-052 — `schemaVersion` unchanged"
  - "§ 9 carries a row naming a test for each id above."

decisions:
  - |
    2026-10-09, the repository owner (decision 0005): re-cut from "move
    one version" to "bring the files to the pin". B-008 dropped, withdrawn
    with C-3; B-052 added; the item now waits on the conversion item 0120
    in place of 0042. Rejected by the owner: `upgrade` keeping the move of
    the pin, and the pin command replacing `upgrade`. The owner's plan
    named the re-cut and the wait on the conversion item; which claims
    the item carries is spec-author's cut.

  - |
    2026-10-09, spec-author, recording the owner's decision 0006: B-005
    and B-006 are scoped to the templates the manifest does not name as
    the consumer's. Until 0130 no key names one, so this item rewrites
    every template; the named-template scenarios of both claims are 0131's.
  - |
    2026-10-11, spec-author: `0185` added to `depends_on`, and the summary
    and the B-007 line name the write set as C-2 and B-007 now state it
    (ADR-0011; 0001-F5 decision 0011). Whether `upgrade` creates a part
    `init` was not asked for is OQ-51, open.
  - |
    2026-10-24, implementer (architecture pass; nothing built): § 6 and
    § 7 "Upgrade to the pin" design the command. A `Features/Upgrade/`
    slice holds `UpgradeCommand`, `UpgradeWriter` and
    `UpgradeRegistration`, joined in `Program.cs` beside `AddInit`. The
    writer is in the host because only the tool assembly embeds the
    templates. `InitWriter`'s shipped-file mapping moves to
    `Features/ShippedFiles.cs` for its second caller. The pin comes
    from the check's `SpecSchemasLoader.LoadManifest` and
    `SpecManifestParser.PinnedVersion` and is never written. Each
    present shipped file is compared byte-exact and rewritten when it
    differs. An absent one stays absent, on OQ-51's proposed default
    (a), which is still open. Files the pin does not ship are never
    read. No frontmatter schema is touched under the on-disk source or
    a recorded upstream source (0093, 0094). Writes go through a
    generalised `SpecManifestStore` staged replace that refuses paths
    outside the two folders. A current root prints
    `.specht/ is current at schemaVersion <pin>`. Exit codes follow the
    check's existing catches, proven by 0046 and 0048. The change
    listing and manifest keys are 0047's. ADR-0014: existing stores
    and composition, no mediator or CQRS, and no ADR.
  - |
    2026-10-24, spec-author: four points the design rests on and no claim
    decides are open, each on § 7's reading as its proposed default:
    line endings in the byte comparison (OQ-61), a write failing partway
    (OQ-62), the transient staging sibling under B-007 and B-063 (OQ-63),
    and B-006's manifest keys before 0047 (OQ-64).

