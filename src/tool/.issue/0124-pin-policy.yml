summary: |
  A Could (decision 0005): a manifest setting that lets the check use the
  newest shipped patch, or the newest shipped minor, of the pinned
  version, and rejects any other value with exit 3. Value 2 for that
  reason, where the Feature's is 4. Risk 3: it is the one setting under
  which a tool release changes which version a tree is checked with.
  The owner answered OQ-11, OQ-16, OQ-29 and OQ-50 on 2026-11-01
  (decision 0020): the key, `upgrade` under a float, an unshipped pin,
  `latest-minor` below 1.0.0, and the list's marks. The exact default
  is B-055, in 0120.

acceptance_criteria:
  - "B-053 — `latest-patch`: highest shipped version with the pin's major and minor"
  - "B-054 — `latest-minor`: highest shipped version with the pin's major"
  - "B-056 — a policy value not defined: stderr, stdout empty, exit 3"
  - "B-145 — an unshipped pin under a floating policy: exit 3"
  - "B-146 — `upgrade` under a floating policy: the version in use's files"
  - "B-147 — `exact`: the pinned version"
  - "B-148 — the list marks the version in use"
  - "B-149 — no in-use mark when the check uses the pin"
  - "B-150 — `latest-minor` on a 0.y.z pin: exit 3, naming `latest-patch`"
  - "C-18 holds for every `upgrade` claim the item touches."
  - "§ 9 carries a row naming a test for each id above."

