    2026-10-09, spec-author's cut, recording the owner's decision 0006:
    B-060 to B-063 in one item, with the scenarios B-005 and B-006 gained,
    since none can be shown without the key (0130) and the rewrite (0045).
    B-064 is withdrawn into B-005 and carried by no item. Rejected: B-063
    in 0045, where its case of a name in the manifest could not be shown.

