summary: |
  As a maintainer with a template of my own, I want `upgrade` to leave
  the templates my manifest names as mine and still bring every other
  template to the pinned version, so that moving the pin does not cost me
  my template (decision 0006). `upgrade` says which templates it skipped
  and why in 0047's listing, and never creates, modifies or deletes a
  template file the pinned version does not ship (C-2, C-14). Risk 3: it
  decides which of a consumer's files `upgrade` overwrites. Waits on 0130
  for the key, 0045 for the rewrite and 0047 for the listing. B-005 and
  B-006 are 0045's; this item delivers only the cases decision 0006 added
  to them.

acceptance_criteria:
  - "B-060 — a named template is not written"
  - "B-061 — one `skipped <path>: <reason>` line after the rewritten ones, for each named template the pinned version ships, present or not"
  - "B-062 — an unnamed template no source hashes, that differs, is rewritten"
  - "B-063 — no template file the pinned version does not ship is touched"
  - "B-135 — a named template the upstream source hashes is not written"
  - "B-144 — a named template the pinned version does not ship: output and exit code as with no such name"
  - "B-005 — a template named: the frontmatter schemas still rewritten (its `@boundary` scenario)"
  - "B-006 — only a named template differs: current, nothing rewritten (its second scenario)"
  - "§ 9 carries a row naming a test for each id above."

decisions:
