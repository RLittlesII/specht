summary: |
  Decision 0016 extends the `spechtSchema` record with one SHA-256 hash
  for each template the source supplies, read under every pin. This item
  is the engine reading that member into 0176's model: the hashed
  templates, their rejections and the address each is fetched from. It
  fetches nothing; upgrade's fetch is 0291 and init's is 0292, and both
  wait on this item, as 0093 and 0095 wait on 0176.

  The member's name and key form are OQ-65, open. B-125 to B-127 are
  written on its proposed default, (a); it is not put to the owner, and
  this item does not answer it. A ruling other than (a) changes these
  claims before this item is built. The repository owner resolved OQ-66
  on 2026-10-28: the member needs no schema version and is read and
  validated under every pin, so B-128 is withdrawn.

  Waits on 0176 for the record it extends, and on 0130 for the form a
  template's name takes in the manifest, which a hash's key repeats.
  Risk 3: a member of a published manifest schema stays (C-1).

acceptance_criteria:
  - "B-125 — a `templates` object under any pin: each member a hashed template, by file name"
  - "B-126 — a template hash not in the sha256 form: invalid, the template named"
  - "B-127 — a hash for a file the pinned version does not ship: invalid, the file named"
  - "B-131 — each hashed template's address: the location followed by its file name"
  - "A manifest whose record hashes no template checks exactly as before: 0001-F1 B-004's golden baseline report is unchanged"
  - "§ 9 carries a row naming a test for each id above."

decisions:
  - |
    2026-10-24, spec-author's cut, recording the repository owner's
    decision 0016: the record apart from the two commands that fetch from
    it (0291, 0292), as 0176 was cut apart from 0093 and 0095. B-131 is
    here and not with upgrade's fetch, so the address is settled once for
    both init and upgrade and 0292 does not wait on 0291; the precedent
    is B-074 in 0176. Rejected: B-131 in 0291, which would hold init's
    fetch behind upgrade's, the order 0095's re-cut of 2026-10-11 removed.
    The cut is spec-author's, not an owner ruling.
  - |
    2026-10-24, spec-author: no item cuts schema `0.3.0`. Decision 0015
    places B-118 to B-124 in it and carries no item; 0189 builds the cut
    target and cuts no version. Which item first cuts `0.3.0` with that
    target - this one, or one for decision 0015 - is not decided and is
    left for the repository owner. Until then this item cannot pin a
    fixture to `0.3.0`. That the member is `0.3.0`'s at all rests on
    OQ-60 (a), open.
  - |
    2026-10-28, the repository owner, resolving OQ-66: the member needs
    no schema version and no `0.3.0` is cut for it, so the decision above
    no longer binds this item. It waits on no version cut and no longer
    depends on 0189; its fixtures pin any shipped version. B-128 is
    withdrawn and dropped from this item.

