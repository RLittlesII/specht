summary: |
  Schema 0.2.0's vocabulary gains SPEC014, SPEC015, SPEC022, SPEC023,
  SPEC024, SPEC032, SPEC033, SPEC034 and SPEC035 (decision 0014 call 3);
  0.1.0 keeps its 21 ids and its digest. Today SchemaVersions gives both
  versions the same 21. A vocabulary id needs a rule page under
  docs/rules/v0.2.0/ (0001-F3 B-031), so the nine pages land here, in the
  one page shape (0001-F3 B-032, B-033, A-5), each giving its rule's
  default severity as its specification states it. docs/rules is a tree
  the lock digests, so 0.2.0, never published, is relocked by decision
  0014's procedure (C-17, B-092), as 0222 did.

  The vocabulary lands before the rules. An id no rule reports adds no
  violation and no evaluated rule: the runner selects rules by the ids
  they report within the vocabulary, so a 0.2.0 tree's report does not
  move with this item alone. Every rule item for these ids depends on
  this one, because a rule whose id is outside the vocabulary never runs,
  and 0001-F5's 0223 does, because the 0.2.0 default manifest cannot list
  SPEC034 and SPEC035 before they are in it (0001-F5 B-013). The rules:
  SPEC022, SPEC023 and SPEC032 to SPEC035 under 0001-F12 (item 0224),
  SPEC014 and SPEC024 under 0001-F6 (B-013 to B-015, no item), and
  SPEC015 under 0101-F9 (B-024 to B-026; that specification is draft).
  None is built.

  Risk 3: the relock, nine pages written for rules not yet built, which
  a rule item may revise and relock again; and a release cut while some
  of the nine are in the vocabulary with no rule behind them would
  publish 0.2.0 so, and the later rules would then move a pinned tree's
  verdict under the same pin. Whether a release may do so is 0001-F7
  OQ-58, open; this item does not decide it.

acceptance_criteria:
