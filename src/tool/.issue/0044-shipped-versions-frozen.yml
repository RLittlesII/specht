summary: |
  A test that every published version is still embedded, that its
  embedded schema, manifest and template files are byte-identical and its
  rule vocabulary unchanged in this tool (C-1, decision 0002), and that a
  rule id appears only with a higher major (C-11). `0.1.0` freezes at
  first publish (A-2), so it must hold the keys Manifest and Discovery
  add — the spec review notes F7 omits F6 from its dependencies for this
  reason. Waits on 0120 for versions numbered in semver; whether `0.x` is
  frozen at all is OQ-10, and the claims hold as written until it is
  answered.

acceptance_criteria:
  - "B-004 — every published version still in the embedded set; 0120 converts the enumeration"
  - "B-013 — shipped schema, manifest and template files byte-identical"
  - "B-015 — shipped vocabulary's rule ids unchanged"
  - "B-040 — a rule id the lower version lacks: a higher major"
  - "§ 9 carries a row naming a test for each id above."

decisions:
