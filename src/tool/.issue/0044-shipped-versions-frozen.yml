summary: |
  A test that every version published from `1.0.0` on is still embedded,
  that a published version this tool ships has byte-identical embedded
  schema, manifest and template files and an unchanged rule vocabulary
  (C-1, decision 0002, decision 0007), and that a new rule id comes with
  a higher major from `1.0.0` on and at least a higher minor before it
  (C-11). OQ-10 is answered (decision 0007): the freeze starts at schema
  `1.0.0`, a published `0.x.y` is never changed in place, and a later
  tool may stop shipping it. What `0.1.0` holds at the first publish is
  OQ-30. Waits on 0120 for versions numbered in semver.

  The mechanism is the version lock (decision 0009; A-4): one committed
  file recording a digest for each locked version. The test computes
  each locked version's digest over its schema set, templates and rule
  pages and compares it (B-089, which is how B-013 is held), and fails
  when more than one shipped version is unlocked (B-090) or the unlocked
  one is not the newest (B-091). A template-only or page-only change is
  a patch (B-088). Waits on 0126 for the folders the digest reads and on
  0188 for the lock and its digest. What the test does with a locked
  version that has no folder is OQ-55, open.

acceptance_criteria:
  - "B-004 — every version published from `1.0.0` on still in the embedded set; 0120 converts the enumeration"
  - "B-013 — a published version this tool ships: schema, manifest and template files byte-identical"
  - "B-015 — a published version this tool ships: its vocabulary's rule ids unchanged"
  - "B-040 — from `1.0.0` on, a rule id the lower version lacks: a higher major"
  - "B-066 — below `1.0.0`, a rule id the lower version lacks: a higher minor"
  - "B-088 — neighbouring versions differing only in a template or a rule page's text: the patch alone"
  - "B-089 — a locked version's digest over every tree its files sit in equals the lock's"
  - "B-090 — at most one shipped version unlocked"
  - "B-091 — the unlocked version is the newest"
  - "§ 9 carries a row naming a test for each id above."

