summary: |
  A command that sets the manifest's `schemaVersion` to a named shipped
  version, above or below the current one, changing that key's value and
  nothing else in the manifest or the tree (C-13); a version the tool
  does not ship is a not-found failure. Risk 3: it writes into a
  consumer's manifest and must leave every other byte of it alone.
  Blocked on the owner: OQ-11, the command's name; OQ-14, a key only a
  higher version defines after a move down; OQ-20, whether it repairs a
  manifest whose current version the tool cannot use. OQ-23, which
  failure wins when two apply, is shared with 0123. Waits on 0120 for
  the version set.

acceptance_criteria:
  - "B-043 — a higher shipped version: pin set; exit 0"
  - "B-044 — a lower shipped version: pin set; exit 0"
  - "B-045 — manifest bytes differ only in the key's value"
  - "B-046 — no other file created, modified or deleted"
  - "B-047 — no `schemaVersion` key: added, other keys keep their value"
  - "B-048 — unshipped or malformed version named: stderr, nothing written, exit 4"
  - "§ 9 carries a row naming a test for each id above."

decisions:
