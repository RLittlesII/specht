summary: |
  The embedded folder for one schema version and the version segment of
  the `$id` of specht's own frontmatter schemas are both the integer `v1`
  today. The owner answered OQ-22 on 2026-10-11 (decision 0009): the
  folder is `v<major.minor.patch>` and the `$id` segment is the same.
  Rename `src/tool/schema/v1/`, `src/tool/templates/v1/` and
  `docs/rules/v1/` to `v0.1.0`, the embedded resource names with them,
  and rewrite the `$id` of each frontmatter schema, embedded and live:
  `https://github.com/rlittlesii/specht/schema/v0.1.0/frontmatter/<file>`,
  the `/frontmatter/` being 0001-F5 decision 0011's. The live copy is
  `.specht/manifest.json`, `.specht/schema/frontmatter/` and
  `.specht/templates/`, which item 0185 moves; where one version's
  manifest sits in the shipping copy is OQ-52, open.
  The version is then read from the folder's name, so the mapping from a
  folder to its version goes (C-16). Bring into line the layout lines in
  the skills and AGENTS.md, the README badge, `docs/`, and 0001-F7 § 6
  and § 7, 0001-F4 § 7 and § 8 and 0001-F5 § 7, which state `v1` or
  `v<n>`.

  The rule pages follow (0001-F3 A-4, decision 0003): the page folder,
  the `rules/` resource name the engine embeds them under, and the
  Schema version each page's metadata gives, which becomes `0.1.0`
  (0001-F3 B-033), with 0001-F3 § 7 and § 8, which state `v1`.

  Depends on 0120, which converted the version set this names. It must
  land before the first publish: after it the renamed bytes are a
  published version's (C-1; OQ-30).

  B-086 and B-087 are this item's. It also re-proves 0001-F4 B-005,
  which 0051 delivered against `v<n>` and 0050 rolls up, and 0001-F3
  B-033, and keeps 0001-F7 C-6 and C-16.

acceptance_criteria:
  - "B-086 — each version's folder, in every tree its files sit in, is `v<major.minor.patch>`"
  - "B-087 — each embedded frontmatter schema's `$id` carries that folder name, then `/frontmatter/` and the file's name"
  - "0001-F4 B-005 — the `$id` a written schema carries names the version as `v<major.minor.patch>`"
  - "0001-F7 C-6, C-16 — the segment and the folder name; no folder-to-version mapping in code"
  - "0001-F4 A-2 — one embedded folder for each version, named `v<major.minor.patch>`"
  - "0001-F3 A-4 — the rule-page folder and its `rules/` resource name carry the same folder name"
  - "0001-F3 B-033 — each page's Schema version is `major.minor.patch`"
  - "§ 9 carries a row naming a test for B-086 and B-087; 0001-F4 § 9 for B-005 and 0001-F3 § 9 for B-033 name tests of the new form."

