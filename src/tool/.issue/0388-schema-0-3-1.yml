  - "0.3.1 cut through 0189's target (B-094 to B-100) and locked through 0188's; relocked only as C-17 and decision 0014 allow"
  - "0.1.0, 0.2.0, 0.2.1 and 0.3.0 byte-identical and their lock entries unchanged (C-1)"
  - "This repository's live `.specht/` equals 0.3.1 and its pin moves to 0.3.1 in the same pull request (`0001-F4` B-004)"
  - "§ 9 carries a row naming a test for each id above."

