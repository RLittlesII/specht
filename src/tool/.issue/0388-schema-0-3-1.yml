summary: |
  As the maintainer of `0001-F16`, I want a schema version above the
  published `0.3.0` that differs from it only in its patch, so that
  native Gherkin claims, an addition no tree has to set, ship without
  a `0.minor` step (decision 0022).

  The cut copies `0.3.0` through 0189's target (B-094 to B-100) and
  locks it through 0188's. `0.3.1` adds no key and no rule id at the
  cut; `0001-F16`'s items add them, and `0001-F19`'s item 0413 adds the
  `mint` key and four `identifiers` grammars (`0001-F19` decision
  0003), each with a relock, while no published package carries
  `0.3.1` (C-17; decision 0014). This item
  also lands B-066 as amended and B-154, the version-number checks the
  ruling changes.

  Risk 3: `0.3.0` is published and must stay byte-identical (C-1);
  the B-066 check must tell an opt-in rule from one a tree can meet
  without the new key, whose mechanism is § 7 design; and this
  repository's live `.specht/` and pin move to `0.3.1` in the same
  pull request, because `0001-F4` B-004 fails from the cut until they
  do (the precedent is 0339, in 0321's pull request).

  Waits on nothing open: 0188 and 0189 are done. No parent, as 0321
  has none; value 4 is the value of `0001-F16`, whose items wait on it.

acceptance_criteria:
  - "B-066 — a patch step below 1.0.0 accepted only when every added rule id is an opt-in addition; the bound @B-066 scenario reworded and rebound"
