summary: |
  Upgrade's fetch: on a hash mismatch, write only content matching the
  recorded hash (C-9), never move the recorded version (C-10), and make
  no network call when no source is recorded (B-067). Reuses the fetch
  and hash check init's 0095 builds. Not on the first release's path
  (0055-F6 OQ-17, proposed). Risk 3: the network path already exists
  when this starts.

acceptance_criteria:
  - "B-026 — local hash differs, fetched content matches: written"
  - "B-027 — fetched content mismatches the hash: stderr, nothing written, exit 3"
  - "B-033 — local copy matches the hash: no network call"
  - "B-034 — the recorded upstream version and hash unchanged"
  - "B-035 — source unreachable when a fetch is needed: stderr, nothing written, exit 3"
  - "B-067 — no upstream source recorded: no network call"
  - "B-082 — each fetched schema written under the file name the manifest gives its kind"
  - "B-083 — no credential sent with the fetch"
  - "§ 9 carries a row naming a test for each id above."

decisions:
  - |
    2026-10-11, spec-author, re-cut after the repository owner's ruling
    (0055-F6 decision 0004): the fetch and hash check are built by init's
    `0095`, which no longer waits on `upgrade`; this item reuses them, so
    the edge is reversed. B-067 added. `risk` re-scored 4 to 3 by
    spec-author: the first network path is now 0095's. Not an owner
    ruling.
  - |
    2026-10-11, spec-author, after the repository owner ratified decision
    0008: B-082 and B-083 added, the name each fetched file is written
    under and a fetch that sends no credential (C-15). The cut is
    spec-author's.
  - |
    2026-10-24, implementer (architecture pass; nothing built): § 6 and
    § 7 "Upgrade fetches the recorded source" design the fetch. It
    replaces 0045's upstream skip in `UpgradeWriter.Upgrade`. For each
    `UpstreamSchemaSource.Files` kind the local copy is read through
    `SpecManifestStore.ReadConfigurationFile` under its
    `frontmatterSchemas` name; a copy matching its hash is current and
    makes no network call, an absent one stays absent (OQ-51 (a), open;
    `specht init` fetches it, B-079), and a differing one is fetched
    through 0095's `UpstreamSchemaFetcher`, which verifies before
    returning. A new `UpstreamSchemaFile.Matches` holds the hash
    identity for the writer, the fetcher and `UpstreamSchemaCopy`.
    Every read, comparison and fetch runs before the first write, so a
    mismatch, an unreachable source or a 401/404 refusal writes nothing;
    that is OQ-44's and OQ-45's proposed default, both still open for
    `upgrade`. `UpgradeCommand` catches `SpechtUpstreamSchemaException`
    as exit 3, naming the recorded address without user information.
    No manifest byte is written. The credential-free client and the
    fetcher move from `AddInit` to a shared
    `Features/UpstreamFetchRegistration.cs` that `AddInit` and
    `AddUpgrade` both call; `UpgradeWriter` takes the fetcher. Templates
    stay compared to the pinned version's until the template fetch
    (B-130 to B-137) lands. ADR-0013 and ADR-0014 hold: existing
    stores, the handler as the test seam, no mediator.

