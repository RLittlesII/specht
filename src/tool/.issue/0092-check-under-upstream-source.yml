  schema source selects the on-disk copy, the vocabulary stays the pinned
  embedded version's, and the check never fetches (C-8). It reads the
  recording 0176 defines and builds the read of the frontmatter schemas
  from `<root>/.spec/schema/`, which 0043 then reuses for the on-disk
  source a consumer selects. On the first release's path (0055-F6 C-8).

