summary: |
  `specht schema list` prints each schema version the tool ships, one to
  a line, in ascending semver precedence, marks the version the root's
  manifest pins, and is a plain list where the root has no manifest. The
  owner named the command and chose the mark, 2026-10-11 (OQ-11 and
  OQ-19, each resolved in part). Blocked on OQ-48, how the mark looks,
  and OQ-49, what the list does when the pin cannot be read; both are
  the owner's. B-041, B-042 and B-085 wait on neither. Waits on 0120 for
  the version set.

acceptance_criteria:
  - "B-041 — each shipped version, one per line; exit 0"
  - "B-042 — ascending semver precedence: `0.9.0` before `0.10.0`"
  - "B-084 — exactly the pinned version is marked"
  - "B-085 — no manifest: nothing marked"
  - "§ 9 carries a row naming a test for each id above."

decisions:
  - |
    2026-10-09, the repository owner approved a written plan (decision
    0005, OQ-13) naming a list item apart from the pin item. The claims
    it carries are spec-author's cut. Status blocked: OQ-11 and OQ-19 are open.
  - |
    2026-10-11, the repository owner, choosing among options (0001-F2
    decision 0010): the command is `specht schema list`; it marks the
    pinned version when the root has a manifest and is a plain list
    otherwise. Rejected by the owner: `specht schema --version`, and a
    `specht manifest --version` for the pinned version. spec-author's
    cut: B-084 and B-085 join this item. Status stays blocked: OQ-48 and
    OQ-49 are open. Not chosen: a second item for the mark, which would
    leave this one waiting on 0120 alone.

