summary: |
  In the manifest, upgrade adds only the keys the pinned version defines
  that the manifest lacks; every key already present keeps the consumer's
  value, and `schemaVersion` is not touched (decision 0001, decision 0005,
  OQ-6); `identifiers` is never added, so upgrade never opts a manifest
  into epics (OQ-68). It prints the pinned version and each file
  rewritten, the manifest among them when a key is added (OQ-24), and no
  diff. A root is current only when no key is missing (OQ-64, taken on
  its default (a)). A key only a higher version defines after a move down
  was resolved by decision 0012 (OQ-14). Still open, and the owner's:
  whether it also names the version the files were at (OQ-21).

acceptance_criteria:
  - "B-016 — the pinned version's absent keys added; present keys keep their value"
  - "B-017 — the pinned version and each rewritten file; no diff; provisional on OQ-21"
  - "B-059 — files already at the pin, a key added: exit 0"
  - "B-138 — a manifest declaring no epic grammar declares none after upgrade"
  - "§ 9 carries a row naming a test for each id above."

decisions:
  - |
    2026-10-08, the repository owner: OQ-6 resolved as keeping the
    consumer's value, over writing `n+1`'s default; OQ-3 as the version pair
    and file list, over a diff per file. Status moved from blocked to
    ready-for-architecture.
  - |
    2026-10-09, spec-author, recording the owner's decision 0005: upgrade
    no longer moves `schemaVersion` (B-052, in 0045), so the version pair
    of OQ-3 lost its first member; B-017 states the pinned version and is
    provisional on OQ-21. B-059 added.
  - |
    2026-10-28, the repository owner: OQ-24 resolved as reading (a), the
    manifest named in B-017's file list when upgrade adds a key, over
    naming each key or both. A-3 and B-017 amended.
  - |
    2026-10-28, spec-author, recording the owner's OQ-68 ruling: the keys
    a version defines exclude `identifiers`, so upgrade never opts a
    manifest into epics (`0001-F5` decision 0004), over adding it without
    its `epic` member or keeping the copy. B-016 amended; B-138 added.

out_of_scope:
