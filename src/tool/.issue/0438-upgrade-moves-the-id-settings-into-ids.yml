summary: |
  As a consumer moving its pin to schema `0.4.0`, I want `specht
  upgrade` to move my `mint` entries and my `identifiers` grammars for
  the seven hand-cited types into `ids` records once, so that my
  manifest is valid under `0.4.0` without a hand edit (`0001-F5`
  decision 0024).

  Waits on 0436, which cuts schema `0.4.0` with the `ids` key and
  rejects the old settings.

  Risk 3: a grammar split into a head and an `id` (B-155), a move that
  refuses rather than guesses (B-159, OQ-79), and every other manifest
  setting kept (B-158, C-19). Value 4 is the value of `0041`.

acceptance_criteria:
  - "B-155 — a customised grammar becomes a record's plain text and id, verbatim, with the literal head ending where B-155 says"
  - "B-161 — a member byte-equal to a shipped default below 0.4.0 is dropped, and the 0.4.0 shipped record applies"
  - "B-156 — a mint entry moves without its prefix"
  - "B-157, B-158 — no old id setting is left, and every other setting is kept"
  - "B-159 — an unsplittable grammar, a prefix that is not the head, an ids record already present for a moved type, and equal claim and scenario heads each write nothing, exit 3 and name the member on standard error (OQ-79 default (a))"
  - "B-160 and B-020 as amended — no change without old settings, and none under a pin below 0.4.0"
  - "B-051 as amended — `schema pin` moves a 0.4.0 manifest that still holds the old id settings back down"
  - "AGENTS.md § Configuration says `upgrade` adds only the keys the pinned version defines that are missing, except the 0.4.0 move into `ids`"
  - "`docs/cli.md` describes the move under `specht upgrade`"
  - "§ 9 carries a row naming a test for each id above."

decisions:
  - |
    2026-11-12, spec-author: cut on the repository owner's selection of
    2026-11-12, "Rejected; upgrade migrates" (`0001-F19` decision 0005;
    `0001-F5` decision 0024). spec-author's cut, not an owner ruling:
    one item for the move, after `0001-F5`'s 0436. It proceeds on
    OQ-79's default (a), refuse an unsplittable grammar.
  - |
    2026-11-12, the repository owner, "Drop it, ship default applies
    (Recommended)": a member byte-equal to the old pin's shipped default
    is dropped and the 0.4.0 shipped record applies; customised members
    move verbatim (B-161). B-051 added on spec-reviewer's round 2.
  - |
    2026-11-13, spec-author, on spec-reviewer's round-2 finding 3 for
    item 0436: B-016 leaves this item. Its `ids` clause, that `upgrade`
    adds no `ids` key, is item 0436's and delivered there; nothing of
    B-016 is left here.
  - |
    2026-11-13, spec-author, on the implementer's design pass: a `mint`
    entry that is not an object moves into its record's `mint` as it
    is; B-156 amended on C-19 ("every other moved member kept
    verbatim"), with an `@boundary` scenario. Under `0.3.1` the check
    reads no `mint` member, so such an entry is reachable and opts
    nothing in (`0001-F19` B-002). B-159's shared-head refusal names the
    members the consumer wrote, `identifiers.claim` and
    `identifiers.scenario`, as its scenario's row states, not the
    `ids.claim` and `ids.scenario` records the move would write.
  - |
    2026-11-13, spec-author, on closing: the implementer's build choices
    (`src/tool/.spec/README.md` § 7, "The move into ids at schema
    0.4.0"), recorded as role-level choices, not owner rulings. The mover
    compares the claim and scenario heads itself, before the parse, and
    names what the consumer wrote, rather than renaming the parser's
    `0001-F5` B-094 fault, whose message cannot tell a head the move made
    from one the consumer wrote; a collision among records the consumer
    already wrote under `ids` stays the parse's. `Move(byte[])` decodes
    through the pin editor's `Format` and writes the moved text back in
    the file's own encoding behind its preamble, so every byte outside
    the moved spans is the one read (B-158, C-19); the splice is by span,
    never a `JsonNode` re-serialisation. The move runs first, inside the
    check's own manifest read (`ReadManifest(root, edit)`), so the moved
    text is judged by the check's rules before any write (B-020 as
    amended). The gate is the pin, not the version in use. "The old pin"
    of B-161 is read as every shipped version below 0.4.0. `schema pin`
    sets the old settings aside under a 0.4.0 or later pin rather than
    validating the moved text, since B-051 excepts every setting
    `0001-F5` B-092 rejects, a refused grammar included.

