summary: |
  Decision 0004 says a manifest records an upstream schema source as an
  address or package, a version and a content hash. Decision 0008, ratified
  by the repository owner on 2026-10-11, names the key `spechtSchema` and
  gives it a base address, a version label and a hash for each fetched
  file. The manifest schema has no such key and the engine reads none.
  The check (0092), init's fetch (0095) and upgrade's fetch (0093) all
  read the recording, so it is cut apart and they wait on it.

  This item is the manifest schema accepting the key and the engine
  reading it into the model: the record itself, its rejections, and which
  kinds are fetched from which address. It fetches nothing. On the first
  release's path (0055-F6 C-8). Risk 3: a key in a published manifest
  schema stays.

acceptance_criteria:
  - "B-068 — a `spechtSchema` object with its three members: read as the recorded source"
  - "B-069 — a member absent: invalid, the member named"
  - "B-070 — a location that is not https: invalid"
  - "B-071 — a version that is not a non-empty string: invalid"
  - "B-072 — no hash for a fetched kind: invalid, the kind named"
  - "B-073 — a hash not in the sha256 form: invalid, the kind named"
  - "B-074 — each fetched kind's address: the location followed by the manifest's file name"
  - "B-075 — no epic grammar: the Feature and item kinds are fetched"
  - "B-076 — the epic grammar: the epic kind is fetched too"
  - "A manifest that records no source checks exactly as before: 0001-F1 B-004's golden baseline report is unchanged"
  - "§ 9 carries a row naming a test for each id above."

decisions:
  - |
    2026-10-11, spec-author's cut, after the repository owner's ruling
    that the first release waits for a schema sourced at a URL (0055-F6
    decision 0004): the recording apart from the three items that read
    it. Status `blocked`: six open questions, proposed in decision 0008
    and not put to the owner. Rejected: writing the claims against the
    proposal, which would record an undecided point as agreed.
  - |
    2026-10-11, spec-author, re-cut after the repository owner ratified
    decision 0008 with two changes: the key is `spechtSchema`, and no
    credential is read (C-15). OQ-1, for the record's names, and OQ-32 to
    OQ-38 and OQ-40 are resolved. This item takes B-068 to B-076 and
    leaves `blocked` for `ready-for-architecture`, the design pass. The
    check's claims went to 0092 and upgrade's to 0093. B-074 to B-076 are
    here, not with the fetch, so the address and the fetched kinds are
    settled before 0095 fetches; the cut is spec-author's, not an owner
    ruling. B-074's scenario runs `upgrade`, so until 0093 its proof here
    is a test of the model.

