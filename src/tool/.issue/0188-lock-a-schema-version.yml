summary: |
  The version lock (A-4, decision 0009): one committed file recording a
  digest for each locked schema version, and the build target that
  writes the newest version's entry. The digest is one value for a
  version, over its schema set, templates and rule pages; the lock lists
  no file (C-17). Locking a version already locked changes nothing, so
  a changed locked version cannot be made to pass by locking again
  (B-093).

  The target's name, the lock's path and format, and where the digest
  sits so that a test reaches it are OQ-52, open, and proceed on its
  default: `src/tool/schema/versions.lock.json`, outside the folders a
  version embeds, with the digest in code a test can call. 0044 and 0190
  read the same digest.

  Waits on 0126: a digest over the folders taken before the rename would
  record `v1` paths.

acceptance_criteria:
  - "B-092 — the lock target records the newest version and its digest"
  - "B-093 — locking a locked version: the lock unchanged"
  - "C-17 — one digest for a version, no file list; a recorded digest never rewritten"
  - "§ 9 carries a row naming a test for each id above."

decisions:
