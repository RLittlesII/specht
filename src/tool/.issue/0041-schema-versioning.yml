decisions:
  - |
    2026-10-08, Claude at the owner's request: sliced into the pinned,
    embedded version set (0042) that everything reads, then the source switch
    and the freeze test beside it, then `upgrade` as its core move (0045)
    with its failures (0046) apart, and each claim an open question blocks
    in its own item (0047, 0048) so the rest can proceed. Rejected: upgrade
    as one item, which would sit blocked on three questions for claims that
    need none.
  - |
    2026-10-08, Claude: the report's version and source fields are defined
    by Report's 0034 and filled with their true values here (0042, 0043),
    not the reverse — 0034 waiting on this Feature while 0043 waits on 0034
    would be a cycle.
  - |
    2026-10-08, Claude at the owner's request: B-024 to B-036 cut into
    three items by command and by source - the check under a recorded
    upstream source (0092), upgrade's fetch (0093), and upgrade with the
    on-disk source (0094). Rejected: folding them into 0043 or 0045,
    whose claims need no network path and would wait on one.
  - |
    2026-10-09, the repository owner approved a written plan (decision
    0005, OQ-13) that named: an item converting 0042's integer version to
    semver (0120); the list command (0121); the pin command (0122); the
    pin policy (0124); the interactive pick (0125); 0045 re-cut as
    bringing the files to the pin, and waiting on the conversion item;
    and B-008 dropped. Rejected: reopening 0042, which would erase what
    it delivered and when.
  - |
    2026-10-09, spec-author's cut, not named in the owner's plan: the
    pin command's input failures apart in 0123; the folder and `$id`
    rename apart in 0126, at the spec-reviewer's request; and which
    claim each item carries.

  - |
    2026-10-09, spec-author's cut, recording the owner's decision 0006:
    the key that names the consumer's templates apart (0130) from what
    upgrade does with it (0131). Rejected: an item validating the names
    in the key, which waits on OQ-27.
  - |
    2026-10-11, spec-author's cut, after the repository owner's ruling
    that the first release waits for a schema sourced at a URL (0055-F6
    decision 0004): the recording apart (0176), so the check and init's
    fetch wait on one answer and not on each other; B-036 apart (0177),
    so 0092 does not wait on 0043. Rejected: the recording inside 0092,
    which would block four claims that need no further answer once the
    key has a name.
  - |
    2026-10-11, spec-author, after the repository owner ratified
    decision 0008 with two changes (the key is `spechtSchema`; public
    sources only, C-15): B-068 to B-083 added and cut to 0176, 0092 and
    0093; 0176 leaves `blocked`. The cut is spec-author's, not an owner
    ruling.
  - |
    2026-10-11, the repository owner (decision 0009): the folder is the
    version; one number covers the set; a working folder and a hash
    lock. spec-author's cut, not an owner ruling: 0126 gains B-086 and
    B-087; the checks on the lock join 0044; the lock target (0188) and
    the cut target (0189) are items of this Feature, not of a `.build/`
    Feature, because the claims are this Feature's (decision 0009).
    Rejected: one item for both targets, which would hold the lock 0044
    and 0190 wait on behind the cut.

