summary: |
  As the maintainer of a lagging repository, I want the manifest to pin a
  `major.minor.patch` schema version the tool still checks, a command that
  moves the pin up or down, and `specht upgrade` to bring the schema set
  and templates to the pin and say what changed, so that lagging is
  deliberate, moving is one command each way, and the number says whether
  a move can fail my build.

  Risk 4: every shipped version stays embedded and byte-identical forever
  (C-1), so a mistake is permanent once published. Source selection names
  and compatibility are ratified in decision 0011 and designed in § 7. The embedded
  version set builds on init's shipping copy (0042 -> 0051), and init
  pinning the newest version waits on init's write (0049 -> 0052).

  Decision 0004 (2026-10-08) added B-024 to B-036, the recorded
  upstream schema source: the check under it (0092), upgrade fetching
  it (0093), and upgrade leaving on-disk schemas alone (0094).

  Decision 0005 (2026-10-09) made the version semver. 0042 delivered an
  integer pin and stays closed; 0120 converts it and starts before any
  other item here. B-008 is withdrawn and carried by no item. The list
  command (0121), the pin command (0122, 0123), the pin policy (0124)
  and the interactive pick (0125) wait on the open questions each names.
  Naming the embedded folder and the `$id` segment (0126) waits on OQ-22
  and carries no claim of this Feature: it keeps C-6.

  Decision 0006 (2026-10-09) lets a consumer keep its own templates: the
  manifest names them (0130) and upgrade leaves them, and every template
  file the tool does not ship, alone (0131). B-064 is withdrawn and
  carried by no item. A name the pinned version does not ship (OQ-27)
  and the upstream template source (OQ-26) are open and have no item.

  The repository owner, 2026-10-11: the first release waits for a
  schema sourced at a URL (0055-F6 decision 0004). The manifest key
  that records a source is cut apart (0176); the check (0092) reads
  it; B-036 is cut apart (0177); upgrade's fetch (0093) reuses init's
  (0095) and carries B-067. The owner ratified decision 0008 the same
  day, naming the key `spechtSchema` and taking no credential (C-15):
  0176 carries B-068 to B-076, 0092 B-077 to B-081 and 0093 B-082 and
  B-083.

  The repository owner, 2026-10-11 (0001-F2 decision 0010): the list
  command is `specht schema list`, it marks the version a root pins and
  is a plain list where the root has no manifest. 0121 gains B-084 and
  B-085.

  The repository owner, 2026-10-11 (decision 0009): a version's folder
  is `v<major.minor.patch>` and the `$id` segment is the same, so 0126
  leaves `blocked` and carries B-086 and B-087; one number covers the
  schema set, the templates and the rule pages; and a committed version
  lock freezes a version. 0044 checks the shipped set against the lock
  (B-088 to B-091), 0188 writes it (B-092, B-093) and 0189 cuts the next
  version (B-094 to B-100). The tag check that refuses an unlocked
  version is 0055-F6's (0190).

