summary: |
  The build target that makes the next schema version from the newest
  one (decision 0009). Given a version number, it refuses while a
  shipped version is unlocked (B-094) and refuses a number that is not
  higher than every shipped one (B-095), creating nothing either way.
  Otherwise it copies the newest version's schema set, templates and
  rule pages to the new version's folders (B-096), rewrites the `$id` of
  each frontmatter schema (B-097) and the version each rule page gives
  (B-098), and changes nothing else in a file (B-099) and nothing
  outside the new folders (B-100). The cut version is the working
  version: the cut writes no lock entry.

  The target's name and where its logic sits so that a test reaches it
  are OQ-52, open, and proceed on its default. This repository's live
  `.specht/` copy after a cut is OQ-56, open: the cut does not write it.

  Waits on 0126 for the folder name it copies to and the `$id` form it
  rewrites, and on 0188 for the lock it reads.

acceptance_criteria:
  - "B-094 — a version unlocked: fails, nothing created"
  - "B-095 — a number not higher, or not `major.minor.patch`: fails, nothing created"
  - "B-096 — the new version's folder in each tree the newest's files sit in, a file for each of the newest's"
  - "B-097 — each cut schema's `$id` names the new version"
  - "B-098 — each cut rule page gives the new version"
  - "B-099 — otherwise byte-identical to the file it was cut from"
  - "B-100 — nothing outside the new folders created or changed"
  - "§ 9 carries a row naming a test for each id above."

decisions:
  - |
    2026-10-11, spec-author's cut, on the repository owner's decision
    0009: the cut apart from the lock (0188). Rejected: one item for
    both targets, which would hold the lock 0044 and 0190 wait on behind
    the cut.

