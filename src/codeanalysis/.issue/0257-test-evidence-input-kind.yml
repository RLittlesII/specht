summary: |
  Reported in RLittlesII/specht#256, gap 4. Specht.CodeAnalysis.props adds
  every @(SpechtTestEvidence) item to AdditionalFiles with SpechtInputKind
  "evidence", while DocumentationTestMethods selects only "test-evidence".
  No other reader consumes "evidence", so a consumer's evidence artifact is
  silently ignored and no test method is recognised through the package.

  Analyzer tests inject "test-evidence" directly through analyzer config
  options, and the package integration test declares no SpechtTestEvidence
  item, so nothing covered the package-to-analyzer route.
acceptance_criteria:
  - "A SpechtTestEvidence item declared through the package reaches the analyzer's test-method recognition."
  - "A package-level integration test covers that route from the props to the analyzer."
  - "The input kind the package writes is stated in the Feature specification."
