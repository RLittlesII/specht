summary: |
  Reported in RLittlesII/specht#256. The default SpechtScenarioInputs in
  Specht.CodeAnalysis.props matches only co-located .spec/*.feature files and
  epics/**/*.feature, so a consumer keeping Gherkin in a central .spec/features
  tree must set a build property. Decision 0007 adds that tree to the default.
