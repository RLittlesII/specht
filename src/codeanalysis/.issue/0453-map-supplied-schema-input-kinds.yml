  Specht.CodeAnalysis.props computes schema kinds from file names rather
  than frontmatterSchemas. A valid nondefault schema name therefore needs
  an AdditionalFiles Update setting SpechtInputKind to schema:feature.
  No duplicate schema copy is necessary; preserve the existing workaround
  until native delivery is specified.
