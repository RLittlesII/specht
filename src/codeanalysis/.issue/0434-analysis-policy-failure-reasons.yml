claims: ["B-028", "B-029"]
created: "2026-11-11"
updated: "2026-11-11"
closed: "2026-11-11"
summary: |
  Found by a consumer walkthrough on the published `0.6.1-preview` packages:
  `Specht.CodeAnalysis` reports only the generic SPCT0001 text, "Required
  consumer input is missing, invalid or incompatible with its explicit
  mappings.", on `.specht/manifest.json` when a `codeAnalysis.enforcement`
  entry omits `exclude`, and when a `verifies` entry's `declarationKinds`
  names a kind other than `testMethod`.

  `AnalysisPolicyReader` (`src/analyzers/Policy/`) reads `exclude` as a
  required array and throws on its absence, and rejects the role, the kinds
  and the `verifies` kinds in one combined check. `AnalysisPolicy.Select`
  reads `exclude` the same way. The catch-all in `AnalysisInputReader`
  replaces each `ArgumentException`'s text with the generic message; only
  the required-case scope reaches the consumer with its own (B-026).

  Home: this Feature, 0201-F6. It owns the supplied analysis policy (B-022,
  § 7 "Supplied analysis policy") and input failure reporting (B-003,
  B-017). Neither of those claims is violated: both hold with the generic
  text. The gap is unspecified behaviour, so this item adds B-028 and B-029
  rather than amending them.

  Value 3: every consumer configuring enforcement meets the generic text
  with no field named, and the one omission the example invites is
  rejected. Risk 2: one reader and the catch in another, plus the selection
  that reads `exclude`.
acceptance_criteria:
  - "B-028 - an `enforcement` entry with no `exclude` is accepted and excludes no source, in the policy reader and in declaration selection."
  - "B-029 - each fault in decision 0008's table reports SPCT0001 with exactly that message; every other policy-reader rejection names its normalized field; no message holds a path or consumer value (C-4)."
  - "§ 5 row 5 - a missing input, a mapping that cannot be projected and a schema rejection still report the generic text."
  - "§ 7's `enforcement` row says `exclude` is optional and `verifies` takes only `testMethod`, and § 7 states the message rule beside Required-case scope."
  - "`docs/configuration.md` and `src/codeanalysis/docs/SPCT0001.md` state the same."
  - "§ 9 carries a row naming a test for each claim above."
decisions:
  - |
    2026-11-11, repository owner, recorded by spec-author: asked
    "codeAnalysis.enforcement[] entry without `exclude` currently fails with
    the generic SPCT0001 message. Which behaviour should the spec state?",
    chose "Absent = empty (Recommended)", whose option read: "Missing
    `exclude` means no exclusions; the entry is accepted. `include` stays
    required, so scope stays explicit (C-3)." Rejected: "Stay required, name
    it".
  - |
    2026-11-11, repository owner, recorded by spec-author: asked "How should
    SPCT0001 carry the specific reason for an invalid codeAnalysis policy
    (e.g. a `verifies` scope with `declarationKinds` other than
    `testMethod`)?", chose "Specific message (Recommended)", whose option
    read: "Replace the generic text with a message naming the field and
    fault, as B-026 already does for `requiredCaseScope`. Applies to
    policy-reader failures; other inputs keep the generic text." Rejected:
    "Generic + property", "Generic + appended reason".
  - |
    2026-11-11, spec-author: homed in 0201-F6. New claims B-028 and B-029
    rather than amendments to B-003, B-017 or B-022, which still hold. The
    message texts in decision 0008 are spec-author's drafting, not the
    owner's words.
out_of_scope:
  - "A specific message for an input failure outside the policy reader: § 5 row 5, decision 0008."
  - "The field as a diagnostic property, or the reason appended to the generic text: rejected by the owner."
  - "Making `include` optional: it stays required (C-3)."
