  - "B-012 to B-015, B-023, B-025 - duplicate, malformed, input-failure and missing-claim diagnostics; ordinary tags draw none"
  - "B-016, B-024, B-026 and 0201-F6 B-026 - planned and ignored cases, whole-outline and per-block planned rows"
