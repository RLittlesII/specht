summary: |
  As a consumer keeping its claims as tags on Gherkin scenarios I want the analyzer to
  build the claim catalogue from my `.feature` files so that I need no Markdown claims
  table or generated adapter. It is the largest slice of the cut and unblocks the planned-row
  and owned-key work in 0262 and 0245. It follows the design 0258 records in section 7 and
  waits on it.
