summary: |
  Fix the implementer-owned design (section 7) that 0259, 0260 and 0262 build against, so
  no later item invents a competing interpretation. It covers the manifest keys under
  `codeAnalysis` (`records.claimSource`, the claim file sets mapped to Feature identities,
  the candidate prefix, the planned, ignored and lifecycle tag lists, the Feature-tag
  agreement check), the per-project required-case scope key and its tag-expression grammar,
  the SPCT diagnostic ids, and where the Gherkin parser lives under the netstandard2.0
  analyzer target, including how it reuses the existing claim-tag parser's semantics. This
  item delivers design text only; it writes no production code and no claim.
