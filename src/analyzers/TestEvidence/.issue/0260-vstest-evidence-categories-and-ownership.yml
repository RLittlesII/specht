summary: |
  As a consumer running xUnit v2 tests under VSTest I want the evidence artifact to carry
  each case's own identity, outcome, categories and a selected flag so that ownership of a
  case key by a project can be decided independently of what its run selected. The first
  deliverable is the section 7 design for this Feature (collector, the artifact change and a
  new artifact format version if one is needed); the code follows it. The required-case
  scope grammar comes from 0258, which this item waits on. Reconciliation of the result is
  0262.
acceptance_criteria:
  - "Section 7 of the cited specification records the collector design and any new artifact format version before code is written."
  - "B-010, B-011, B-015, B-016 - per-case identity and outcome for theories and generated tests"
  - "B-012 to B-014 - method location outside the project, nonpassing outcomes, undiscovered cases"
  - "B-020, B-021, B-025, B-026 - categories, selected flag, ownership by tag expression, several projects' runs combined, incomplete-run diagnosis"
  - "section 9 carries a row naming a test for each id above."
