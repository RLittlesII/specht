summary: |
  As a consumer maintainer running Reqnroll under xUnit v2/VSTest I want my real
  scenarios and Scenario Outline rows recorded in the evidence artifact, linked to
  their discovered and executed cases with planned rows marked, so that the
  reconciliation gate sees every row without a bridge of my own. Gap 3 of consumer
  request #256; the owner's ruling is decision 0002.

  Ready for architecture, not implementation: the design must answer 0201-F4 OQ-4
  (metadata source, where the producer runs, tested Reqnroll versions), OQ-5 (how a
  project selects the producer, a public contract for the owner) and OQ-6 (which
  collectors). C-3 must hold whichever answer is chosen. No depends_on: the bridge
  (0245), the VSTest logger and its categories (0260) and the catalogue export
  (0259) are done.
acceptance_criteria:
  - "B-012 - one scenario record per Scenario and Outline from a real run"
  - "B-013 - each Examples row linked to its own case"
  - "B-014 - planned or ignored rows supplied as planned"
  - "B-015 - an undiscovered scenario or row kept as an unresolved link"
  - "B-016 - no scenario records when the producer is not selected"
  - "B-017 - scenarios sharing a title stay separate"
  - "0201-F4 OQ-4, OQ-5 and OQ-6 are resolved in place before implementation starts."
  - "§ 9 carries a row naming a test for each id above."
decisions: []
out_of_scope:
  - "The default gate's treatment of planned and active links: 0201-F5 B-018, B-019 (§ 5 row 4)."
  - "Producers for scenario frameworks other than Reqnroll (§ 5 row 6)."
  - "The packaged end-to-end consumer fixture: 0303."
  - "Everything in § 5 of the cited specification."
