  - "0201-F6 section 7 states the per-project required-case scope key and its tag-expression grammar, making 0201-F6 B-026 and 0201-F3 B-025 buildable."
  - "Section 7 names the reader's folder and namespace in the netstandard2.0 analyzer and states how it gives claim tags the existing claim-tag reading (0201-F7 C-1) with no second interpretation."
  - "A reader of section 7 alone can write the tests for 0259 and 0260 without a further design decision."
