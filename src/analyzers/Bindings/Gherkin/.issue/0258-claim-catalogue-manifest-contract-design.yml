summary: |
  Fix the implementer-owned design (section 7) that 0259, 0260 and 0262 build against, so
  no later item invents a competing interpretation. It covers the manifest keys under
  `codeAnalysis` (`records.claimSource`, the claim file sets mapped to Feature identities,
  the planned, ignored and lifecycle tag lists, the Feature-tag agreement check), the
  per-project required-case scope key and its tag-expression grammar, the SPCT diagnostic
  ids, and where the Gherkin reader lives in the netstandard2.0 analyzer, reading claim tags
  through the existing claim tag form and identifier grammar (0201-F7 decision 0002). This
  item delivers design text only; it writes no production code and no claim.
acceptance_criteria:
