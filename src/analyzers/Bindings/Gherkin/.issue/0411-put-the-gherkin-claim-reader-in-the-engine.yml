summary: |
  0201-F7 decision 0004 supersedes decision 0003. The Gherkin claim reader
  moves from `src/analyzers/Bindings/Gherkin/` into `src/specht/Model/`, beside
  `FrontmatterTextReader`, `FrontmatterText`, `MarkdownTextReader` and
  `MarkdownTextSection`. `src/analyzers/analyzers.csproj` compiles it through a
  `<Compile Include … Link="Text/…">` link, as it compiles those four. No
  project, assembly or package is added. `specht evidence` then reads claim
  files through the same reader (item 0409).

  The § 3 claims do not exist yet. The first commit is spec-author's amendment
  of 0201-F7: B-030, the catalogue export, is withdrawn in place, and every
  section that rests on decision 0003 changes with it: § 5 row 11, § 6
  "Catalogue export", § 7 "Export in the test-evidence artifact", the B-030
  scenario, and ADR-0001 items 2, 3 and 10. Tests and code follow in the same
  pull request (AGENTS.md rule 1). Then `claims:` lists the changed ids.

  The owner withdrew the `catalog` member of the test-evidence artifact in this
  item (decision below). The member is built (item 0259): the 0201-F3 artifact
  contract defines it at `formatVersion` 2 and 3, the analyzer exporter writes
  it, the MTP collector and VSTest logger pass it through, and the tool's
  `Contract/` reader reads it. This item removes it from all of them. What that
  removal means for `formatVersion` is 0201-F3's to decide, in its owner
  sections, within this item.

  The reader today builds the analyzer's `BindingClaim`, `BindingClaimElement`,
  `BindingClaimCase` and `BindingFinding`. A linked engine file cannot name
  them, so the design gives the moved reader its own result types and the
  analyzer maps them. That design is the implementer's.

  Other records that cite decision 0003 and need their owner's rewording: the
  0201-F6 § 7 paragraph saying claim-tag reading lives in the analyzer and that
  the tool reads the catalogue from the artifact; 0201-F3 § 7 `catalog`; and
  `docs/native-gherkin-claims.md`, which says the catalogue is exported with
  the evidence.

  Value 4: it blocks 0409 and therefore 0302, milestone 0.6.0. Risk 5: one
  reader shared by two projects' compiles, result types tied to the analyzer's
  records, and the removal of a released artifact member from its contract,
  one exporter, two pass-through writers and the tool's reader, with a
  `formatVersion` consequence still to decide. Raised from 4 because the
  withdrawal turned an open ruling into a change to a released wire contract
  across four more components.
