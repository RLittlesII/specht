  - |
    2026-11-06, repository owner, recorded by spec-author. On the catalogue
    export: "This sounds like uncessary coupling. It does not sounds like what I
    would ask you to do." Asked where the Gherkin claim reader should live so
    the tool can use it: "In the specht engine". Then: "same place as the yaml
    ... and markdown readers ... right?!" Asked whether to rework PR #767 on
    that basis: "Yes." The move into `src/specht/Model/` and the source link
    are spec-author's reading of those words (decision 0004). Rejected: the
    catalogue export, a shared assembly (ADR-0021), and a second reader in the
    tool.
  - |
    2026-11-06, spec-author: homed in 0201-F7, which owns the reader and B-030.
    0409 waits on it. Rejected: folding it into 0409, which amends 0201-F5;
    each item amends one Feature's § 3.
  - |
    2026-11-06, repository owner, recorded by spec-author. Asked "What happens
    to the released catalog field in the evidence file?", the owner answered:
    "Withdraw it in 0411". B-030 is withdrawn in place, and the `catalog`
    member leaves the artifact contract, its writers and the tool's reader in
    this item.
