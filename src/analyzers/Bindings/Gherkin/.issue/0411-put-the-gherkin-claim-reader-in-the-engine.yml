summary: |
  0201-F7 decision 0004 supersedes decision 0003. The Gherkin claim reader
  moves from `src/analyzers/Bindings/Gherkin/` into `src/specht/Model/`, beside
  `FrontmatterTextReader`, `FrontmatterText`, `MarkdownTextReader` and
  `MarkdownTextSection`. `src/analyzers/analyzers.csproj` compiles it through a
  `<Compile Include … Link="Text/…">` link, as it compiles those four. No
  project, assembly or package is added. `specht evidence` then reads claim
  files through the same reader (item 0409).

  The § 3 claims do not exist yet. The first commit is spec-author's amendment
  of 0201-F7: B-030, the catalogue export, is withdrawn or amended, and so is
  every section that rests on decision 0003: § 5 row 11, § 6 "Catalogue
  export", § 7 "Export in the test-evidence artifact", the B-030 scenario, and
  ADR-0001 items 2, 3 and 10. Tests and code follow in the same pull request
  (AGENTS.md rule 1). Then `claims:` lists the changed ids.

  Not decided: whether the test-evidence artifact keeps its `catalog` member.
  Decision 0004 says the artifact need not carry one. The member is built
  (item 0259): the 0201-F3 artifact contract has it at `formatVersion` 2 and 3,
  the MTP collector and VSTest logger pass it through, and the tool's
  `Contract/` reader reads it. Withdrawing B-030 outright changes that
  contract. The owner rules on it before the § 3 amendment, and the ruling is
  recorded as a 0201-F7 decision.

  The reader today builds the analyzer's `BindingClaim`, `BindingClaimElement`,
  `BindingClaimCase` and `BindingFinding`. A linked engine file cannot name
  them, so the design gives the moved reader its own result types and the
  analyzer maps them. That design is the implementer's.

  Other records that cite decision 0003 and need their owner's rewording: the
  0201-F6 § 7 paragraph saying claim-tag reading lives in the analyzer and that
  the tool reads the catalogue from the artifact; 0201-F3 § 7 `catalog`; and
  `docs/native-gherkin-claims.md`, which says the catalogue is exported with
  the evidence.

  Value 4: it blocks 0409 and therefore 0302, milestone 0.6.0. Risk 4: one
  reader shared by two projects' compiles, result types tied to the analyzer's
  records, and a built artifact member whose future needs a ruling.
