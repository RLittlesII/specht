summary: |
  As a consumer running specht evidence I want to name the evidence paths as positional
  arguments, the way specht frontmatter takes its path, so that the command name is not
  repeated by a required option. --evidence stays an accepted alias so existing scripts and
  build targets keep working. Decision 0006 records the union order and which callers switch.
