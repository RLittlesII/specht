  - "B-025 - both forms together supply the union, positional first, then the existing de-duplication"
  - "B-026 - neither form given keeps exit 2 with the no-evidence finding"
  - "B-027 - help shows the optional positional paths and describes --evidence as their alias; docs/cli.md matches the help"
