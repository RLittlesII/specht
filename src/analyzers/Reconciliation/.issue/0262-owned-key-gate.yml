summary: |
  As a consumer partitioning one set of claim files across test projects I want the default
  gate to pass only when every case key a project owns passed in that project's own run, so
  that a key owned elsewhere never fails or satisfies another project. B-017 is Amended and
  its current tests prove the earlier wording. B-018 and B-019 are Missing and need the
  planned marks from the catalogue, which is why 0259 is a dependency along with 0260. The
  Feature is `approved`, so the reviewer must decide whether the amended and new claims
  need re-approval.
