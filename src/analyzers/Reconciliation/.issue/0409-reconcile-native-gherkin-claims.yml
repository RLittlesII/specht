  - "0201-F5 OQ-5 is resolved in place, or the claims follow its recorded default and cite it."
  - "A Gherkin-only manifest with no mapped claims section reconciles; the claim files, read through the engine's reader, are the claim source."
  - "The Markdown claim path's reports are unchanged: every claim not Withdrawn keeps its § 9 tests green."
  - "The gate counts the projects OQ-5's resolution names; under its proposed default, a consumer declaring a production project for `implements` enforcement reaches a complete default gate with only its test project's evidence."
  - "§ 9 carries a row naming a test for each new claim id."
