summary: |
  Two gaps item 0302's packaged consumer fixture found in `specht evidence`
  (branch `0302/packaged-gherkin-vstest-fixture`, commit `38670c0d`). One
  writer per specification, so both are one item.

  Native claims. Under a Gherkin-only manifest `specht evidence` exits 3 with
  `invalidInput` on `.specht/manifest.json`: `EvidencePolicy` requires a mapped
  `claimsSection`, and `EvidenceReconciler.ReadClaims` reads only Markdown
  claims tables. The owner put native claims in scope (0201-F5 decision 0007,
  OQ-3 resolved); the reconciler reads them from the claim files through the
  engine's Gherkin claim reader (0201-F7 decision 0004), not from the
  artifact's `catalog`. Item 0411 moves that reader into `src/specht/Model/`,
  so this item waits on it.

  The gate's project set. `EvidenceReconciler.Reconcile` needs a current export
  for every project in `codeAnalysis.projects`. Enforcement requires the
  production project to be declared there, and no collector writes an export
  for it, so a consumer with production `implements` enforcement never reaches
  a complete gate. 0201-F5 B-022 says "declared test project". Which projects
  count is 0201-F5 OQ-5; this item proceeds on its proposed default.

  The § 3 claims do not exist yet. The first commit is spec-author's amendment
  of 0201-F5 § 3, and of § 5 rows 5 and 6, which decision 0007 assigns here; tests
  and code follow in the same pull request (AGENTS.md rule 1). Then `claims:`
  lists the new ids.

  Value 4: it blocks 0302, milestone 0.6.0, and every native-claim consumer's
  gate. Risk 3: a second claim source in the reconciler, beside the Markdown
  path it must leave unchanged.
acceptance_criteria:
