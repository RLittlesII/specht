summary: |
  As a maintainer configuring an MCP client I want one entry that runs `specht-mcp`, a program of its own, so that every agent in the repository reaches the answers with no terminal session.

  The host is the program `src/mcp` and the package `specht.mcp` (ADR-0031; OQ-2), composed by the one factory (OQ-10) and holding no engine (C-9). It serves no answer of its own (C-5): 0329, 0359 and 0330 deliver in one pull request, so no host item is done while the host serves nothing (epic `0132` § Features, candidate B). Order: 0329 first, then 0359, which finds the pinned tool, then 0330.

acceptance_criteria:
  - "B-001 — a discovery request gets the server's identity"
  - "B-002 — standard input and output only"
  - "B-003 — no listening port"
  - "B-004 — no outbound call"
  - "B-005 — stdout carries only protocol messages"
  - "B-006 — the stated version is the MCP's own package version"
  - "B-008 — a session writes nothing"
  - "B-009 — the root from `--root` or the working directory"
  - "B-010 — a root that is not a directory exits `2`"
  - "B-011 — a missing or rejected manifest still starts"
  - "B-012 — closed input exits `0`"
  - "B-013 — help names the options"
  - "B-014 — a request naming a supported revision is served"
  - "B-019 — an unsupported revision gets the unsupported-version error"
  - "B-033 — the error lists the supported revisions"
  - "B-032 — a legacy initialize gets an error naming the supported revision"
  - "§ 9 carries a row naming a test for each id above."

