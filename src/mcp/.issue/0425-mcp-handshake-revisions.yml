summary: |
  Claude Code reports `specht (CONNECTION_CLOSED)` for specht-mcp. The host
  pinned the protocol revision to 2026-07-28, so every `initialize`, whatever
  revision it named, was refused with error -32022 and the client closed. With
  the pin removed the SDK negotiates 2024-11-05, 2025-03-26, 2025-06-18 and
  2025-11-25. The agreement is amended to support them beside 2026-07-28; the
  amendment awaits the owner's ratification (`0132-F3` OQ-13, ADR-0034).

acceptance_criteria:
  - "B-036 — handshake for 2025-06-18 and 2025-11-25"
  - "B-037 — handshake for 2024-11-05 and 2025-03-26"
  - "B-038 — a revision earlier than 2024-11-05 answered with 2025-11-25"
  - "B-039 — a revision later than 2026-07-28 refused as having no handshake"
  - "B-014, B-019, B-032 as reworded still hold; B-032's § 9 row is Missing until its test is changed."
  - "`docs/mcp.md` names the supported revisions and the refusal of a later one."
  - "§ 9 carries a row naming a test for each id above."

decisions:
