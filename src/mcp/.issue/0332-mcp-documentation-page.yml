summary: |
  As a maintainer configuring an MCP client I want one page with the configuration entries, the tools the host offers and how to restore, pin and update the tool, so that I set up the server and fix what its messages report without reading the source.

  The page names each tool once, by the name of the command it serves (`0132-F4` C-7), and is held to the tools the host registers (C-8), and has one entry for each thing the host's messages point to (B-031). Waits on 0331: the first release's tools are all registered there.

acceptance_criteria:
  - "B-015 — the entries run `dotnet specht-mcp` and `specht-mcp`, each naming the root"
  - "B-016 — exactly the tools the host offers, one entry each"
  - "B-031 — an entry for restoring, pinning and updating the tool, at the anchors `restore-the-tool`, `pin-the-tool` and `update-the-tool` (`0132-F3` C-12)"
  - "§ 9 carries a row naming a test for each id above."

