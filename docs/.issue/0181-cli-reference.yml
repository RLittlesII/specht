summary: |
  The repository owner, 2026-10-11: "I think the command matrix in the README
  is horrible as well. I think we should clearly demonstrate the full api
  surface." `README.md` and `src/tool/README.md` list `--report <path>`,
  `specht upgrade` and `--explain`, and the tool accepts none of them; it
  accepts `specht [--root <DIR>] [--strict] [--json]` and
  `specht init [--root <DIR>]`. The owner's three answers are decision 0001
  of the Feature.

  Value 4: the page a consumer reads to learn the command line, and two
  readmes that are wrong today. Risk 2: one page of prose, two readmes and
  one test over the help. Both scores are spec-author's.

  Expected files: new `docs/cli.md`; `README.md` ("Usage" and the
  "Documentation" list); `src/tool/README.md` ("Commands"); the tests and
  step definitions for the claims; § 6 to § 9 of the specification by their
  owners.

  Delivered files: `docs/cli.md`, `README.md`, `src/tool/README.md`,
  `AGENTS.md` (§ CLI, one statement), `docs/setup.md` (one link),
  `docs/.spec/**`, `test/acceptance/Docs/CommandLineReferenceSteps.cs`,
  `test/acceptance/acceptance.csproj`, `epics/0002-documentation/epic.md`
  and `.issue/.sequence`.

