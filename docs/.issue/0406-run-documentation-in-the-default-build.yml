summary: |
  `./build.sh` with no target runs the documentation enforcement of `0404`
  and the API-reference target of `0405`, with no separate manual step, so an
  undocumented public member fails the default build, as B-001's scenario
  reads it.

  It waits on `0404` and `0405`: the enforcement and the target it puts on
  the default path must exist first.

  If the change moves a target CI runs, `.github/workflows/ci.yml` is
  generated: regenerate it with `./build.sh Compile`, commit the
  regeneration, and diff the step order. Never edit it by hand.

  Value 3 and risk 1 are spec-author's: a dependency edge in the build graph.

  Expected files: `.build/SpechtBuild.cs`; `.github/workflows/ci.yml` if
  regenerated; the tests and step definitions for B-005; § 6 to § 9 of the
  specification by their owners.

