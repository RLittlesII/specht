summary: |
  A public type or member of `src/specht` or `src/tool` with no XML doc
  comment fails the build with `CS1591` as an error, and only the public
  surface is held to it (C-3).

  Today the opposite holds. `Directory.Build.props` turns on
  `GenerateDocumentationFile` and adds `1591` to `NoWarn` together, and only
  when `SpechtCodeAnalysisPackageVersion` is set, for `analyzers`, `specht`
  and `tool`. Outside that condition no documentation file is generated; inside
  it `CS1591` is suppressed. `TreatWarningsAsErrors` is already on for every
  project, so the warning becomes an error once the two projects generate the
  file and stop suppressing it.

  The scope includes writing the missing XML doc comments on every public
  type and member of the two projects, so the build stays green in the same
  pull request. Each comment says what the type or member does; it is not a
  restatement of its name. Narrowing a type to `internal` instead of
  documenting it changes the engine's contract (A-5) and is `implementer`'s
  call in § 7, not a way round the claim.

  Value 4 and risk 2 are spec-author's: the owner's requirement, and a build
  setting plus comment-writing across about 170 files with a known end state.

  Expected files: `Directory.Build.props`; `src/specht/**/*.cs` and
  `src/tool/**/*.cs` (doc comments only); the tests and step definitions for
  B-001; § 6 to § 9 of the specification by their owners.

acceptance_criteria:
