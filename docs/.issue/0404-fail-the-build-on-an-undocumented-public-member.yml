  - "Constraints preserved: 0002-F1 C-3 — no enforcement on internal or private members, and no blanket `TreatWarningsAsErrors` change."
  - "No behaviour of the tool changes; the golden baseline reports are unchanged."
  - "`./build.sh Format`, `./build.sh Specht` and `./build.sh` pass."
  - "§ 9 carries a row naming a test for each id above."

