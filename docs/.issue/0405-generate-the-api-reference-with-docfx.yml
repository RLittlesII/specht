summary: |
  A NUKE target generates the API reference of `src/specht` and `src/tool`
  with DocFX from their XML doc comments, writes it under `.artifacts/`, and
  publishes nothing (C-1, C-2, C-4). DocFX is the repository owner's ruling
  (decision 0002).

  The scope includes the ADR `0002-F2` C-2 asks for: DocFX, the alternatives
  considered - Astro Starlight with a separate XML-to-Markdown generator -
  and the trade-off, and the output format `0002-F1` OQ-1 left to
  `implementer`. One ADR covers the reference and the site, so it is placed
  by blast radius, and the site's item `0407` cites it. It is written before
  the design in § 7.

  Hazards for `implementer`:
  - C-4 forbids an absolute path or a timestamp in the output. DocFX's
    metadata records where each type is declared; this item shows what it
    writes and holds it to repository-relative paths, or turns it off.
  - The SDK is an `11.0` release candidate (`global.json`) and every project
    targets `net10.0` and `net11.0`. Whether DocFX reads the projects or
    needs the built assemblies and their XML documentation files is the
    risk of this item.
  - No documentation file is generated outside the code-analysis condition
    in `Directory.Build.props` until `0404` lands; this target does not
    depend on it, and B-002's scenario reads a reference of whatever the
    public surface documents.
  - DocFX enters the build as a pinned tool, never at a floating version.

  It does not join the default build: that is `0406` (B-005).

  Value 4 and risk 3 are spec-author's: the reference the site publishes,
  and a new tool against a prerelease SDK.

  Expected files: `.build/SpechtBuild.cs` or a new `.build/` partial;
  `.config/dotnet-tools.json`; the DocFX configuration; the ADR; the tests
  and step definitions for B-002 and B-004; § 6 to § 9 of the specification
  by their owners.

acceptance_criteria:
  - "B-002 — a reference from the doc comments, under `.artifacts/`, never committed"
  - "B-004 — the target publishes nothing"
  - "Constraints preserved: 0002-F1 C-1, C-2, C-4."
  - "The ADR records DocFX, Astro Starlight as the alternative, the trade-off and the output format, and is accepted before § 7's design for B-002."
  - "`./build.sh Format`, `./build.sh Specht` and `./build.sh` pass."
  - "§ 9 carries a row naming a test for each id above."

