summary: |
  CI publishes the site `0407` builds to GitHub Pages, at a public URL that
  stays the same across releases. GitHub Pages and publishing from CI are
  the repository owner's ruling (decision 0001).

  It waits on `0407`: there is no site to publish before it.

  Two open questions block B-002, and this item does not answer either by
  assumption:
  - OQ-3: the repository is private, so a public URL depends on the owner's
    GitHub plan.
  - OQ-4: whether the site publishes on each push to `main` or from each
    release.

  Hazards for `implementer`:
  - The workflows are generated by NUKE from `.build/SpechtBuild.GitHubActions.cs`
    and `.build/SpechtBuild.Release.cs`; `.github/workflows/*.yml` is never
    edited by hand. Regenerate with `./build.sh Compile`, commit the
    regeneration, and diff the step order. A workflow invokes a NUKE target;
    a hand-written step is only for what the attribute cannot express.
  - Every generated workflow sets `pages: none`. Deploying to Pages needs
    `pages: write` and `id-token: write`, for the publishing job alone.
  - The lane script groups items by `spec:` and home, so it does not see
    that this item writes the generated workflows other `.build/` and
    `.github/` items regenerate. Sequence it against them by hand.

  Value 3 and risk 3 are spec-author's: the Feature's value, and generated
  workflows, raised permissions and two open questions.

  Expected files: `.build/SpechtBuild.GitHubActions.cs` or
  `.build/SpechtBuild.Release.cs`; the regenerated `.github/workflows/`;
  the repository's Pages setting, by the owner; the tests and step
  definitions for B-002; § 6 to § 9 of the specification by their owners.

acceptance_criteria:
  - "B-002 — CI publishes the site to a stable public URL"
  - "OQ-3 and OQ-4 resolved in § 11 before § 7's design for B-002."
  - "Constraints preserved: 0002-F2 C-2; 0002-F1 C-4."
  - "`./build.sh Format`, `./build.sh Specht` and `./build.sh` pass."
  - "§ 9 carries a row naming a test for each id above."

