summary: |
  The upload step 0070 added runs on both legs of the operating-system
  matrix, so Codecov receives two uploads per commit. Restrict it to the
  ubuntu-latest leg; the windows-latest leg still runs its tests and
  uploads nothing (A-2).

acceptance_criteria:
  - "B-002 — ubuntu-latest uploads; windows-latest uploads none"
  - "§ 9 carries a row naming a test for each id above."

decisions:
  - |
    2026-10-09, the owner: coverage is uploaded from the ubuntu-latest leg
    only, the source of truth; the double upload from both legs is
    rejected. Accepted tradeoff: a line covered only on Windows no longer
    counts as covered.

